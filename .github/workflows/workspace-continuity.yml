name: workspace-continuity

on:
  push:
    paths:
      - "systems/workspace/**"
      - "network/tests/test_workspace_continuity.py"
      - ".github/workflows/workspace-continuity.yml"
  pull_request:
    paths:
      - "systems/workspace/**"
      - "network/tests/test_workspace_continuity.py"
      - ".github/workflows/workspace-continuity.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify independent lanes, return points and restart
        run: python -m unittest -v network.tests.test_workspace_continuity
