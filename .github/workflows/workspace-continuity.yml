name: workspace-continuity

on:
  push:
    paths:
      - "systems/workspace/**"
      - "network/tests/test_workspace_continuity.py"
      - "network/tests/test_process_workstation.py"
      - "network/tests/test_correspondence_worker_handoff.py"
      - "network/tests/test_workstation_monitor.py"
      - "network/tests/test_workstation_http.py"
      - "network/tests/test_workstation_two_processes.py"
      - "network/tests/test_workstation_inspections.py"
      - "network/tests/test_workstation_controls.py"
      - "runtime/http/workstation.*"
      - "runtime/http/index.html"
      - "runtime/examples/correspondence_worker.py"
      - "runtime/examples/workstation_two_processes.py"
      - ".github/workflows/workspace-continuity.yml"
  pull_request:
    paths:
      - "systems/workspace/**"
      - "network/tests/test_workspace_continuity.py"
      - "network/tests/test_process_workstation.py"
      - "network/tests/test_correspondence_worker_handoff.py"
      - "network/tests/test_workstation_monitor.py"
      - "network/tests/test_workstation_http.py"
      - "network/tests/test_workstation_two_processes.py"
      - "network/tests/test_workstation_inspections.py"
      - "network/tests/test_workstation_controls.py"
      - "runtime/http/workstation.*"
      - "runtime/http/index.html"
      - "runtime/examples/correspondence_worker.py"
      - "runtime/examples/workstation_two_processes.py"
      - ".github/workflows/workspace-continuity.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify workstation, source editions, and two unlike worker computations
        run: python -m unittest -v network.tests.test_workspace_continuity network.tests.test_process_workstation network.tests.test_correspondence_worker_handoff network.tests.test_workstation_monitor network.tests.test_workstation_http network.tests.test_workstation_two_processes network.tests.test_workstation_inspections network.tests.test_workstation_controls
      - name: Reproduce finite worker handoff
        run: python -m runtime.examples.correspondence_worker
      - name: Reproduce two-process workstation in isolated ephemeral CI state
        run: python -m runtime.examples.workstation_two_processes --data-dir /tmp/ci-workstation-two-processes --execute
