name: ARC owned mistake-led A-B original SDK
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_ab_operating_loop.py'
      - '.github/workflows/arc4-sp80-owned-mistake-led-ab.yml'
jobs:
  original-owned-AB-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile native mistake-led method
        run: python -m compileall -q work/arc3/native_sp80_stage4_ab_operating_loop.py
      - name: Execute rooted native A-B correction from actual failures
        run: python -m work.arc3.native_sp80_stage4_ab_operating_loop --out runtime/data/arc4/owned-original-sp80-mistake-led-ab.json
      - name: Preserve successes and mistakes, including native frame arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-original-sp80-mistake-led-ab
          path: runtime/data/arc4/owned-original-sp80-mistake-led-ab.*
          if-no-files-found: error
          retention-days: 14
