name: ARC4 original SDK Level4 lower L vs middle bar relative contact
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_middle_l_compensation.py'
      - 'work/arc3/arc4_middle_l_compensation_contract.json'
      - 'work/arc3/arc4_middle_l_compensation_gate.py'
      - 'work/arc3/middle_l_compensation_workstation.py'
      - '.github/workflows/arc4-middle-l-compensation-workstation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-sdk-native-level4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK and numeric frame reader
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile actual SDK movement and separate source verifier
        run: |
          python -m compileall -q \
            work/arc3/native_sp80_stage4_middle_l_compensation.py \
            work/arc3/arc4_middle_l_compensation_gate.py \
            work/arc3/middle_l_compensation_workstation.py
      - name: Freeze original Level4 finite source matrix and SDK official success oracle
        run: python -m work.arc3.arc4_middle_l_compensation_gate pre
      - name: Run 24 genuine original Level4 SDK sessions via source-fingerprinted ProcessWorkstation
        run: |
          python -m work.arc3.middle_l_compensation_workstation \
            --execute \
            --data-dir runtime/data/arc4/middle-l/workstation \
            --out runtime/data/arc4/middle-l/original-middle-l.json
      - name: Independently verify native NPZ and every real SDK receipt / cup / displacement
        run: |
          python -m work.arc3.arc4_middle_l_compensation_gate post \
            --result runtime/data/arc4/middle-l/original-middle-l.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-level4-middle-l-relation
          path: |
            runtime/data/arc4/middle-l/original-middle-l.*
            runtime/data/arc4/middle-l/workstation/**
          if-no-files-found: warn
          retention-days: 90
