name: ARC4 actual SP80 original SDK level4 source inventory
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_entry_inventory.py'
      - '.github/workflows/arc4-sp80-stage4-entry-inventory.yml'
jobs:
  genuine-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install true original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile source-native stage4 inventory
        run: python -m compileall -q work/arc3/native_sp80_stage4_entry_inventory.py
      - name: Reproduce official level4 and run 24 source probe games
        run: python -m work.arc3.native_sp80_stage4_entry_inventory --out runtime/data/arc4/original-sp80-stage4-entry-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-entry-inventory
          path: runtime/data/arc4/original-sp80-stage4-entry-inventory.*
          if-no-files-found: error
          retention-days: 14
