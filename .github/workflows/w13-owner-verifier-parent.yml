name: exact-owner-W13-native-verifier-parent
on:
  pull_request:
    paths:
      - 'systems/workspace/game_native_verifier_bridge.py'
      - 'systems/workspace/game_native_verifier_worker_source/**'
      - 'network/tests/test_w13_owner_verifier_parent.py'
      - 'systems/workspace/W13_OWNER_VERIFIER_PARENT.md'
      - '.github/workflows/w13-owner-verifier-parent.yml'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/game_native_verifier_bridge.py'
      - 'systems/workspace/game_native_verifier_worker_source/**'
      - 'network/tests/test_w13_owner_verifier_parent.py'
      - 'systems/workspace/W13_OWNER_VERIFIER_PARENT.md'
      - '.github/workflows/w13-owner-verifier-parent.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing original native workstation dependency
        run: python -m pip install 'cryptography>=45,<47' 'rdflib>=7,<8'
      - name: Verify exact owner parent admission plus original nine-job compatibility
        run: python -m unittest -v network.tests.test_w13_owner_verifier_parent network.tests.test_game_native_verifier_temporal_join
