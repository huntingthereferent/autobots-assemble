name: ARC3 true original SP80 stage3 selection equivalence map
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_source_selection_classes.py'
      - '.github/workflows/arc3-sp80-stage3-source-selection-classes.yml'
jobs:
  true-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile actual source selector
        run: python -m compileall -q work/arc3/native_sp80_stage3_source_selection_classes.py
      - name: Run 16 original SDK stage3 selection probes
        run: python -m work.arc3.native_sp80_stage3_source_selection_classes --out runtime/data/arc3/original-sp80-stage3-source-selection-classes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-selection-classes
          path: runtime/data/arc3/original-sp80-stage3-source-selection-classes.*
          if-no-files-found: error
          retention-days: 14
