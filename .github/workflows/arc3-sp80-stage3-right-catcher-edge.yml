name: ARC3 original SP80 source right catcher edge contact
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_right_catcher_edge.py'
      - '.github/workflows/arc3-sp80-stage3-right-catcher-edge.yml'
jobs:
  genuine-native-original-sp80:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original SDK native trial
        run: python -m compileall -q work/arc3/native_sp80_stage3_right_catcher_edge.py
      - name: Measure fifty original SDK right-catcher edge contact games
        run: python -m work.arc3.native_sp80_stage3_right_catcher_edge --out runtime/data/arc3/original-sp80-stage3-right-catcher-edge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-right-catcher-edge
          path: runtime/data/arc3/original-sp80-stage3-right-catcher-edge.*
          if-no-files-found: error
          retention-days: 14
