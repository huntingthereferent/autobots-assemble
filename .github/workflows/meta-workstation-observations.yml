name: A-B meta workstation observations
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meta-workstation-observations.yml"
      - "systems/workspace/meta_collect.py"
      - "systems/workspace/meta_daily.py"
      - "systems/workspace/meta_health.py"
      - "network/tests/test_meta_health.py"
      - "network/tests/test_meta_daily.py"
      - "systems/workspace/meta_route.py"
      - "docs/live/meta-registry.json"
      - "network/tests/test_meta_route.py"
      - "systems/workspace/meta_transfer.py"
      - "network/tests/test_meta_transfer.py"
      - "docs/live/meta-handoffs.json"

permissions:
  contents: write

concurrency:
  group: ab-meta-observation-history
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read isolated observation branch
        run: |
          git fetch origin meta-observations
          git worktree add --detach "$RUNNER_TEMP/ab-meta-observations" FETCH_HEAD
      - name: Capture source-owned job counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 systems/workspace/meta_collect.py --registry docs/live/meta-registry.json --history-path "$RUNNER_TEMP/ab-meta-observations/history.json"
      - name: Count full-day GitHub outcomes including later passes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 systems/workspace/meta_daily.py \
            --registry docs/live/meta-registry.json \
            --output "$RUNNER_TEMP/ab-meta-observations/daily.json"
      - name: Test daily outcome contract
        run: python3 -m unittest -v network.tests.test_meta_daily
      - name: Record current unresolved workflow checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 systems/workspace/meta_health.py \
            --registry docs/live/meta-registry.json \
            --previous "$RUNNER_TEMP/ab-meta-observations/health.json"
      - name: Test current-check contract
        run: python3 -m unittest -v network.tests.test_meta_health

      - name: Test evidence-gated routing contract
        run: python3 -m unittest -v network.tests.test_meta_route
      - name: Write routing advice next to immutable observations
        run: |
          python3 systems/workspace/meta_route.py \
            --history "$RUNNER_TEMP/ab-meta-observations/history.json" \
            --registry docs/live/meta-registry.json \
            --output "$RUNNER_TEMP/ab-meta-observations/routing.json"
      - name: Verify departure and incoming-receipt evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest -v network.tests.test_meta_transfer
          python3 systems/workspace/meta_transfer.py \
            --registry docs/live/meta-registry.json \
            --source docs/live/meta-handoffs.json \
            --output "$RUNNER_TEMP/ab-meta-observations/handoffs.json"
      - name: Save recorded observations
        run: |
          cd "$RUNNER_TEMP/ab-meta-observations"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json routing.json daily.json health.json handoffs.json
          git commit -m "Record source-owned A B status counts"
          git push origin HEAD:meta-observations
