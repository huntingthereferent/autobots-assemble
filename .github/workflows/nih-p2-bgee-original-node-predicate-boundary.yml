name: NIH P2 Lane C E16 original node RO predicate boundary census
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_p2_bgee_original_node_predicate_boundary.py'
      - 'network/tests/test_nih_p2_bgee_original_node_predicate_boundary.py'
      - '.github/workflows/nih-p2-bgee-original-node-predicate-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whole-original-general-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install general OWL RL and independent RDFLib baseline
        run: python -m pip install 'rdflib>=7,<8' 'owlrl>=7,<8'
      - name: Download immutable complete original author sources under whole-file integrity checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nih-c-bgee" "$RUNNER_TEMP/nih-c-ro" lane-c-e16-evidence
          python - <<'PY'
          from systems.workspace import nih_p2_author_genex_bgee_ro_mapping_gate as b
          from systems.workspace import nih_p2_original_bgee_real_expression_join as trial
          from systems.workspace import nih_phase2_external_obo_graph_trial as ro
          from pathlib import Path
          from urllib.request import Request, urlopen
          from hashlib import sha256
          import os
          header={"User-Agent":"NIH-P2-LaneC-FullProfile/1.0"}
          out=Path(os.environ["RUNNER_TEMP"])/"nih-c-bgee"
          for filename,pin in b.FILES.items():
              url="https://raw.githubusercontent.com/"+b.OWNER+"/"+b.COMMIT+"/obda/"+filename
              with urlopen(Request(url,headers=header),timeout=60) as response:
                  if response.status!=200 or response.geturl()!=url:
                      raise ValueError("author source URL differed")
                  raw=response.read(1_000_001)
              if len(raw)>1_000_000 or b.git_blob(raw)!=pin:
                  raise ValueError("author Git blob integrity changed")
              (out/filename).write_bytes(raw)
          url="https://raw.githubusercontent.com/"+b.OWNER+"/"+b.COMMIT+"/data/postgresql.zip"
          with urlopen(Request(url,headers=header),timeout=90) as response:
              if response.status!=200 or response.geturl()!=url:
                  raise ValueError("author Bgee archive URL differed")
              raw=response.read(30_000_001)
          if b.git_blob(raw)!=trial.ZIP_BLOB:
              raise ValueError("author Bgee archive Git blob changed")
          (out/"postgresql.zip").write_bytes(raw)
          dest=Path(os.environ["RUNNER_TEMP"])/"nih-c-ro"
          for filename in ro.SOURCE_FILES:
              url=ro.SOURCE_URL+filename
              with urlopen(Request(url,headers=header),timeout=60) as response:
                  if response.status!=200 or response.geturl()!=url:
                      raise ValueError("original RO owner URL changed")
                  raw=response.read(5_000_001)
              if sha256(raw).hexdigest()!=ro.PINNED_WHOLE_SOURCE_SHA256[filename]:
                  raise ValueError("original RO complete SHA256 changed")
              (dest/filename).write_bytes(raw)
          print("original complete Bgee+GenEx+RO owner-source hashes verified")
          PY
      - name: Run separate synthetic negative controls
        run: python -m unittest -v network.tests.test_nih_p2_bgee_original_node_predicate_boundary
      - name: Profile all three RO source predicates across every original Bgee node with bounded memory
        run: |
          set -euo pipefail
          ulimit -v 6291456
          set +e
          /usr/bin/time -v -o lane-c-e16-evidence/resource-statistics.txt \
            timeout --signal=TERM --kill-after=30s 12m \
            python -m systems.workspace.nih_p2_bgee_original_node_predicate_boundary \
              --archive "$RUNNER_TEMP/nih-c-bgee/postgresql.zip" \
              --obda "$RUNNER_TEMP/nih-c-bgee/bgee_v14_genex.obda" \
              --owl "$RUNNER_TEMP/nih-c-bgee/bgee_v14_genex.owl" \
              --r2rml "$RUNNER_TEMP/nih-c-bgee/bgee_v14_genex.r2rml" \
              --ro-base "$RUNNER_TEMP/nih-c-ro/ro-base.owl" \
              --core "$RUNNER_TEMP/nih-c-ro/core.owl" \
              --output lane-c-e16-evidence/original-node-source-predicate-census.json
          code=$?
          set -e
          printf 'experiment_exit_code=%s\n124=timeout\n137=forced_termination_possible\n' "$code" > lane-c-e16-evidence/process-exit.txt
          if [ "$code" -ne 0 ]; then
            echo "NOT VERIFIED: preserve failure or difference in derived evidence"
            exit "$code"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("lane-c-e16-evidence/original-node-source-predicate-census.json").read_text())
          assert r["schema"]=="nih-p2-bgee-full-owlrl-all-original-nodes-predicate-audit-v1"
          assert r["status"] in ("ORIGINAL_NODE_PREDICATE_SET_EQUALS_FOUR_RULES",
                                 "ADDITIONAL_ORIGINAL_NODE_SOURCE_PREDICATE_CANDIDATES_FOUND")
          assert r["authenticated_original_graph_triples"]==34181
          assert r["authenticated_original_mapped_Bgee_triples"]==25027
          assert r["previously_verified_four_source_rule_triples"]==100108
          assert r["previously_verified_source_rule_triples_missing"]==0
          assert r["full_source_predicate_native_SPARQL_all_triples_equal"] is True
          assert r["unrestricted_predicate_result_sha256"]==r["independent_unrestricted_SPARQL_result_sha256"]
          assert r["unrestricted_original_node_predicate_triples"]>=100108
          assert r["additional_original_node_predicate_triples_not_in_four_rule_set"]==(r["unrestricted_original_node_predicate_triples"]-100108)
          assert sum(r["additional_predicate_orientations"].values())==r["additional_original_node_predicate_triples_not_in_four_rule_set"]
          assert r["whole_OWL_RL_materialized_RDF_triples"]<=1800000
          assert r["source_authentication_preserved"] is True
          assert r["unmatched_triples_are_exploratory_not_observed_biology"] is True
          assert r["second_independent_complete_OWL_RL_engine_verified"] is False
          assert r["official_NIH_score"] is False
          assert r["W13_other_lanes_modified"] is False
          PY
      - name: Retain derived counts, disagreement hashes, resource and failure receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-p2-lane-c-e16-original-node-predicate-audit
          path: lane-c-e16-evidence/
          if-no-files-found: warn
          retention-days: 30
