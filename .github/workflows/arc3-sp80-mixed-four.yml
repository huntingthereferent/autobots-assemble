name: ARC3 original-native stage1 mixed four-action controls
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_mixed_four.py'
      - '.github/workflows/arc3-sp80-mixed-four.yml'
jobs:
  original-native-mixed-four:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC game SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Test prespecified native word boundaries (unit only)
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_mixed_four import MIXED_FOUR,CONTROLS,WORDS,RESETS
          assert MIXED_FOUR==('1324','3142','1423','2314','1234','4321')
          assert CONTROLS==('12','21','34','43','56','65')
          assert WORDS==MIXED_FOUR+CONTROLS and RESETS==2
          print('UNIT ONLY: frozen original-native mixed words and controls')
          PY
      - name: Execute real native SP80 stage1 mixed-four and prior pair controls
        run: python -m work.arc3.native_sp80_mixed_four --out runtime/data/arc3/sp80-mixed-four.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-mixed-four
          path: runtime/data/arc3/sp80-mixed-four.*
          if-no-files-found: error
          retention-days: 14
