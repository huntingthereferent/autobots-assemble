name: ARC3 native SP80 opposite boundary fronts
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_opposite_boundaries.py'
      - '.github/workflows/arc3-sp80-opposite-boundaries.yml'
jobs:
  native-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official native SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Run genuine native boundary holdout
        run: python -m work.arc3.native_sp80_opposite_boundaries --out runtime/data/arc3/opposite-boundaries.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sp80-opposite-boundaries
          path: runtime/data/arc3/opposite-boundaries.*
          if-no-files-found: error
          retention-days: 14
