name: ARC3 real SP80 upper color8 band controls
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_upper_band.py'
      - '.github/workflows/arc3-sp80-upper-band.yml'
jobs:
  official-native-upper-band:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official original game
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Assert prospective source movement and control words
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_upper_band import WORDS,RESETS
          assert WORDS==(
              '11111333','33311111','111113335','111113336',
              '333111115','333111116','11111335','11111336',
              '111113334','1111133354','111115','111116','333115','333116')
          assert len(set(WORDS))==14 and RESETS==2
          print('UNIT ONLY: original second color8-band words frozen')
          PY
      - name: Execute original native SP80 stage1 second band interventions
        run: python -m work.arc3.native_sp80_upper_band --out runtime/data/arc3/sp80-upper-band.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-upper-band
          path: runtime/data/arc3/sp80-upper-band.*
          if-no-files-found: error
          retention-days: 14
