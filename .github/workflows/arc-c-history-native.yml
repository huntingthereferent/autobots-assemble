name: ARC C native experiment
on:
  pull_request:
    paths:
      - '.github/workflows/arc-c-history-native.yml'
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - run: python -m work.arc3.native_sp80_equal_interior_history --out runtime/data/arc3/arc-c-history.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-c-history
          path: runtime/data/arc3/arc-c-history.*
          if-no-files-found: warn
          retention-days: 14
