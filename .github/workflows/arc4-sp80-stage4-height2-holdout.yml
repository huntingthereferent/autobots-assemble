name: ARC4 native two-cell vertical source holdout
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_height2_holdout.py'
      - '.github/workflows/arc4-sp80-stage4-height2-holdout.yml'
jobs:
  original-sp80-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Check frozen experiment syntax
        run: python -m compileall -q work/arc3/native_sp80_stage4_height2_holdout.py
      - name: Run 48 independently entered native SP80 games
        run: python -m work.arc3.native_sp80_stage4_height2_holdout --out runtime/data/arc4/original-sp80-stage4-height2-holdout.json
      - name: Preserve genuine original source frame stacks and actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-stage4-height2-holdout
          path: runtime/data/arc4/original-sp80-stage4-height2-holdout.*
          if-no-files-found: error
          retention-days: 14
