name: WORLD — A/B Angled Contact and Rotation Trial 04
on:
  push:
    branches:
      - 'world/w13-two-world-advance-contract-20261016'
    paths:
      - '.github/workflows/world-ab-oblique-rotation.yml'
      - 'systems/workspace/world_ab_oblique_impact.py'
      - 'network/tests/test_world_ab_oblique_impact.py'
      - 'docs/world_ab_oblique_rotation.html'
      - 'scripts/verify_world_ab_oblique_browser.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytic-angular-impulse-and-physical-world-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original WORLD branch and existing physics history
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Independent angled impact oracle and original straight-wall controls
        run: |
          python -m unittest -v network.tests.test_world_ab_oblique_impact network.tests.test_world_ab_iterated_surfaces
      - name: Record source result and no-blueprint-equivalence boundary
        run: |
          mkdir -p "$RUNNER_TEMP/oblique-world"
          python - <<'PY'
          import json,os,pathlib
          from systems.workspace.world_ab_oblique_impact import experiment
          from network.tests.test_world_ab_oblique_impact import verify_impact
          a=experiment(angle=20)
          assert verify_impact(a["A_original_vertical"])
          assert verify_impact(a["B_oblique"])
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"oblique-world"/"world_ab_oblique_native.json"
          p.write_text(json.dumps(a,sort_keys=True,indent=2)+"\n")
          print(json.dumps({
            "base_angular_velocity":a["A_original_vertical"]["angular_velocity_after"],
            "oblique_angular_velocity":a["B_oblique"]["angular_velocity_after"],
            "base_outgoing":a["A_original_vertical"]["velocity_after"],
            "oblique_outgoing":a["B_oblique"]["velocity_after"],
            "candidate_receiver_built":False,
            "second_contact_verified":False,
            "whole_visual_blueprint_reproduced":False},sort_keys=True))
          PY
      - name: Install Chromium for real WORLD browser physics
        run: |
          python -m pip install 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Independently verify native versus actual playable browser contact
        run: |
          python -m scripts.verify_world_ab_oblique_browser --output-dir "$RUNNER_TEMP/oblique-world"
      - name: Retain original source result and independent impact witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-ab-oblique-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/oblique-world/world_ab_oblique_native.json
            ${{ runner.temp }}/oblique-world/world_ab_oblique_browser.json
            ${{ runner.temp }}/oblique-world/world_ab_oblique_witness.json
            ${{ runner.temp }}/oblique-world/world_ab_oblique_browser.png
            docs/world_ab_oblique_rotation.html
          retention-days: 30
          if-no-files-found: warn
