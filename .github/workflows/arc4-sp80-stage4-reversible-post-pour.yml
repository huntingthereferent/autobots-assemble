name: ARC4 original SP80 reversible post-pour continuation
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_reversible_post_pour.py'
      - '.github/workflows/arc4-sp80-stage4-reversible-post-pour.yml'
jobs:
  original-source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original SDK experiment
        run: python -m compileall -q work/arc3/native_sp80_stage4_reversible_post_pour.py
      - name: Execute 24 authentic reversible post-pour games
        run: python -m work.arc3.native_sp80_stage4_reversible_post_pour --out runtime/data/arc4/original-sp80-stage4-reversible-post-pour.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-reversible-post-pour
          path: runtime/data/arc4/original-sp80-stage4-reversible-post-pour.*
          if-no-files-found: error
          retention-days: 14
