name: ARC3 original SP80 stage2 source geometry and pour capture
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage2_source_map.py'
      - '.github/workflows/arc3-sp80-stage2-source-map.yml'
jobs:
  authentic-stage2-source-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic public SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Inspect actual source original stage2 images and first pour
        run: python -m work.arc3.native_sp80_stage2_source_map --out runtime/data/arc3/original-sp80-stage2-source-map.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage2-source-map
          path: runtime/data/arc3/original-sp80-stage2-source-map.json
          if-no-files-found: error
          retention-days: 14
