name: owner readiness separate-run restoration
on:
  pull_request:
    paths:
      - 'scripts/w13_ready_cross_run.py'
      - 'network/tests/test_owner_ready_cross_run.py'
      - '.github/workflows/owner-ready-cross-run.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/w13_ready_cross_run.py'
      - 'network/tests/test_owner_ready_cross_run.py'
      - '.github/workflows/owner-ready-cross-run.yml'
permissions:
  contents: read
  actions: read
jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest -v network.tests.test_owner_ready_cross_run
  restore-exact-owner-readiness:
    needs: boundary-tests
    if: github.event_name == 'push' && github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: b939f577962f737cc60a977977d5ca9adc0731d6
          path: producer
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=45,<47' 'rdflib>=7,<8'
      - name: Restore exact retained owner readiness with original native host
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_KEY_B64: ${{ secrets.W13_CAPSULE_PRIVATE_KEY_B64 }}
          PRODUCER_SOURCE: ${{ github.workspace }}/producer
        run: python -I "$GITHUB_WORKSPACE/control/scripts/w13_ready_cross_run.py"
