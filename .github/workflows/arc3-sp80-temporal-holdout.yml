name: ARC3 original SP80 held-out ACTION5 temporal signature
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_action5_temporal_holdout.py'
      - '.github/workflows/arc3-sp80-temporal-holdout.yml'
jobs:
  independent-native-temporal-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official original ARC native SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Freeze predeclared source temporal hypotheses before game execution
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_action5_temporal_holdout import (
            PLANS,RESETS,FROZEN_ACTION5_COLOR6_COUNTS as C6,
            FROZEN_ACTION5_COLOR11_COUNTS as C11)
          from work.arc3.native_sp80_multi_select import parse_plan
          assert len(PLANS)==10 and RESETS==2
          assert len(C6)==len(C11)==22
          assert C6==tuple([16*i for i in range(1,15)]+[224]*7+[16])
          assert C11==tuple([240]*15+[0,240,0,240,0,0,240])
          for name,words in PLANS:
            assert any(n==5 for n,_ in parse_plan(words))
            assert all(n!=6 or xy is not None for n,xy in parse_plan(words))
          print('UNIT ONLY: prior native color6 and color11 temporal signatures frozen')
          PY
      - name: Execute fresh genuine original SP80 independent animation holdout
        run: python -m work.arc3.native_sp80_action5_temporal_holdout --out runtime/data/arc3/sp80-action5-temporal-holdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-action5-temporal-holdout
          path: runtime/data/arc3/sp80-action5-temporal-holdout.*
          if-no-files-found: error
          retention-days: 14
