name: WORLD 37 contiguous post-fifth source clearance prefix

on:
  push:
    paths:
      - 'systems/workspace/world_ab_post_fifth_contiguous_prefix.py'
      - 'network/tests/test_world_ab_post_fifth_contiguous_prefix.py'
      - 'systems/workspace/WORLD_AB_POST_FIFTH_CONTIGUOUS_PREFIX_TRIAL_37_2026-10-21.md'
      - '.github/workflows/world-ab-post-fifth-contiguous-prefix.yml'
  pull_request:
    paths:
      - 'systems/workspace/world_ab_post_fifth_contiguous_prefix.py'
      - 'network/tests/test_world_ab_post_fifth_contiguous_prefix.py'
      - 'systems/workspace/WORLD_AB_POST_FIFTH_CONTIGUOUS_PREFIX_TRIAL_37_2026-10-21.md'
      - '.github/workflows/world-ab-post-fifth-contiguous-prefix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-contiguous-prefix-independent-world-corners:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original WORLD ancestry plus new independent finite-prefix verifier
        run: |
          python -m unittest -v network.tests.test_world_ab_oblique_impact network.tests.test_world_ab_local_recontact_impulse network.tests.test_world_ab_rotating_receiver network.tests.test_world_ab_third_contact network.tests.test_world_ab_first_post_third_candidate network.tests.test_world_ab_all_inward_finite_features network.tests.test_world_ab_rotating_edge_face_endpoint network.tests.test_world_ab_finite_segment_square_overlap network.tests.test_world_ab_between_sample_clearance network.tests.test_world_ab_local_finite_onset network.tests.test_world_ab_first_finite_response_qualification network.tests.test_world_ab_post_fourth_local_clearance network.tests.test_world_ab_first_envelope_limit network.tests.test_world_ab_geometry_at_first_envelope_limit network.tests.test_world_ab_local_plane_prefix network.tests.test_world_ab_first_unknown_finite_feature network.tests.test_world_ab_whole_contact_configuration network.tests.test_world_ab_post_fifth_local_clearance network.tests.test_world_ab_post_fifth_contiguous_prefix
      - name: Preserve bounded first source-unknown interval, witness and hashes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          from systems.workspace.world_ab_post_fifth_contiguous_prefix import run
          from network.tests.test_world_ab_post_fifth_contiguous_prefix import verify
          report=run()
          independent=[{"angle":c["angle"],"status":c["status"],"independent_original_contiguous_prefix":verify(c)} for c in report["cases"]]
          assert len(independent)==8 and all(x["independent_original_contiguous_prefix"] for x in independent)
          assert report["source_qualified_post_fifth_cases"]==1
          assert report["no_original_fifth_response_controls"]==7
          assert report["complete_new_window_cases"]+report["first_unknown_window_cases"]==1
          assert report["material_sixth_contacts"]==0 and report["sixth_impulses"]==0
          path=Path("world37-native-evidence")
          path.mkdir(exist_ok=True)
          payload=json.dumps({"original_source":report,"independent_replay":independent},
                             sort_keys=True,indent=2,allow_nan=False)+"\n"
          (path/"contiguous_post_fifth_prefix.json").write_text(payload)
          (path/"contiguous_post_fifth_prefix.sha256").write_text(
              sha256(payload.encode()).hexdigest()+"  contiguous_post_fifth_prefix.json\n")
          print(json.dumps({
              "qualified_source_cases":report["source_qualified_post_fifth_cases"],
              "full_new_window":report["complete_new_window_cases"],
              "first_original_unknown":report["first_unknown_window_cases"],
              "inactive_original_cases":report["no_original_fifth_response_controls"],
              "physical_sixth_impulses":0},sort_keys=True))
          for c in report["cases"]:
              if c["initial_clearance_time"] is not None:
                  u=c["first_unsupported_subinterval"]
                  print(json.dumps({"angle":c["angle"],"status":c["status"],
                      "verified_start":c["initial_clearance_time"],
                      "supported_prefix_end":c["supported_prefix_end"],
                      "declared_end":c["attempted_end_time"],
                      "first_unknown_interval":[u["left"],u["right"]] if u else None,
                      "original_supported_intervals":len(c["supported_source_subintervals"]),
                      "measured_sixth_contact":False},sort_keys=True))
          PY
      - name: Retain original WORLD37 source and separate numerical witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world37-original-contiguous-prefix
          path: world37-native-evidence/
          if-no-files-found: warn
          retention-days: 30
