name: WORLD — Contact Evidence Trial 11
on:
  push:
    branches:
      - 'experiment/world-trial11-contact-discrimination-20261019'
    paths:
      - '.github/workflows/world-ab-contact-discrimination.yml'
      - 'systems/workspace/world_ab_contact_discrimination.py'
      - 'network/tests/test_world_ab_contact_discrimination.py'
      - 'docs/world_ab_contact_discrimination.html'
      - 'scripts/verify_world_ab_contact_discrimination_browser.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-friction-constraint-and-sensor-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Independent evidence/constraints oracle and unmodified Trial 05-10 regressions
        run: |
          python -m unittest -v \
            network.tests.test_world_ab_contact_discrimination \
            network.tests.test_world_ab_active_set_trial \
            network.tests.test_world_ab_two_contact_stress \
            network.tests.test_world_ab_two_contact_candidate \
            network.tests.test_world_ab_junction_threshold \
            network.tests.test_world_ab_junction_continuous \
            network.tests.test_world_ab_connected_routing
      - name: Install real Chromium
        run: |
          python -m pip install 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Independent actual browser source and all hypothetical readings comparison
        run: |
          python -m scripts.verify_world_ab_contact_discrimination_browser --output-dir "$RUNNER_TEMP/world-trial11"
      - name: Retain complete original source, hypothetical readings and native/browser witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-trial11-contact-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/world-trial11/world_trial11_native.json
            ${{ runner.temp }}/world-trial11/world_trial11_browser.json
            ${{ runner.temp }}/world-trial11/world_trial11_chromium.png
            ${{ runner.temp }}/world-trial11/world_trial11_verification.json
            docs/world_ab_contact_discrimination.html
            docs/world_ab_active_set_trial.html
            docs/world_ab_two_contact_stress.html
            docs/world_ab_junction_geometry.js
          retention-days: 30
          if-no-files-found: warn
