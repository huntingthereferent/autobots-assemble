name: ARC4 original SP80 clean lateral upper-bar restoration
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_clean_lateral_upper_bar_restore.py'
      - '.github/workflows/arc4-sp80-stage4-clean-lateral-upper-bar-restore.yml'
jobs:
  genuine-original-stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile actual source trial
        run: python -m compileall -q work/arc3/native_sp80_stage4_clean_lateral_upper_bar_restore.py
      - name: Execute 18 original SDK upper-bar restoration games
        run: python -m work.arc3.native_sp80_stage4_clean_lateral_upper_bar_restore --out runtime/data/arc4/original-sp80-stage4-clean-lateral-upper-bar-restore.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-clean-lateral-upper-bar-restore
          path: runtime/data/arc4/original-sp80-stage4-clean-lateral-upper-bar-restore.*
          if-no-files-found: error
          retention-days: 14
