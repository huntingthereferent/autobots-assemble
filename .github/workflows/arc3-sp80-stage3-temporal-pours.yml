name: ARC3 original SP80 stage3 temporal two-pour contrasts
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_temporal_pours.py'
      - '.github/workflows/arc3-sp80-stage3-temporal-pours.yml'
jobs:
  genuine-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile frozen native experiment
        run: python -m compileall -q work/arc3/native_sp80_stage3_temporal_pours.py
      - name: Execute forty fresh original level3 native source sessions
        run: python -m work.arc3.native_sp80_stage3_temporal_pours --out runtime/data/arc3/original-sp80-stage3-temporal-pours.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-temporal-pours-source
          path: runtime/data/arc3/original-sp80-stage3-temporal-pours.*
          if-no-files-found: error
          retention-days: 14
