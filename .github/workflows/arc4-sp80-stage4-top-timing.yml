name: ARC4 native four-cup timing discriminator
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_top_timing_control.py'
      - '.github/workflows/arc4-sp80-stage4-top-timing.yml'
jobs:
  actual-native-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile source-only trial
        run: python -m compileall -q work/arc3/native_sp80_stage4_top_timing_control.py
      - name: Run 14 real SDK timing controls
        run: python -m work.arc3.native_sp80_stage4_top_timing_control --out runtime/data/arc4/original-sp80-stage4-top-timing.json
      - name: Save authentic original frame arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-stage4-top-timing
          path: runtime/data/arc4/original-sp80-stage4-top-timing.*
          if-no-files-found: error
          retention-days: 14
