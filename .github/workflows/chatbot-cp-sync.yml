name: Chatbot checkpoint views
on:
  push:
    paths:
      - 'work/arc_like_maze/chatbot/**'
      - '.github/workflows/chatbot-cp-sync.yml'
  pull_request:
    paths:
      - 'work/arc_like_maze/chatbot/**'
      - '.github/workflows/chatbot-cp-sync.yml'
jobs:
  cp-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check chatbot CP About Me and provenance views
        run: python work/arc_like_maze/chatbot/checkpoints/cp_record.py check
      - name: Reopen real CP evidence without treating next as authority
        run: |
          python work/arc_like_maze/chatbot/checkpoints/cp_record.py handoff --referent "recheck current finite correspondence boundary" > "$RUNNER_TEMP/cp-context.json"
          python -c 'import json,os; c=json.load(open(os.environ["RUNNER_TEMP"]+"/cp-context.json")); assert c["latest_checkpoint"] == "CP-0030" and c["history"][-1]["cp"] == "CP-0030" and c["task_admitted"] is False and c["worker_executed"] is False'
      - name: Exercise CP recording and rejection cases
        run: python -m unittest -q work.arc_like_maze.chatbot.checkpoints.test_cp_record

      - name: Check latest finite shared-route certificate reference
        working-directory: work/arc_like_maze/chatbot
        run: |
          python -m unittest -q test_finite_shared_route_certificate.SharedFiniteTests
          python -m unittest -q test_finite_multi_task_dependency.FiniteMultiTaskDependencyTests
          python finite_shared_route_certificate.py

      - name: Check finite cross-invocation handoff
        working-directory: work/arc_like_maze/chatbot
        run: |
          python -m unittest -q test_finite_certificate_handoff.FiniteHandoffTests
          python finite_certificate_handoff.py

      - name: Install Ed25519 verifier dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=45,<47'
      - name: Check independent-process signed scopes (finite)
        working-directory: work/arc_like_maze/chatbot
        run: |
          python -m unittest -q test_finite_process_attestation.ProcessAttestationTests
          python -m unittest -q test_finite_certificate_handoff.FiniteHandoffTests
