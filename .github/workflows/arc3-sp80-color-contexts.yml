name: ARC3 SP80 actual native color-transition heldout contexts

on:
  push:
    paths:
      - "work/arc3/native_sp80_frozen_color_contexts.py"
      - ".github/workflows/arc3-sp80-color-contexts.yml"
  pull_request:
    paths:
      - "work/arc3/native_sp80_frozen_color_contexts.py"
      - ".github/workflows/arc3-sp80-color-contexts.yml"
  workflow_dispatch:

jobs:
  actual-native-color-transitions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official native ARC runtime
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" numpy
      - name: Test frozen geometry with true native color changes in new contexts
        run: python -m work.arc3.native_sp80_frozen_color_contexts --out runtime/data/arc3/sp80-frozen-color-contexts.json
      - name: Preserve actual native frames, matched and unmatched color labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-sp80-frozen-color-contexts
          path: runtime/data/arc3/sp80-frozen-color-contexts.*
          if-no-files-found: error
          retention-days: 14
