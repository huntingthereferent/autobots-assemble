name: ARC4 original SDK cross-archive independent audit
on:
  pull_request:
    paths:
      - 'work/arc3/arc4_cross_archive_audit.py'
      - 'work/arc3/arc4_row63_action_index_audit.py'
      - '.github/workflows/arc4-cross-archive-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-original-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent archive reader
        run: python -m pip install numpy
      - name: Download four pinned original native SDK artifacts without rerunning games
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/data/arc4/source-audit/input
          while read -r artifact filename; do
            curl --fail --show-error --silent --location --retry 3 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/huntingthereferent/autobots-assemble/actions/artifacts/${artifact}/zip" \
              --output "runtime/data/arc4/source-audit/input/${filename}"
            unzip -t "runtime/data/arc4/source-audit/input/${filename}" >/dev/null
          done <<'ARTIFACTS'
          12572149238 arc4-468-corrected.zip
          12572259815 arc4-519.zip
          12573712772 arc4-520.zip
          12574210293 arc4-521.zip
          ARTIFACTS
      - name: Independently reconcile full original frames, native action receipts and workstation logs
        run: |
          python -m work.arc3.arc4_cross_archive_audit \
            --directory runtime/data/arc4/source-audit/input \
            --out runtime/data/arc4/source-audit/independent-cross-run-audit.json
      - name: Reconcile source row63 against actual original action indices
        run: |
          python -m work.arc3.arc4_row63_action_index_audit \
            --directory runtime/data/arc4/source-audit/input \
            --out runtime/data/arc4/source-audit/row63-action-index-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-independent-evidence-audit
          path: |
            runtime/data/arc4/source-audit/independent-cross-run-audit.json
            runtime/data/arc4/source-audit/row63-action-index-audit.json
          if-no-files-found: warn
          retention-days: 90
