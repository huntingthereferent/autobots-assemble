name: ARC4 original SP80 lower emitter native selection classes
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_emitter_selection.py'
      - '.github/workflows/arc4-sp80-stage4-emitter-selection.yml'
jobs:
  actual-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original native selection test
        run: python -m compileall -q work/arc3/native_sp80_stage4_emitter_selection.py
      - name: Test 24 original SDK lower emitter/source selection games
        run: python -m work.arc3.native_sp80_stage4_emitter_selection --out runtime/data/arc4/original-sp80-stage4-emitter-selection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-emitter-selection
          path: runtime/data/arc4/original-sp80-stage4-emitter-selection.*
          if-no-files-found: error
          retention-days: 14
