name: ARC4 original SP80 direct upper RIGHT1 arrival contrast
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_direct_upper_right1_contrast.py'
      - 'work/arc3/arc4_current_run.json'
      - 'work/arc3/arc4_drift_gate.py'
      - '.github/workflows/arc4-stage4-direct-upper-right1-contrast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native-source-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the original native SP80 SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile exact frozen source and anti-drift gate
        run: python -m compileall -q work/arc3/native_sp80_stage4_direct_upper_right1_contrast.py work/arc3/arc4_drift_gate.py
      - name: Source-pinned ARC4 drift preflight (fail closed)
        run: python -m work.arc3.arc4_drift_gate pre
      - name: Execute seven frozen native words with independent A/B SDK resets
        run: python -m work.arc3.native_sp80_stage4_direct_upper_right1_contrast --out runtime/data/arc4/arc4-direct-upper-right1-contrast.json
      - name: Audit original source return against unchanged frozen relation
        run: python -m work.arc3.arc4_drift_gate post --result runtime/data/arc4/arc4-direct-upper-right1-contrast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-direct-upper-right1-contrast
          path: runtime/data/arc4/arc4-direct-upper-right1-contrast.*
          retention-days: 90
          if-no-files-found: error
