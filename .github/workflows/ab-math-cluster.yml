name: Finite A/B Math Cluster

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "systems/workspace/ab_math_cluster.py"
      - "systems/workspace/AB_MATH_CLUSTER.md"
      - "network/tests/test_ab_math_cluster.py"
      - "work/arc_like_maze/math.py"
      - ".github/workflows/ab-math-cluster.yml"
  push:
    branches: [main]
    paths:
      - "systems/workspace/ab_math_cluster.py"
      - "systems/workspace/AB_MATH_CLUSTER.md"
      - "network/tests/test_ab_math_cluster.py"
      - "work/arc_like_maze/math.py"
      - ".github/workflows/ab-math-cluster.yml"

permissions:
  contents: read

jobs:
  finite-math-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently verify real finite worker runs
        run: python -m unittest -v network.tests.test_ab_math_cluster
      - name: Reproduce a new source-pinned cluster run
        run: |
          scratch="$(mktemp -d)"
          python -m systems.workspace.ab_math_cluster --execute --workers 3 --data-dir "$scratch"
          python -m systems.workspace.ab_math_cluster --inspect --data-dir "$scratch"
