name: ARC3 original SP80 selection history versus same-position pour
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_last_selection_response.py'
      - '.github/workflows/arc3-sp80-stage3-last-selection-response.yml'
jobs:
  true-original-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile genuine SDK trial
        run: python -m compileall -q work/arc3/native_sp80_stage3_last_selection_response.py
      - name: Run original SP80 last-selection source comparisons
        run: python -m work.arc3.native_sp80_stage3_last_selection_response --out runtime/data/arc3/original-sp80-stage3-last-selection-response.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-last-selection-response
          path: runtime/data/arc3/original-sp80-stage3-last-selection-response.*
          if-no-files-found: error
          retention-days: 14
