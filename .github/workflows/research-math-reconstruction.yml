name: research-math-reconstruction

on:
  pull_request:
    paths:
      - "research/testing_lanes/math_odd_sum.py"
      - "research/testing_lanes/test_math_odd_sum.py"
      - ".github/workflows/research-math-reconstruction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact arithmetic and negative controls
        run: python -m unittest discover -s research/testing_lanes -p "test_math_odd_sum.py" -v

  bounded-reconstruction:
    needs: offline-controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct the pinned identity and preserve witness
        run: |
          mkdir -p math_receipt
          python research/testing_lanes/math_odd_sum.py --max-n 10000 --output math_receipt/MATH-IDENTITY-001.json
      - name: Preserve exact arithmetic receipt
        uses: actions/upload-artifact@v4
        with:
          name: MATH-IDENTITY-001-reconstruction-receipt
          path: math_receipt/*.json
          if-no-files-found: error
          retention-days: 30
