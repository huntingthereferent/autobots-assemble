name: ARC owned A-B selected L next error
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_ab_selected_L_next.py'
      - '.github/workflows/arc4-sp80-owned-selected-L-next.yml'
  workflow_dispatch:
jobs:
  original-selected-L-next-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile next A-B from observed selected-L error
        run: python -m compileall -q work/arc3/native_sp80_stage4_ab_selected_L_next.py
      - name: Execute actual rooted original SDK A-B and check independent entrance
        run: python -m work.arc3.native_sp80_stage4_ab_selected_L_next --out runtime/data/arc4/owned-sp80-selected-L-next.json
      - name: Preserve original returned frames, errors, receipts and progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-sp80-selected-L-next-native-evidence
          path: runtime/data/arc4/owned-sp80-selected-L-next.*
          if-no-files-found: warn
          retention-days: 14
