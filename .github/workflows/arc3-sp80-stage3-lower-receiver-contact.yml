name: ARC3 original SP80 lower receiver source contact height
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_lower_receiver_contact.py'
      - '.github/workflows/arc3-sp80-stage3-lower-receiver-contact.yml'
jobs:
  original-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile genuine native study
        run: python -m compileall -q work/arc3/native_sp80_stage3_lower_receiver_contact.py
      - name: Execute forty-four original SDK lower-contact games
        run: python -m work.arc3.native_sp80_stage3_lower_receiver_contact --out runtime/data/arc3/original-sp80-stage3-lower-receiver-contact.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-lower-receiver-contact
          path: runtime/data/arc3/original-sp80-stage3-lower-receiver-contact.*
          if-no-files-found: error
          retention-days: 14
