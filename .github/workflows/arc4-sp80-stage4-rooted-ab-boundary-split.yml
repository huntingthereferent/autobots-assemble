name: ARC4 rooted AB bottom-boundary response split
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_rooted_ab_boundary_split.py'
      - '.github/workflows/arc4-sp80-stage4-rooted-ab-boundary-split.yml'
jobs:
  authentic-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Verify bounded source code syntax
        run: python -m compileall -q work/arc3/native_sp80_stage4_rooted_ab_boundary_split.py
      - name: Execute identical-image rooted split native controls
        run: python -m work.arc3.native_sp80_stage4_rooted_ab_boundary_split --out runtime/data/arc4/original-sp80-rooted-ab-boundary-split.json
      - name: Preserve full genuine native A-B source frames and math certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-rooted-ab-boundary-split
          path: runtime/data/arc4/original-sp80-rooted-ab-boundary-split.*
          if-no-files-found: error
          retention-days: 14
