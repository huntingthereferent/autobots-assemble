name: ARC4 rooted same-index A/B holdout
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_rooted_equal_count.py'
      - '.github/workflows/arc4-sp80-stage4-rooted-equal-count.yml'
jobs:
  genuine-original-rooted-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Check exact native source test syntax
        run: python -m compileall -q work/arc3/native_sp80_stage4_rooted_equal_count.py
      - name: Run 54 paired original SDK games
        run: python -m work.arc3.native_sp80_stage4_rooted_equal_count --out runtime/data/arc4/original-sp80-rooted-equal-count.json
      - name: Retain complete genuine original SDK source arrays and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-rooted-equal-count
          path: runtime/data/arc4/original-sp80-rooted-equal-count.*
          retention-days: 14
          if-no-files-found: error
