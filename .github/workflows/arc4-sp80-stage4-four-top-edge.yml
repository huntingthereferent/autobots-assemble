name: ARC4 original SP80 four-cup right/top edge contact
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_four_top_edge.py'
      - '.github/workflows/arc4-sp80-stage4-four-top-edge.yml'
jobs:
  original-native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Verify actual source trial compiles
        run: python -m compileall -q work/arc3/native_sp80_stage4_four_top_edge.py
      - name: Execute 48 genuine original SDK clean four-cup top-edge trials
        run: python -m work.arc3.native_sp80_stage4_four_top_edge --out runtime/data/arc4/original-sp80-stage4-four-top-edge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-four-top-edge
          path: runtime/data/arc4/original-sp80-stage4-four-top-edge.*
          if-no-files-found: error
          retention-days: 14
