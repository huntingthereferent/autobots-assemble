name: ARC3 original SP80 first flow arrival divergence
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_first_arrival_contrast.py'
      - '.github/workflows/arc3-sp80-stage3-first-arrival-contrast.yml'
jobs:
  original-sdk-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile actual native source comparison
        run: python -m compileall -q work/arc3/native_sp80_stage3_first_arrival_contrast.py
      - name: Compare actual original SDK source first-arrival maps
        run: python -m work.arc3.native_sp80_stage3_first_arrival_contrast --out runtime/data/arc3/original-sp80-stage3-first-arrival-contrast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-first-arrival-contrast
          path: runtime/data/arc3/original-sp80-stage3-first-arrival-contrast.*
          if-no-files-found: error
          retention-days: 14
