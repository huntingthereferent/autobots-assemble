name: ARC D arc-d-underflow
on:
  pull_request:
    paths:
      - '.github/workflows/arc-d-underflow.yml'
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - run: python -m work.arc3.native_sp80_stage4_underflow_intercept --out runtime/data/arc3/arc-d-underflow.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-d-underflow
          path: runtime/data/arc3/arc-d-underflow.*
          if-no-files-found: warn
          retention-days: 14
