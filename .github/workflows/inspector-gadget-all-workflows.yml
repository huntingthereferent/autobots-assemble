name: Inspector Gadget - All Workflows

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: inspector-gadget-repository-scan
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      movement_count: ${{ steps.plan.outputs.movement_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect repository workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python systems/workspace/inspector_gadget_scan.py
      - name: Build bounded adapter movement plan
        id: plan
        run: |
          python systems/workspace/inspector_gadget_adapter.py matrix inspector-gadget-report.json inspector-gadget-activation.json
          python - <<'PY'
          import json, os
          plan = json.load(open('inspector-gadget-activation.json', encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('matrix=' + json.dumps(plan['matrix'], separators=(',', ':')) + '\n')
              out.write('movement_count=' + str(plan['selected']) + '\n')
          PY
      - name: Publish inspection and movement summary
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('inspector-gadget-report.json', encoding='utf-8'))
          p=json.load(open('inspector-gadget-activation.json', encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('# Inspector Gadget — observation and movement\n\n')
              f.write(f"Retrieved {r['scanned']} completed runs; {len(r['findings'])} grouped incident signals.\n\n")
              f.write(f"Native source follow-ups activated: {p['selected']}; overflow awaiting admission: {p['overflow_count']}.\n\n")
              f.write('| Owning workflow | Event | Count | Source |\n|---|---|---:|---|\n')
              for item in r['findings']:
                  url=next((u for u in item['sources'] if u), '')
                  label=item['lane'].replace('|', '/').replace('\n', ' ')
                  f.write(f"| {label} | {item['event']} | {item['count']} | [Run]({url}) |\n")
              f.write('\nMovement means live source observation in an independent HandoffRuntime worker. It is not a repair or research verdict.\n')
          PY
      - name: Verify scanner and adapter contracts
        run: |
          python -m unittest discover -s network/tests -p 'test_inspector_gadget_scan.py' -v
          python -m unittest discover -s network/tests -p 'test_inspector_gadget_adapter.py' -v
      - name: Retain scan and movement plan
        uses: actions/upload-artifact@v4
        with:
          name: inspector-gadget-${{ github.run_id }}
          path: |
            inspector-gadget-report.json
            inspector-gadget-activation.json
          retention-days: 90

  move:
    needs: inspect
    if: needs.inspect.outputs.movement_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.inspect.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate source-owning handoff adapter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSPECTOR_FINDING_JSON: ${{ toJSON(matrix) }}
        run: |
          printf '%s' "$INSPECTOR_FINDING_JSON" > inspector-selection.json
          python systems/workspace/inspector_gadget_adapter.py inspect inspector-selection.json inspector-gadget-handoff.json
      - name: Preserve source-observation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-gadget-movement-${{ matrix.run_id }}
          path: |
            inspector-gadget-handoff.json
            inspector-gadget-runtime.jsonl
          if-no-files-found: warn
          retention-days: 90
