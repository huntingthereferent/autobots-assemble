name: Inspector Gadget - All Workflows

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: inspector-gadget-repository-scan
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect repository workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python systems/workspace/inspector_gadget_scan.py
      - name: Verify scanner and adapter contracts
        run: |
          python -m unittest discover -s network/tests -p 'test_inspector_gadget_scan.py' -v
          python -m unittest discover -s network/tests -p 'test_inspector_gadget_adapter.py' -v
          python -m unittest discover -s network/tests -p 'test_inspector_gadget_wall.py' -v
          python -m unittest discover -s network/tests -p 'test_inspector_gadget_continuation.py' -v
      - name: Retain diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: inspector-gadget-manual
          path: inspector-gadget-report.json
          retention-days: 30
