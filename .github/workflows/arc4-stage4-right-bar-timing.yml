name: ARC4 lane B original SDK right-bar arrival timing
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_right_bar_timing.py'
      - '.github/workflows/arc4-stage4-right-bar-timing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-sdk-right-bar-one-factor:
    runs-on: ubuntu-latest
    timeout-minutes: 47
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original native ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile source-owned native intervention
        run: python -m compileall -q work/arc3/native_sp80_stage4_right_bar_timing.py
      - name: Execute four horizontal controls on both original entrance witnesses
        run: python -m work.arc3.native_sp80_stage4_right_bar_timing --out runtime/data/arc4/arc4-original-right-bar-source-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-right-bar-source-timing
          path: runtime/data/arc4/arc4-original-right-bar-source-timing.*
          retention-days: 90
          if-no-files-found: error
