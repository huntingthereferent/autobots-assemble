name: WORLD 30 conditional post-fourth local separation

on:
  push:
    paths:
      - 'systems/workspace/world_ab_post_fourth_local_clearance.py'
      - 'network/tests/test_world_ab_post_fourth_local_clearance.py'
      - 'systems/workspace/WORLD_AB_LOCAL_POST_RESPONSE_TRIAL_30_2026-10-20.md'
      - '.github/workflows/world-ab-post-fourth-clearance.yml'
  pull_request:
    paths:
      - 'systems/workspace/world_ab_post_fourth_local_clearance.py'
      - 'network/tests/test_world_ab_post_fourth_local_clearance.py'
      - 'systems/workspace/WORLD_AB_LOCAL_POST_RESPONSE_TRIAL_30_2026-10-20.md'
      - '.github/workflows/world-ab-post-fourth-clearance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-source-independent-post-response-clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck original source and independent WORLD30 local envelope
        run: |
          python -m unittest -v network.tests.test_world_ab_oblique_impact network.tests.test_world_ab_local_recontact_impulse network.tests.test_world_ab_rotating_receiver network.tests.test_world_ab_third_contact network.tests.test_world_ab_first_post_third_candidate network.tests.test_world_ab_all_inward_finite_features network.tests.test_world_ab_rotating_edge_face_endpoint network.tests.test_world_ab_finite_segment_square_overlap network.tests.test_world_ab_between_sample_clearance network.tests.test_world_ab_local_finite_onset network.tests.test_world_ab_first_finite_response_qualification network.tests.test_world_ab_post_fourth_local_clearance
      - name: Preserve original source per-plane bounds and independent witness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          from systems.workspace.world_ab_post_fourth_local_clearance import run
          from network.tests.test_world_ab_post_fourth_local_clearance import verify
          source=run()
          witnessed=[{"angle":case["angle"],"status":case["status"],
                      "independent_original_plane_bounds_verified":verify(case)}
                     for case in source["cases"]]
          assert len(witnessed)==8 and all(x["independent_original_plane_bounds_verified"] for x in witnessed)
          assert source["source_qualified_fourth_candidates"]==3
          assert source["no_qualified_source_response"]==5
          assert source["selected_actual_fourth_impulses"]==0
          assert source["real_material_impacts_witnessed"]==0
          assert source["fifth_impulses_computed"]==0
          folder=Path("world30-native-evidence")
          folder.mkdir(exist_ok=True)
          payload=json.dumps({"source":source,"independent_witness":witnessed},
                             sort_keys=True,indent=2,allow_nan=False)+"\n"
          (folder/"conditional_post_fourth_local_clearance.json").write_text(payload)
          (folder/"conditional_post_fourth_local_clearance.sha256").write_text(
              sha256(payload.encode()).hexdigest()+"  conditional_post_fourth_local_clearance.json\n")
          print(json.dumps({
              "source_qualified_fourth_candidates":source["source_qualified_fourth_candidates"],
              "conditionally_local_separated_cases":source["locally_separated_conditional_candidates"],
              "locally_unresolved_cases":source["post_candidate_geometry_unresolved"],
              "no_qualified_source_response_controls":source["no_qualified_source_response"],
              "real_fourth_impacts":0,
              "fifth_impulses":0
          },sort_keys=True))
          PY
      - name: Retain original conditional source and test verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world30-original-post-fourth-local-clearance
          path: world30-native-evidence/
          if-no-files-found: warn
          retention-days: 30
