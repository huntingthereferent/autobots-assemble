name: ARC4 original SP80 four-cup L adjacent middle contact
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_L_middle_contact.py'
      - '.github/workflows/arc4-sp80-stage4-L-middle-contact.yml'
jobs:
  genuine-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile actual native SP80 source
        run: python -m compileall -q work/arc3/native_sp80_stage4_L_middle_contact.py
      - name: Run 50 actual original SDK adjacent middle-bar contact games
        run: python -m work.arc3.native_sp80_stage4_L_middle_contact --out runtime/data/arc4/original-sp80-stage4-L-middle-contact.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-L-middle-contact
          path: runtime/data/arc4/original-sp80-stage4-L-middle-contact.*
          if-no-files-found: error
          retention-days: 14
