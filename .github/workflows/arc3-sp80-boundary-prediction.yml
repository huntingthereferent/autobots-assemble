name: ARC3 SP80 heldout native boundary color prediction

on:
  push:
    paths:
      - "work/arc3/native_sp80_boundary_prediction.py"
      - "network/tests/test_arc3_sp80_boundary_prediction.py"
      - ".github/workflows/arc3-sp80-boundary-prediction.yml"
  pull_request:
    paths:
      - "work/arc3/native_sp80_boundary_prediction.py"
      - ".github/workflows/arc3-sp80-boundary-prediction.yml"
  workflow_dispatch:

jobs:
  actual-native-boundary-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official native ARC dependency
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" numpy
      - name: Check frozen coordinate and exact-color invariants
        run: python -m unittest -v network.tests.test_arc3_sp80_boundary_prediction
      - name: Validate frozen bottom-row color predictions in unseen action words
        run: python -m work.arc3.native_sp80_boundary_prediction --out runtime/data/arc3/sp80-native-boundary-prediction.json
      - name: Preserve every native counterexample and original frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-sp80-native-boundary-prediction
          path: runtime/data/arc3/sp80-native-boundary-prediction.*
          if-no-files-found: error
          retention-days: 14
