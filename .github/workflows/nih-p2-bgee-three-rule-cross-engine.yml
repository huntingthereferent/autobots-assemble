name: NIH P2 original Bgee three-rule Jena full-source comparison
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_p2_bgee_jena_three_rule_source_comparison.py'
      - 'systems/workspace/nih_p2_jena_cross_engine/**'
      - 'network/tests/test_nih_p2_bgee_jena_three_rule_source_comparison.py'
      - '.github/workflows/nih-p2-bgee-three-rule-cross-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nih-p2-bgee-three-rule-cross-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-whole-input-alternative-Jena-reasoner:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install independent Python RDFLib oracle; Maven obtains pinned Apache Jena
        run: python -m pip install 'rdflib>=7,<8'
      - name: Retrieve immutable author archive, mappings and independent RO source with exact source integrity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bgee-original" "$RUNNER_TEMP/ro-original" "$RUNNER_TEMP/bgee-jena" "$RUNNER_TEMP/bgee-jena-evidence"
          python - <<'PY'
          from systems.workspace import nih_p2_author_genex_bgee_ro_mapping_gate as b
          from systems.workspace import nih_p2_original_bgee_real_expression_join as trial
          from systems.workspace import nih_phase2_external_obo_graph_trial as ro
          from pathlib import Path
          from urllib.request import Request,urlopen
          from hashlib import sha256
          import os
          header={"User-Agent":"NIH-P2-Verified-Bgee-Original-Relation-Join/1.0"}
          output=Path(os.environ["RUNNER_TEMP"])/"bgee-original"
          for filename,pin in b.FILES.items():
              url="https://raw.githubusercontent.com/"+b.OWNER+"/"+b.COMMIT+"/obda/"+filename
              with urlopen(Request(url,headers=header),timeout=60) as response:
                  if response.status!=200 or response.geturl()!=url:
                      raise ValueError("author original RDF map source URL differed")
                  raw=response.read(1_000_001)
              if len(raw)>1_000_000 or b.git_blob(raw)!=pin:
                  raise ValueError("author original R2RML/GenEx source Git hash differed")
              (output/filename).write_bytes(raw)
          url="https://raw.githubusercontent.com/"+b.OWNER+"/"+b.COMMIT+"/data/postgresql.zip"
          with urlopen(Request(url,headers=header),timeout=90) as response:
              if response.status!=200 or response.geturl()!=url:
                  raise ValueError("owner original Bgee SQL source URL differs")
              raw=response.read(30_000_001)
          if b.git_blob(raw)!=trial.ZIP_BLOB:
              raise ValueError("original complete owner Bgee data Git blob mismatch")
          (output/"postgresql.zip").write_bytes(raw)
          dest=Path(os.environ["RUNNER_TEMP"])/"ro-original"
          for filename in ro.SOURCE_FILES:
              url=ro.SOURCE_URL+filename
              with urlopen(Request(url,headers=header),timeout=60) as response:
                  if response.status!=200 or response.geturl()!=url:
                      raise ValueError("independent original RO source URL differs")
                  raw=response.read(5_000_001)
              if sha256(raw).hexdigest()!=ro.PINNED_WHOLE_SOURCE_SHA256[filename]:
                  raise ValueError("independent original RO whole-file SHA-256 mismatched")
              (dest/filename).write_bytes(raw)
          print("Original archive, original author mappings, and independent RO raw sources hash-pinned")
          PY
      - name: Test independent comparator negative boundaries
        run: python -m unittest -v network.tests.test_nih_p2_bgee_jena_three_rule_source_comparison
      - name: Construct whole Bgee GenEx RO original input and check all three exact source axioms
        run: |
          set -euo pipefail
          python -m systems.workspace.nih_p2_bgee_jena_three_rule_source_comparison \
            --mode prepare \
            --archive "$RUNNER_TEMP/bgee-original/postgresql.zip" \
            --obda "$RUNNER_TEMP/bgee-original/bgee_v14_genex.obda" \
            --owl "$RUNNER_TEMP/bgee-original/bgee_v14_genex.owl" \
            --r2rml "$RUNNER_TEMP/bgee-original/bgee_v14_genex.r2rml" \
            --ro-base "$RUNNER_TEMP/ro-original/ro-base.owl" \
            --core "$RUNNER_TEMP/ro-original/core.owl" \
            --input-nt "$RUNNER_TEMP/bgee-jena/whole-original-combined.nt"
      - name: Run independent Apache Jena forward RDF rule engine on entire original input
        run: |
          set -euo pipefail
          mvn --batch-mode -q -f systems/workspace/nih_p2_jena_cross_engine/pom.xml compile exec:java \
            -Dexec.mainClass=org.research.nih.p2.BgeeThreeRules \
            -Dexec.args="$RUNNER_TEMP/bgee-jena/whole-original-combined.nt $RUNNER_TEMP/bgee-jena/jena-three-owner-rules.nt"
      - name: Compare full original three-rule Jena output to independent complete SPARQL oracle
        run: |
          set -euo pipefail
          python -m systems.workspace.nih_p2_bgee_jena_three_rule_source_comparison \
            --mode verify \
            --archive "$RUNNER_TEMP/bgee-original/postgresql.zip" \
            --obda "$RUNNER_TEMP/bgee-original/bgee_v14_genex.obda" \
            --owl "$RUNNER_TEMP/bgee-original/bgee_v14_genex.owl" \
            --r2rml "$RUNNER_TEMP/bgee-original/bgee_v14_genex.r2rml" \
            --ro-base "$RUNNER_TEMP/ro-original/ro-base.owl" \
            --core "$RUNNER_TEMP/ro-original/core.owl" \
            --jena-nt "$RUNNER_TEMP/bgee-jena/jena-three-owner-rules.nt" \
            --output "$RUNNER_TEMP/bgee-jena-evidence/independent-three-rule-jena.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"bgee-jena-evidence/independent-three-rule-jena.json").read_text())
          assert r["schema"]=="nih-p2-original-bgee-jena-three-authenticated-rules-v1"
          assert r["original_Bgee_author_zip_Git_blob"]=="234c79cc9e1eca2b6493fc6ee34b8270f2508861"
          assert r["original_source_positive_gene_expression_rows"]==19804
          assert r["original_original_source_edges"]==25027
          assert r["full_source_original_RO_GenEx_Bgee_graph_triples"]==34181
          assert r["source_owner_original_three_axioms_proven"] is True
          assert len(r["original_exact_owner_axiom_premises"])==3
          assert r["Jena_Java_original_entire_input_three_rule_consequences"]==75081
          assert r["independent_static_RDFLib_SPARQL_complete_rule_consequences"]==75081
          assert r["genuine_original_RO_0002330_additional_inherited_consequences"]==25027
          assert r["original_expressed_in_forward_consequences"]==25027
          assert r["original_expresses_inverse_consequences"]==25027
          assert r["Jena_missing_consequences"]==0
          assert r["Jena_unexpected_consequences"]==0
          assert r["source_three_rule_actual_digest_sha256"]==r["independent_three_rule_static_digest_sha256"]
          assert r["full_OWL_RL_profile_executed"] is False
          assert r["independent_RDFS_and_inverse_subset_not_global_consistency"] is True
          assert r["source_observation_is_not_independent_biological_validation"] is True
          assert r["original_W13_modified"] is False
          assert r["official_NIH_benchmark"] is False
          PY
          (cd "$RUNNER_TEMP/bgee-jena-evidence" && sha256sum independent-three-rule-jena.json > sha256.txt)
      - name: Retain only aggregate original-source cross-engine digests, never input or consequence RDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-p2-bgee-jena-cross-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bgee-jena-evidence/
          if-no-files-found: warn
          retention-days: 30
