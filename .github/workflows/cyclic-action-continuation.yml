name: Cyclic Action Engine native continuation witnesses

on:
  push:
    branches: [main]
    paths:
      - 'work/arc_like_maze/cyclic_action_continuation.py'
      - 'work/arc_like_maze/continuity_handoff.py'
      - 'work/arc_like_maze/engine_one.py'
      - 'work/arc_like_maze/window_two.py'
      - 'runtime/handoff.py'
      - 'runtime/engine.py'
      - 'runtime/journal.py'
      - 'network/tests/test_arc_like_cyclic_action_continuation.py'
      - 'network/tests/test_arc_like_continuity_handoff.py'
      - '.github/workflows/cyclic-action-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuation-reentry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile native research and cross-system handoff modules
        run: |
          python -m compileall -q work/arc_like_maze/cyclic_action_continuation.py work/arc_like_maze/continuity_handoff.py runtime/engine.py network/tests/test_arc_like_cyclic_action_continuation.py network/tests/test_arc_like_continuity_handoff.py
      - name: Test native WindowProcess reentry and persistent Continuity handoffs
        run: python -m unittest network.tests.test_arc_like_cyclic_action_continuation network.tests.test_arc_like_continuity_handoff -v
