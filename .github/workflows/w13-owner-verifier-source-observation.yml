# Attest an existing source-owned GitHub run, not a reconstructed Workstation.
# PR tests never request source logs; owner main verifies run/job and log
# in memory and emits only a narrow evidence-bound observation.
name: owner-w13-verifier-source-observation
on:
  pull_request:
    paths:
      - 'research/dives/W13-OWNER-NATIVE-VERIFIER-001/dive.json'
      - 'systems/workspace/w13_owner_verifier_source_record.py'
      - 'network/tests/test_w13_owner_verifier_source_record.py'
      - 'network/tests/test_github_owner_signed_logs.py'
      - 'systems/workspace/github_owner_signed_logs.py'
      - 'systems/workspace/W13_OWNER_VERIFIER_READINESS_GAP.md'
      - '.github/workflows/w13-owner-verifier-source-observation.yml'
  push:
    branches: [main]
    paths:
      - 'research/dives/W13-OWNER-NATIVE-VERIFIER-001/dive.json'
      - '.github/workflows/w13-owner-verifier-source-observation.yml'
permissions:
  contents: read
  actions: read
jobs:
  local-evidence-controls:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate source record and negative controls
        run: python -m unittest -v network.tests.test_w13_owner_verifier_source_record network.tests.test_github_owner_signed_logs
  original-github-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require a new owner-merged source observation, never a new job
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,subprocess
          sha=os.environ['GITHUB_SHA']
          p='research/dives/W13-OWNER-NATIVE-VERIFIER-001/dive.json'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          if git('rev-parse','HEAD')!=sha:
              raise SystemExit('owner merge commit does not match checkout')
          parents=git('rev-list','--parents','-n','1',sha).split()
          if len(parents)!=3:
              raise SystemExit('owner source record must enter via two-parent main merge')
          original='860586aa98ddf27fca71cc53d9fa7fb478102dc4'
          expected_blob='6f2feb35f76f7e2810ba714586585c98b6d45ae9'
          subprocess.run(['git','merge-base','--is-ancestor',original,sha],check=True)
          if (git('rev-parse',f'{original}:{p}')!=expected_blob
                  or git('hash-object',p)!=expected_blob):
              raise SystemExit('original owner W13 source evidence changed')
          changed=git('diff','--name-status',parents[1],sha,'--',p)
          workflow='.github/workflows/w13-owner-verifier-source-observation.yml'
          repair=git('diff','--name-status',parents[1],sha,'--',workflow)
          if (changed or repair!=f'M\t{workflow}'):
              raise SystemExit('expected a new owner-merged read-only log verifier repair')
          if git('diff','--name-status',parents[1],sha,'--','systems/workspace/native_job_requests/w13'):
              raise SystemExit('repair must not authorize a new native job')
          PY
      - name: Authenticate existing GitHub owner run, successful job and redacted log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          from systems.workspace.w13_owner_verifier_source_record import verify_source,RUN_ID,REPO,JOB_ID
          from systems.workspace.github_owner_signed_logs import fetch_signed_job_log
          if os.environ['GITHUB_REPOSITORY']!=REPO:
              raise SystemExit('wrong repository for original owner observation')
          def get(route,parse_json=True):
              req=Request(f'https://api.github.com/repos/{REPO}/{route}',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'w13-original-owner-child-source-observation'})
              with urlopen(req,timeout=30) as stream:
                  data=stream.read(4_000_001)
              if len(data)>4_000_000:
                  raise SystemExit('bounded GitHub observation exceeded size limit')
              return json.loads(data) if parse_json else data.decode('utf8')
          run=get(f'actions/runs/{RUN_ID}')
          jobs=get(f'actions/runs/{RUN_ID}/jobs?per_page=100')
          artifacts=get(f'actions/runs/{RUN_ID}/artifacts?per_page=100')
          log=fetch_signed_job_log(repository=REPO,job_id=JOB_ID,token=os.environ['GH_TOKEN'])
          receipt=verify_source(repo_root=Path(os.environ['GITHUB_WORKSPACE']),
                                run=run,jobs=jobs,artifacts=artifacts,log_text=log)
          # Never print raw log, journal, job inputs or native worker output.
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
