name: ARC3 native SP80 stage3 source feedback-guided search
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_source_guided_search.py'
      - '.github/workflows/arc3-sp80-stage3-source-guided-search.yml'
jobs:
  real-original-sdk-feedback-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Validate finite native source script syntax
        run: python -m compileall -q work/arc3/native_sp80_stage3_source_guided_search.py
      - name: Move on genuine SP80 stage3 using actual SDK pour feedback
        run: python -m work.arc3.native_sp80_stage3_source_guided_search --out runtime/data/arc3/original-sp80-stage3-guided-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-guided-native-evidence
          path: runtime/data/arc3/original-sp80-stage3-guided-native.*
          if-no-files-found: error
          retention-days: 14
