name: ARC3 original SP80 simultaneous three-bar alignment
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_three_bar_alignment.py'
      - '.github/workflows/arc3-sp80-three-bar-alignment.yml'
jobs:
  original-native-three-bar-align:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - run: python -m work.arc3.native_sp80_three_bar_alignment --out runtime/data/arc3/sp80-three-bar-alignment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-three-bar-alignment
          path: runtime/data/arc3/sp80-three-bar-alignment.*
          if-no-files-found: error
          retention-days: 14
