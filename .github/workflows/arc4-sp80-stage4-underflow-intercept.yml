name: ARC4 genuine SP80 lateral-cup underflow interception
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_underflow_intercept.py'
      - '.github/workflows/arc4-sp80-stage4-underflow-intercept.yml'
jobs:
  original-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile true SDK native source
        run: python -m compileall -q work/arc3/native_sp80_stage4_underflow_intercept.py
      - name: Run 40 actual SDK lower side-cup intercept experiments
        run: python -m work.arc3.native_sp80_stage4_underflow_intercept --out runtime/data/arc4/original-sp80-stage4-underflow-intercept.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-underflow-intercept
          path: runtime/data/arc4/original-sp80-stage4-underflow-intercept.*
          if-no-files-found: error
          retention-days: 14
