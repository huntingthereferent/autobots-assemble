name: ARC4 original SP80 left-bar vertical-bypass source
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_vertical_bypass.py'
      - '.github/workflows/arc4-sp80-stage4-vertical-bypass.yml'
jobs:
  original-native:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original stage4 source
        run: python -m compileall -q work/arc3/native_sp80_stage4_vertical_bypass.py
      - name: Run 44 genuine original stage4 SDK reset cases
        run: python -m work.arc3.native_sp80_stage4_vertical_bypass --out runtime/data/arc4/original-sp80-stage4-vertical-bypass.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-vertical-bypass
          path: runtime/data/arc4/original-sp80-stage4-vertical-bypass.*
          if-no-files-found: error
          retention-days: 14
