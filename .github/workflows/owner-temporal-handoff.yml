name: owner W13 and separate temporal source handoff preflight
on:
  pull_request:
    paths:
      - 'systems/workspace/owner_temporal_handoff.py'
      - 'network/tests/test_owner_temporal_handoff.py'
      - '.github/workflows/owner-temporal-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/owner_temporal_handoff.py'
      - 'network/tests/test_owner_temporal_handoff.py'
      - '.github/workflows/owner-temporal-handoff.yml'
permissions:
  contents: read
  actions: read
jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest -v network.tests.test_owner_temporal_handoff
  actual-two-history-preflight:
    needs: boundary-tests
    if: github.event_name == 'push' && github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=45,<47' 'rdflib>=7,<8'
      - name: Authenticate both artifacts, restore owner and reverify separate histories
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_KEY_B64: ${{ secrets.W13_CAPSULE_PRIVATE_KEY_B64 }}
        run: python -m systems.workspace.owner_temporal_handoff
