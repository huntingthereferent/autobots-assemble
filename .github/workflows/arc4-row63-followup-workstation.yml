name: ARC4 original SDK row63 common-action workstation test
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_row63_followup.py'
      - 'work/arc3/arc4_row63_followup_contract.json'
      - 'work/arc3/arc4_row63_followup_gate.py'
      - 'work/arc3/row63_followup_workstation.py'
      - '.github/workflows/arc4-row63-followup-workstation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native-row63-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original native ARC-AGI SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original SDK runner and workstation admission
        run: python -m compileall -q work/arc3/native_sp80_stage4_row63_followup.py work/arc3/arc4_row63_followup_gate.py work/arc3/row63_followup_workstation.py
      - name: Fail-closed source-root and challenge preflight
        run: python -m work.arc3.arc4_row63_followup_gate pre
      - name: Execute actual native SDK through admitted workstation handoff
        run: python -m work.arc3.row63_followup_workstation --execute --data-dir runtime/data/arc4/row63/workstation --out runtime/data/arc4/row63/original-row63-followup.json
      - name: Recompute native source frames from original NPZ and verify return
        run: python -m work.arc3.arc4_row63_followup_gate post --result runtime/data/arc4/row63/original-row63-followup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-row63-followup-workstation
          path: |
            runtime/data/arc4/row63/original-row63-followup.*
            runtime/data/arc4/row63/workstation/**
          retention-days: 90
          if-no-files-found: error
