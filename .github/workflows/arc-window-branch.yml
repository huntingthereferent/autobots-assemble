name: Finite-field transformation systems - focused proofs

on:
  push:
    branches: [main]
    paths:
      - 'work/arc_like_maze/window_branch.py'
      - 'work/arc_like_maze/window_branch_arithmetic_audit.py'
      - 'work/arc_like_maze/window_family.py'
      - 'work/arc_like_maze/window_two.py'
      - 'work/arc_like_maze/nondiagonal_transport.py'
      - 'network/tests/test_arc_like_window_branch.py'
      - 'work/arc_like_maze/window_word_collision.py'
      - 'work/arc_like_maze/window_word_collision_arithmetic_audit.py'
      - 'network/tests/test_arc_like_window_word_collision.py'
      - 'work/arc_like_maze/window_combined.py'
      - 'work/arc_like_maze/window_combined_arithmetic_audit.py'
      - 'network/tests/test_arc_like_window_combined.py'
      - 'work/arc_like_maze/window_marked_arrows.py'
      - 'network/tests/test_arc_like_window_marked_arrows.py'
      - 'work/arc_like_maze/window_root_translation.py'
      - 'network/tests/test_arc_like_window_root_translation.py'
      - 'work/arc_like_maze/translation_centralizer.py'
      - 'network/tests/test_arc_like_translation_centralizer.py'
      - 'work/arc_like_maze/corrected_translation.py'
      - 'network/tests/test_arc_like_corrected_translation.py'
      - 'work/arc_like_maze/nonconstant_drift.py'
      - 'work/arc_like_maze/nonconstant_drift_arithmetic_audit.py'
      - 'network/tests/test_arc_like_nonconstant_drift.py'
      - 'work/arc_like_maze/higher_coupling_lift.py'
      - 'work/arc_like_maze/higher_coupling_arithmetic_audit.py'
      - 'network/tests/test_arc_like_higher_coupling_lift.py'
      - 'work/arc_like_maze/fifth_coordinate_lift.py'
      - 'work/arc_like_maze/fifth_coordinate_arithmetic_audit.py'
      - 'network/tests/test_arc_like_fifth_coordinate_lift.py'
      - '.github/workflows/arc-window-branch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathematical-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact 24-world A/B unit tests
        run: python -m unittest network.tests.test_arc_like_window_branch -v
      - name: Independent arithmetic witnesses
        run: python -m work.arc_like_maze.window_branch_arithmetic_audit
      - name: Fifth-letter word collision regression tests
        run: python -m unittest network.tests.test_arc_like_window_word_collision -v
      - name: Independent 36-world arithmetic witness
        run: python -m work.arc_like_maze.window_word_collision_arithmetic_audit
      - name: Completed 48-world marked-root regression tests
        run: python -m unittest network.tests.test_arc_like_window_combined -v
      - name: Independent full-state and rooted-class audit
        run: python -m work.arc_like_maze.window_combined_arithmetic_audit
      - name: Explicit pointed A/B arrow and mark-transport regression
        run: python -m unittest network.tests.test_arc_like_window_marked_arrows -v
      - name: Central A/B root translation and mixed witness regression
        run: python -m unittest network.tests.test_arc_like_window_root_translation -v
      - name: Two-predecessor centralizer criterion and dimensional obstructions
        run: python -m unittest network.tests.test_arc_like_translation_centralizer -v
      - name: Corrected higher-coordinate centralizer and fixed-fiber obstruction
        run: python -m unittest network.tests.test_arc_like_corrected_translation -v
      - name: Nonconstant lower coupling and pointed cohomology regressions
        run: python -m unittest network.tests.test_arc_like_nonconstant_drift -v
      - name: Independent complete nine-entry lower-coupling graph audit
        run: python -m work.arc_like_maze.nonconstant_drift_arithmetic_audit
      - name: Nonlinear fourth-coordinate lift and exact cyclic-order regressions
        run: python -m unittest network.tests.test_arc_like_higher_coupling_lift -v
      - name: Independent 39366-case voltage-graph and cyclic-order audit
        run: python -m work.arc_like_maze.higher_coupling_arithmetic_audit
      - name: Fifth-coordinate 27-state rank and pointed order-nine lift regression
        run: python -m unittest network.tests.test_arc_like_fifth_coordinate_lift -v
      - name: Independent fifth-coordinate 39366-case signed-graph audit
        run: python -m work.arc_like_maze.fifth_coordinate_arithmetic_audit
