name: ARC4 native right junction A-B
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_right_gate_connectivity.py'
      - '.github/workflows/arc4-sp80-stage4-right-gate-connectivity.yml'
jobs:
  native-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile source-only trial
        run: python -m compileall -q work/arc3/native_sp80_stage4_right_gate_connectivity.py
      - name: Test right-middle junction A-B in original SDK
        run: python -m work.arc3.native_sp80_stage4_right_gate_connectivity --out runtime/data/arc4/original-sp80-right-gate-connectivity.json
      - name: Preserve full original SDK returned frames and action receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-right-gate-connectivity
          path: runtime/data/arc4/original-sp80-right-gate-connectivity.*
          retention-days: 14
          if-no-files-found: error
