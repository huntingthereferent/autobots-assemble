name: NIH P2 independent cross-source observation relations
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_cross_source_relations.py'
      - 'network/tests/test_nih_cross_source_relations.py'
      - 'systems/workspace/NIH_P2_CROSS_SOURCE_BOUNDARY.md'
      - '.github/workflows/nih-p2-cross-source.yml'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/nih_cross_source_relations.py'
      - 'network/tests/test_nih_cross_source_relations.py'
      - 'systems/workspace/NIH_P2_CROSS_SOURCE_BOUNDARY.md'
      - '.github/workflows/nih-p2-cross-source.yml'
permissions:
  contents: read
jobs:
  independently-verify-cross-source-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check failure cases and forbid invented temporal assignments
        run: python -m unittest -v network.tests.test_nih_cross_source_relations
      - name: Reverify real 2023 archive, current official API, and third-party derived versions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nih-cross-source"
          python -m systems.workspace.nih_cross_source_relations \
            --output-dir "$RUNNER_TEMP/nih-cross-source"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"nih-cross-source"
          report=json.loads((out/"nih-p2-cross-source-relations.json").read_text())
          assert report["schema"]=="nih-p2-three-source-observation-relations/v1"
          assert report["nct_id"]=="NCT04153409"
          assert report["source_archival_sha256"]=="bed698312a04292fc31f7ea71130731acc9b57723399ab1b45c0f6d70a304d49"
          assert len(report["derived_source_file_sha256"])==4
          assert len(report["derived_history_status_occurrences"])>0
          assert report["historical_status_corresponds_to_unique_version"] is False
          assert report["historical_record_contents_independently_authenticated"] is False
          assert report["public_posting_time_of_change_known"] is False
          assert report["two_independent_original_historical_snapshots_available"] is False
          assert report["original_twelve_job_workstation_modified"] is False
          assert report["clinical_verdict"]=="NOT_EVALUATED"
          assert report["official_NIH_submission"] is False
          for part in ("aact/nih-p2-archived-aact-source-receipt.json",
                       "derived/nih-p2-independent-derived-history.json"):
              assert (out/part).is_file()
          PY
      - name: Archive limited provenance, source relationships and explicit unknowns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-p2-cross-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nih-cross-source
          if-no-files-found: warn
          retention-days: 30
