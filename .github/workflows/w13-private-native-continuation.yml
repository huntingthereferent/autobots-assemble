# Local cryptographic contract only: no private owner evidence or keys.
# Never execute the native worker and never upload encrypted or raw artifacts.
name: owner-w13-private-native-continuation
on:
  pull_request:
    paths:
      - 'systems/workspace/owner_native_evidence_vault.py'
      - 'network/tests/test_owner_native_evidence_vault.py'
      - 'systems/workspace/W13_PRIVATE_NATIVE_CONTINUATION.md'
      - '.github/workflows/w13-private-native-continuation.yml'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/owner_native_evidence_vault.py'
      - 'network/tests/test_owner_native_evidence_vault.py'
      - 'systems/workspace/W13_PRIVATE_NATIVE_CONTINUATION.md'
      - '.github/workflows/w13-private-native-continuation.yml'
permissions:
  contents: read
jobs:
  native-capsule-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing native cryptography dependency
        run: python -m pip install 'cryptography>=45,<47'
      - name: Check bounded encrypted native source and fail-closed restoration
        run: python -m unittest -v network.tests.test_owner_native_evidence_vault
