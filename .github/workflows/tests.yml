name: protocol-tests

on:
  push:
    branches: [main, english-shape-bank-v1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s network/tests -p "test_*.py"
      - run: python -m unittest discover -s language/tests -p "test_*.py"
