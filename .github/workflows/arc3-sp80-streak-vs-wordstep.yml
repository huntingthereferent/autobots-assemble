name: ARC3 SP80 native ACTION4 streak versus elapsed history

on:
  push:
    paths:
      - "work/arc3/native_sp80_streak_vs_wordstep.py"
      - ".github/workflows/arc3-sp80-streak-vs-wordstep.yml"
  pull_request:
    paths:
      - "work/arc3/native_sp80_streak_vs_wordstep.py"
      - ".github/workflows/arc3-sp80-streak-vs-wordstep.yml"
  workflow_dispatch:

jobs:
  native-history-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official public native ARC SDK
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" numpy
      - name: Retest frozen pre-color model across orthogonal native histories
        run: python -m work.arc3.native_sp80_streak_vs_wordstep --out runtime/data/arc3/sp80-streak-vs-wordstep.json
      - name: Preserve native raw frames, observed levels and exceptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-sp80-native-streak-vs-position
          path: runtime/data/arc3/sp80-streak-vs-wordstep.*
          if-no-files-found: ignore
          retention-days: 14
