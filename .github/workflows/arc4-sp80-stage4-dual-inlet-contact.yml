name: ARC4 original SP80 source selection controls
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_dual_inlet_contact.py'
      - '.github/workflows/arc4-sp80-stage4-dual-inlet-contact.yml'
jobs:
  native-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile
        run: python -m compileall -q work/arc3/native_sp80_stage4_dual_inlet_contact.py
      - name: Execute comparison
        run: python -m work.arc3.native_sp80_stage4_dual_inlet_contact --out runtime/data/arc4/original-sp80-stage4-dual-inlet-contact.json
      - name: Preserve outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-stage4-dual-inlet-contact
          path: runtime/data/arc4/original-sp80-stage4-dual-inlet-contact.*
          if-no-files-found: error
          retention-days: 14
