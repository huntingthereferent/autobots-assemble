name: ARC3 Gen1 Hermetic Tests

on:
  push:
    paths:
      - "research/dives/ARC3-TRACE-001/direct_agent/gen1/**"
      - ".github/workflows/arc3_gen1_tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/dives/ARC3-TRACE-001/direct_agent/gen1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hermetic dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile core modules
        run: python -m py_compile state.py model.py test_core.py
      - name: Run core tests
        run: python -m unittest -v test_core.py
