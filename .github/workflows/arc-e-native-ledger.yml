name: ARC E native evidence verification
on:
  pull_request:
    paths:
      - '.github/workflows/arc-e-native-ledger.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Independent native SP80 trial and evidence ledger
        run: python -m work.arc3.native_sp80_matched_geometry --out runtime/data/arc3/arc-e-native-ledger.json
      - name: Check actual original SDK evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/data/arc3/arc-e-native-ledger.json')
          data=json.loads(p.read_text())
          assert data['actual_original_game_resets']==48
          assert data['actual_original_sdk_action_calls']==492
          assert data['real_original_ACTION5_events']==48
          assert sum(map(int,data['actual_original_A5_frame_length_frequency'].values()))==48
          assert len(data['original_native_full_source_trial_evidence'])==48
          assert p.with_suffix('.npz').is_file()
          print('NATIVE_EVIDENCE_VERIFIED: 48 complete resets, 492 calls, 48 action5 events; original frames retained')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-e-native-ledger
          path: runtime/data/arc3/arc-e-native-ledger.*
          if-no-files-found: warn
          retention-days: 14
