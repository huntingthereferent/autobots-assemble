name: Generate source-native profile motion

on:
  pull_request:
    paths:
      - 'views/motion/**'
      - 'views/traces/convergence_focus.py'
      - 'views/traces/test_convergence_focus.py'
      - 'systems/workspace/research_observatory.py'
      - 'network/tests/test_research_observatory.py'
      - 'views/motion/atlas_dashboard.py'
      - 'views/motion/test_atlas_dashboard.py'
      - 'research/dives/**'
      - 'work/arc_like_maze/chatbot/checkpoints/**'
      - 'state/pins/**'
      - '.github/workflows/profile-motion.yml'
  push:
    branches: [main]
    paths:
      - 'views/motion/render.py'
      - 'views/motion/test_render.py'
      - 'views/motion/atlas_dashboard.py'
      - 'views/motion/test_atlas_dashboard.py'
      - 'views/traces/registry.json'
      - 'systems/workspace/research_observatory.py'
      - 'network/tests/test_research_observatory.py'
      - 'views/traces/internet-map.json'
      - 'views/motion/convergence-receipt.json'
      - 'views/motion/convergence.py'
      - 'views/motion/test_convergence.py'
      - 'views/traces/convergence_focus.py'
      - 'views/traces/test_convergence_focus.py'
      - 'views/world-continuity/latest.json'
      - 'work/arc_like_maze/math.py'
      - '.github/workflows/profile-motion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-native-profile-motion
  cancel-in-progress: false

jobs:
  source-to-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Native mathematics and source-projection tests
        run: python -m unittest -v views.motion.test_render views.motion.test_convergence views.traces.test_convergence_focus views.motion.test_atlas_dashboard network.tests.test_research_observatory network.tests.test_workstation_monitor network.tests.test_workstation_http
      - name: Generate source-linked animations and native confluence
        run: |
          python -m views.motion.render
          python -m views.motion.convergence
          python -m views.motion.atlas_dashboard
      - name: Validate SVG and reduced-motion handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths=list(Path("views/motion").glob("*-motion.svg"))
          assert len(paths)==3
          paths.append(Path('views/motion/atlas-dashboard.svg'))
          for p in paths:
              ET.parse(p)
              assert "@media(prefers-reduced-motion:reduce)" in p.read_text()
          print("Validated",len(paths),"source-driven SVGs")
          PY
      - name: Commit regenerated SVGs after original source changes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/motion/finite-motion.svg views/motion/world-motion.svg views/motion/convergence-motion.svg views/motion/convergence-receipt.json views/motion/atlas-dashboard.svg
          if git diff --cached --quiet; then echo "No SVG change"; exit 0; fi
          git commit -m "Render motion from source-owned observations"
          for attempt in 1 2 3; do
            git fetch origin main
            if git diff --name-only HEAD origin/main | grep -E '^(work/arc_like_maze/math\.py|views/work_state\.json|views/world-continuity/latest\.json|views/motion/render\.py|views/motion/test_render\.py)$'; then
              echo "Source changed during rendering"; exit 1
            fi
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
