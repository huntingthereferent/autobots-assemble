name: WORLD — Friction Spin Trial 12
on:
  push:
    branches:
      - 'experiment/world-trial12-friction-spin-sweep-20261019'
    paths:
      - '.github/workflows/world-ab-friction-spin-trial.yml'
      - 'systems/workspace/world_ab_friction_spin_trial.py'
      - 'network/tests/test_world_ab_friction_spin_trial.py'
      - 'docs/world_ab_friction_spin_trial.html'
      - 'scripts/verify_world_ab_friction_spin_browser.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-friction-spin-controls-and-independent-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Independent 420 friction-spin controls and preserved Trial 05-11 regressions
        run: |
          python -m unittest -v \
            network.tests.test_world_ab_friction_spin_trial \
            network.tests.test_world_ab_contact_discrimination \
            network.tests.test_world_ab_active_set_trial \
            network.tests.test_world_ab_two_contact_stress \
            network.tests.test_world_ab_two_contact_candidate \
            network.tests.test_world_ab_junction_threshold \
            network.tests.test_world_ab_junction_continuous \
            network.tests.test_world_ab_connected_routing
      - name: Install actual Chromium
        run: |
          python -m pip install 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Independently replay original browser source and candidate friction/spin
        run: |
          python -m scripts.verify_world_ab_friction_spin_browser --output-dir "$RUNNER_TEMP/world-trial12"
      - name: Retain source evidence, 420 candidate cases and real browser witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-trial12-friction-spin-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/world-trial12/world_trial12_native.json
            ${{ runner.temp }}/world-trial12/world_trial12_browser.json
            ${{ runner.temp }}/world-trial12/world_trial12_chromium.png
            ${{ runner.temp }}/world-trial12/world_trial12_verification.json
            docs/world_ab_friction_spin_trial.html
            docs/world_ab_active_set_trial.html
            docs/world_ab_two_contact_stress.html
            docs/world_ab_junction_geometry.js
          retention-days: 30
          if-no-files-found: warn
