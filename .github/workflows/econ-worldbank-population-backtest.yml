name: econ-worldbank-population-backtest

on:
  pull_request:
    paths:
      - "research/studies/econ_worldbank_us_population/**"
      - ".github/workflows/econ-worldbank-population-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  econ-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source constraints, historical windows, and negative controls offline
        run: python -m unittest discover -s research/studies/econ_worldbank_us_population -p 'test_*.py' -v
      - name: Ensure the default state is unobserved without source access
        run: |
          python research/studies/econ_worldbank_us_population/experiment.py --output unobserved-econ.json
          python - <<'PY'
          import json
          r = json.load(open("unobserved-econ.json", encoding="utf-8"))
          assert r["state"] == "UNOBSERVED" and r["scientific_experiments_run"] == 0
          PY

  econ-single-source-measurement:
    needs: econ-source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently fetch and check one bounded revised WDI JSON source
        run: python research/studies/econ_worldbank_us_population/experiment.py --live --output wdi-derived.json
      - name: Report exact measured errors, including unfavorable ones
        shell: bash
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("### ECON / USA population: exact-source historical backtest")
          path = Path("wdi-derived.json")
          if not path.exists():
              print("No derived witness generated; run not observed.")
          else:
              doc = json.loads(path.read_text(encoding="utf-8"))
              print("Source state: " + doc["state"])
              if doc["state"] == "MEASURED_REVISED_SNAPSHOT":
                  o = doc["measured"]
                  print("Source SHA-256: " + doc["source_sha256"])
                  print(f'Backtest years: {o["n_backtest"]}; persistence MAE {o["persistence_mae_persons"]:,.1f} persons; five-year drift MAE {o["drift_mae_persons"]:,.1f} persons')
                  print("Better on this one revised snapshot: " + ("drift" if o["drift_outperforms_baseline"] else "persistence / tie"))
                  print("Not a vintage-correct or real-time forecasting result.")
              else:
                  print("No scientific measurement: source wall.")
          PY
      - name: Preserve only source hash and derived forecast-error witness
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: econ-wdi-us-population-derived-witness
          path: wdi-derived.json
          retention-days: 30
          if-no-files-found: warn
