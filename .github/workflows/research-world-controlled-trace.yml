name: research-world-controlled-trace

on:
  pull_request:
    paths:
      - "research/testing_lanes/world_controlled_trace.py"
      - "research/testing_lanes/test_world_controlled_trace.py"
      - ".github/workflows/research-world-controlled-trace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run controlled-reset and negative controls
        run: python -m unittest discover -s research/testing_lanes -p "test_world_controlled_trace.py" -v

  bounded-trace:
    needs: offline-controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Produce controlled trace receipt
        run: |
          mkdir -p world_receipt
          python research/testing_lanes/world_controlled_trace.py --output world_receipt/WORLD-CONTROLLED-TRACE-001.json
      - name: Preserve trace receipt
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-CONTROLLED-TRACE-001-receipt
          path: world_receipt/*.json
          if-no-files-found: error
          retention-days: 30
