name: WORLD 41 first post-sixth source clearance

on:
  push:
    paths:
      - 'systems/workspace/world_ab_post_sixth_local_clearance.py'
      - 'network/tests/test_world_ab_post_sixth_local_clearance.py'
      - 'systems/workspace/WORLD_AB_POST_SIXTH_LOCAL_CLEARANCE_TRIAL_41_2026-10-21.md'
      - '.github/workflows/world-ab-post-sixth-local-clearance.yml'
  pull_request:
    paths:
      - 'systems/workspace/world_ab_post_sixth_local_clearance.py'
      - 'network/tests/test_world_ab_post_sixth_local_clearance.py'
      - 'systems/workspace/WORLD_AB_POST_SIXTH_LOCAL_CLEARANCE_TRIAL_41_2026-10-21.md'
      - '.github/workflows/world-ab-post-sixth-local-clearance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-sixth-hypothesis-independent-clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent original WORLD41 chronological plane-corner clearance
        run: python -m unittest -v network.tests.test_world_ab_post_sixth_local_clearance
      - name: Preserve original finite source prefix and independent numerical witness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          from systems.workspace.world_ab_post_sixth_local_clearance import run
          from network.tests.test_world_ab_post_sixth_local_clearance import verify
          source=run()
          separate=[{"angle":c["angle"],"status":c["status"],
                     "independent_source_prefix_replay":verify(c)}
                    for c in source["cases"]]
          assert len(separate)==8 and all(z["independent_source_prefix_replay"] for z in separate)
          assert source["eligible_conditional_sixth_models"]==1
          assert source["no_source_sixth_response_controls"]==7
          assert source["supported_full_windows"]+source["first_unresolved_windows"]==1
          assert source["material_sixth_impacts"]==0 and source["material_seventh_impacts"]==0
          assert source["seventh_impulses"]==0
          folder=Path("world41-native-evidence")
          folder.mkdir(exist_ok=True)
          payload=json.dumps({"original_source":source,"independent_replay":separate},
                             sort_keys=True,indent=2,allow_nan=False)+"\n"
          (folder/"post_sixth_first_original_clearance_prefix.json").write_text(payload)
          (folder/"post_sixth_first_original_clearance_prefix.sha256").write_text(
              sha256(payload.encode()).hexdigest()+"  post_sixth_first_original_clearance_prefix.json\n")
          print(json.dumps({"source_qualified_sixth_models":source["eligible_conditional_sixth_models"],
              "complete_windows":source["supported_full_windows"],
              "first_unresolved_windows":source["first_unresolved_windows"],
              "inactive_original_controls":source["no_source_sixth_response_controls"],
              "material_seventh_impulses":0},sort_keys=True))
          for row in source["cases"]:
              if row["original_conditional_sixth_pose"] is not None:
                  u=row["first_unknown_original_subinterval"]
                  print(json.dumps({"angle":row["angle"],"status":row["status"],
                    "verified_post_sixth_prefix_end":row["supported_contiguous_prefix_end"],
                    "declared_window":row["declared_post_sixth_window"],
                    "first_unknown":[u["start"],u["end"]] if u else None,
                    "accepted_original_subintervals":len(row["accepted_original_subintervals"]),
                    "physical_seventh_contact":False},sort_keys=True))
          PY
      - name: Retain WORLD41 original source and independent prefix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world41-original-post-sixth-clearance
          path: world41-native-evidence/
          if-no-files-found: warn
          retention-days: 30

  inherited-original-world-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reverify original WORLD04–40 native lineage before accepting new prefix
        run: |
          python -m unittest -v network.tests.test_world_ab_oblique_impact network.tests.test_world_ab_local_recontact_impulse network.tests.test_world_ab_rotating_receiver network.tests.test_world_ab_third_contact network.tests.test_world_ab_first_post_third_candidate network.tests.test_world_ab_all_inward_finite_features network.tests.test_world_ab_rotating_edge_face_endpoint network.tests.test_world_ab_finite_segment_square_overlap network.tests.test_world_ab_between_sample_clearance network.tests.test_world_ab_local_finite_onset network.tests.test_world_ab_first_finite_response_qualification network.tests.test_world_ab_post_fourth_local_clearance network.tests.test_world_ab_first_envelope_limit network.tests.test_world_ab_geometry_at_first_envelope_limit network.tests.test_world_ab_local_plane_prefix network.tests.test_world_ab_first_unknown_finite_feature network.tests.test_world_ab_whole_contact_configuration network.tests.test_world_ab_post_fifth_local_clearance network.tests.test_world_ab_post_fifth_contiguous_prefix network.tests.test_world_ab_first_post_fifth_guard_limit network.tests.test_world_ab_local_zero_gap_after_guard network.tests.test_world_ab_sixth_conditional_normal_law
