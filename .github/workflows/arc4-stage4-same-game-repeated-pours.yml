name: ARC4 lane B original same-game repeated pours
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_same_game_repeated_pours.py'
      - '.github/workflows/arc4-stage4-same-game-repeated-pours.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-stage4-repeated-action5:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original SDK temporal source test
        run: python -m compileall -q work/arc3/native_sp80_stage4_same_game_repeated_pours.py
      - name: Execute six frozen same-game POUR histories with independent A/B entrances
        run: python -m work.arc3.native_sp80_stage4_same_game_repeated_pours --out runtime/data/arc4/arc4-same-game-repeated-pours.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-same-game-repeated-pours
          path: runtime/data/arc4/arc4-same-game-repeated-pours.*
          retention-days: 90
          if-no-files-found: error
