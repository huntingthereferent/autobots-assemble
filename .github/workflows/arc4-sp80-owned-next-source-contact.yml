name: ARC owned A-B next source contact
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_ab_next_source_contact.py'
      - '.github/workflows/arc4-sp80-owned-next-source-contact.yml'
  workflow_dispatch:
jobs:
  next-original-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile next owned source contact
        run: python -m compileall -q work/arc3/native_sp80_stage4_ab_next_source_contact.py
      - name: Execute observed mistake-led A-B in original SDK
        run: python -m work.arc3.native_sp80_stage4_ab_next_source_contact --out runtime/data/arc4/owned-next-contact.json
      - name: Preserve original source receipts and complete returned frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-sp80-next-source-contact-frames
          path: runtime/data/arc4/owned-next-contact.*
          if-no-files-found: warn
          retention-days: 14
