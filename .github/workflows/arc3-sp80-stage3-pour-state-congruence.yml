name: ARC3 source-native SP80 stage3 pour congruence
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_pour_state_congruence.py'
      - '.github/workflows/arc3-sp80-stage3-pour-state-congruence.yml'
jobs:
  genuine-native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK and numpy
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Verify source program syntax
        run: python -m compileall -q work/arc3/native_sp80_stage3_pour_state_congruence.py
      - name: Replay real SP80 source-state and animation congruence experiment
        run: python -m work.arc3.native_sp80_stage3_pour_state_congruence --out runtime/data/arc3/original-sp80-stage3-pour-congruence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-pour-congruence-source
          path: runtime/data/arc3/original-sp80-stage3-pour-congruence.*
          if-no-files-found: error
          retention-days: 14
