name: workstation-b18-coordinated-observed-native
on:
  push:
    paths:
      - 'systems/workspace/b18_coordinated_observed_journal.py'
      - 'systems/workspace/b11_native_local_delivery.py'
      - 'network/tests/test_b18_coordinated_observed_journal.py'
      - 'systems/workspace/B18_COORDINATED_OBSERVED_NATIVE.md'
      - '.github/workflows/workstation-b18-coordinated-observed-native.yml'
  pull_request:
    paths:
      - 'systems/workspace/b18_coordinated_observed_journal.py'
      - 'systems/workspace/b11_native_local_delivery.py'
      - 'network/tests/test_b18_coordinated_observed_journal.py'
      - 'systems/workspace/B18_COORDINATED_OBSERVED_NATIVE.md'
      - '.github/workflows/workstation-b18-coordinated-observed-native.yml'
  workflow_dispatch:

jobs:
  lower-native-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Ed25519 dependency
        run: python -m pip install 'cryptography>=45,<47'
      - name: Require exactly 12 B18 observed journal/native tests without skips
        run: |
          python - <<'PY'
          import unittest
          from network.tests import test_b18_coordinated_observed_journal
          suite = unittest.defaultTestLoader.loadTestsFromModule(test_b18_coordinated_observed_journal)
          if suite.countTestCases() != 12:
              raise SystemExit(f'expected 12 B18 cases, got {suite.countTestCases()}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('B18 lower-level journal native coordination failed')
          PY
      - name: Preserve B17 to B10 native and event journal regressions
        run: |
          python -m unittest -v \
            network.tests.test_b17_native_api_coordination \
            network.tests.test_b16_delivery_coordination \
            network.tests.test_b15_mandatory_operator_trust \
            network.tests.test_b14_operator_pin_ledger \
            network.tests.test_b13_offline_owner_delivery \
            network.tests.test_b12_b3_native_delivery \
            network.tests.test_b11_native_local_delivery \
            network.tests.test_b9_event_bridge \
            network.tests.test_observed_event_journal \
            network.tests.test_observed_event_journal_native
      - name: Preserve original 73 B9 construction cases
        run: |
          python - <<'PY'
          import importlib, unittest
          names = (
              'network.tests.test_workstation_construction',
              'network.tests.test_workstation_construction_frontier',
              'network.tests.test_workstation_construction_scale',
              'network.tests.test_workstation_construction_route_scope',
          )
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.loadTestsFromModule(importlib.import_module(name))
              for name in names
          )
          if suite.countTestCases() != 73:
              raise SystemExit('original B9 construction count changed')
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('B9 construction regressions failed')
          PY
