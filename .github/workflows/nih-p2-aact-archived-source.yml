name: NIH P2 independently archived AACT snapshot
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_aact_archival_source.py'
      - 'network/tests/test_nih_aact_archival_source.py'
      - 'systems/workspace/NIH_P2_REAL_ARCHIVE_BOUNDARY.md'
      - '.github/workflows/nih-p2-aact-archived-source.yml'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/nih_aact_archival_source.py'
      - 'network/tests/test_nih_aact_archival_source.py'
      - 'systems/workspace/NIH_P2_REAL_ARCHIVE_BOUNDARY.md'
      - '.github/workflows/nih-p2-aact-archived-source.yml'
permissions:
  contents: read
jobs:
  independently-verify-published-aact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exercise local negative controls without crediting mocks as evidence
        run: python -m unittest -v network.tests.test_nih_aact_archival_source
      - name: Download and hash the entire published archive, select real historical rows and compare separate current source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nih-aact-archival-receipts"
          python -m systems.workspace.nih_aact_archival_source \
            --output-dir "$RUNNER_TEMP/nih-aact-archival-receipts"
          python - <<'PY'
          from pathlib import Path
          import json, os
          out=Path(os.environ["RUNNER_TEMP"])/"nih-aact-archival-receipts"
          report=json.loads((out/"nih-p2-archived-aact-source-receipt.json").read_text())
          assert report["schema"]=="nih-p2-real-aact-archived-source-v1"
          assert report["case_count"]==2
          assert report["entire_archive_verified_md5"]=="d043fb7704bcff8cfb5be95d4f5ced85"
          assert len(report["entire_archive_sha256"])==64
          assert report["archive_file_size_bytes"]>200000000
          assert {x["nct_id"] for x in report["cases"]}=={"NCT03280849","NCT04153409"}
          assert report["exact_per_study_version_number_proven"] is False
          assert report["archive_date_is_individual_study_post_date"] is False
          assert report["clinical_verdict"]=="NOT_EVALUATED"
          assert report["official_NIH_submission"] is False
          assert report["additional_native_workstation_job"] is False
          assert report["original_workstation_modified"] is False
          PY
      - name: Archive only minimal public source evidence and content digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-p2-aact-2023-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nih-aact-archival-receipts
          if-no-files-found: warn
          retention-days: 30
