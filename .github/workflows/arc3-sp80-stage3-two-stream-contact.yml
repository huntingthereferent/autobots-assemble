name: ARC3 original SP80 source two-stream contact timing
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_two_stream_contact.py'
      - '.github/workflows/arc3-sp80-stage3-two-stream-contact.yml'
jobs:
  genuine-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile authentic source experiment
        run: python -m compileall -q work/arc3/native_sp80_stage3_two_stream_contact.py
      - name: Test two-stream source observations on forty original SDK resets
        run: python -m work.arc3.native_sp80_stage3_two_stream_contact --out runtime/data/arc3/original-sp80-stage3-two-stream-contact.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-two-stream-contact
          path: runtime/data/arc3/original-sp80-stage3-two-stream-contact.*
          if-no-files-found: error
          retention-days: 14
