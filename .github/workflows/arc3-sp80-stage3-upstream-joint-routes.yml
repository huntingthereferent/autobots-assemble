name: ARC3 genuine SP80 stage3 upstream pairwise routes
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_upstream_joint_routes.py'
      - '.github/workflows/arc3-sp80-stage3-upstream-joint-routes.yml'
jobs:
  original-sdk-route-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Verify actual native experiment syntax
        run: python -m compileall -q work/arc3/native_sp80_stage3_upstream_joint_routes.py
      - name: Run original SDK upstream pairwise route experiment
        run: python -m work.arc3.native_sp80_stage3_upstream_joint_routes --out runtime/data/arc3/original-sp80-stage3-upstream-joint-routes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-upstream-joint-routes
          path: runtime/data/arc3/original-sp80-stage3-upstream-joint-routes.*
          if-no-files-found: error
          retention-days: 14
