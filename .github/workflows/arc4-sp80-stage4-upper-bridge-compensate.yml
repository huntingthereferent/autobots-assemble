name: ARC4 original upper bridge compensation
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_upper_bridge_compensate.py'
      - '.github/workflows/arc4-sp80-stage4-upper-bridge-compensate.yml'
jobs:
  original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile source experiment
        run: python -m compileall -q work/arc3/native_sp80_stage4_upper_bridge_compensate.py
      - name: Execute native rooted upper-bridge A-B
        run: python -m work.arc3.native_sp80_stage4_upper_bridge_compensate --out runtime/data/arc4/original-sp80-upper-bridge-compensate.json
      - name: Retain true original SDK frame arrays and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-upper-bridge-compensate
          path: runtime/data/arc4/original-sp80-upper-bridge-compensate.*
          if-no-files-found: error
          retention-days: 14
