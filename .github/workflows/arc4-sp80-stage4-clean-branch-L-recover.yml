name: ARC4 original SP80 clean middle branch L-cup restoration
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_clean_branch_L_recover.py'
      - '.github/workflows/arc4-sp80-stage4-clean-branch-L-recover.yml'
jobs:
  genuine-original-stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile actual source trial
        run: python -m compileall -q work/arc3/native_sp80_stage4_clean_branch_L_recover.py
      - name: Execute 48 original SDK level4 clean-branch L-position games
        run: python -m work.arc3.native_sp80_stage4_clean_branch_L_recover --out runtime/data/arc4/original-sp80-stage4-clean-branch-L-recover.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-clean-branch-L-recover
          path: runtime/data/arc4/original-sp80-stage4-clean-branch-L-recover.*
          if-no-files-found: error
          retention-days: 14
