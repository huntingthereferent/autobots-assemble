name: ARC3 native SP80 level3 entry from verified source winner
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_entry_source_map.py'
      - '.github/workflows/arc3-sp80-stage3-entry-source-map.yml'
jobs:
  authentic-sdk-level3-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original SDK and numpy
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Inspect actual original SDK level3 entry under two independent witnesses
        run: python -m work.arc3.native_sp80_stage3_entry_source_map --out runtime/data/arc3/original-sp80-stage3-entry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentic-original-sp80-stage3-entry
          path: runtime/data/arc3/original-sp80-stage3-entry.*
          if-no-files-found: error
          retention-days: 14
