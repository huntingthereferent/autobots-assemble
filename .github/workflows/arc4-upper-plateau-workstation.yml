name: ARC4 original SDK finite upper-plateau transfer
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_upper_plateau_transfer.py'
      - 'work/arc3/arc4_upper_plateau_contract.json'
      - 'work/arc3/arc4_upper_plateau_gate.py'
      - 'work/arc3/upper_plateau_workstation.py'
      - '.github/workflows/arc4-upper-plateau-workstation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-level4-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original Arcade SDK and source-array reader
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile genuine source trial and independent math gate
        run: |
          python -m compileall -q \
            work/arc3/native_sp80_stage4_upper_plateau_transfer.py \
            work/arc3/arc4_upper_plateau_gate.py \
            work/arc3/upper_plateau_workstation.py
      - name: Check predeclared original SDK Level4 source program and controls
        run: python -m work.arc3.arc4_upper_plateau_gate pre
      - name: Run 24 genuine original Level4 SDK experiments inside ProcessWorkstation
        run: |
          python -m work.arc3.upper_plateau_workstation \
            --execute \
            --data-dir runtime/data/arc4/plateau/workstation \
            --out runtime/data/arc4/plateau/original-upper-plateau.json
      - name: Independently verify native source frame arrays, actual actions and conditional relationship
        run: |
          python -m work.arc3.arc4_upper_plateau_gate post \
            --result runtime/data/arc4/plateau/original-upper-plateau.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-native-upper-plateau
          path: |
            runtime/data/arc4/plateau/original-upper-plateau.*
            runtime/data/arc4/plateau/workstation/**
          retention-days: 90
          if-no-files-found: warn
