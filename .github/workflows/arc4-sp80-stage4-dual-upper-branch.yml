name: ARC4 original SP80 combined top and right upper stream contact
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_dual_upper_branch.py'
      - '.github/workflows/arc4-sp80-stage4-dual-upper-branch.yml'
jobs:
  original-sdk-native:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile genuine source test
        run: python -m compileall -q work/arc3/native_sp80_stage4_dual_upper_branch.py
      - name: Run 52 original SDK coupled-upper-branch games
        run: python -m work.arc3.native_sp80_stage4_dual_upper_branch --out runtime/data/arc4/original-sp80-stage4-dual-upper-branch.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-dual-upper-branch
          path: runtime/data/arc4/original-sp80-stage4-dual-upper-branch.*
          if-no-files-found: error
          retention-days: 14
