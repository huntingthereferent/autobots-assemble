name: NIH P2 wider heldout source ranking
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_p2_broad_heldout_trial.py'
      - 'network/tests/test_nih_p2_broad_heldout_trial.py'
      - '.github/workflows/nih-p2-broad-heldout-ranking.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nih-p2-broad-heldout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-source-broader-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and retrieve three complete immutable original PharmKG source files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pharmkg-original" "$RUNNER_TEMP/pharmkg-derived"
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from systems.workspace import nih_p2_external_pharmkg_heldout_trial as p
          import os
          root="https://raw.githubusercontent.com/"+p.ORIGIN+"/"+p.COMMIT+"/data/PharmKG-8k/"
          target=Path(os.environ["RUNNER_TEMP"])/"pharmkg-original"
          for name,blob in p.SOURCE_FILES.items():
              url=root+name
              with urlopen(Request(url,headers={"User-Agent":"NIH-P2-Broad-Source-Rank/1.0"}),timeout=50) as response:
                  if response.status != 200 or response.geturl() != url:
                      raise ValueError("source redirect or origin mismatch")
                  raw=response.read(15_000_001)
              if len(raw)>15_000_000 or p.git_blob_sha1(raw)!=blob:
                  raise ValueError("entire original source Git blob changed")
              (target/name).write_bytes(raw)
          PY
      - name: Independently check tie ranks and heldout/train split rejection
        env:
          PHARMKG_ORIGINAL_TRAIN: ${{ runner.temp }}/pharmkg-original/train.tsv
          PHARMKG_ORIGINAL_TEST: ${{ runner.temp }}/pharmkg-original/test.tsv
          PHARMKG_ORIGINAL_VALID: ${{ runner.temp }}/pharmkg-original/valid.tsv
        run: python -m unittest -v network.tests.test_nih_p2_broad_heldout_trial
      - name: Execute original 64 new heldout queries over predeclared 128-tail candidate samples
        env:
          PHARMKG_ORIGINAL_TRAIN: ${{ runner.temp }}/pharmkg-original/train.tsv
          PHARMKG_ORIGINAL_TEST: ${{ runner.temp }}/pharmkg-original/test.tsv
          PHARMKG_ORIGINAL_VALID: ${{ runner.temp }}/pharmkg-original/valid.tsv
        run: |
          set -euo pipefail
          python -m systems.workspace.nih_p2_broad_heldout_trial \
            --train "$PHARMKG_ORIGINAL_TRAIN" \
            --test "$PHARMKG_ORIGINAL_TEST" \
            --valid "$PHARMKG_ORIGINAL_VALID" \
            --output "$RUNNER_TEMP/pharmkg-derived/broader-128-rank.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ["RUNNER_TEMP"])/"pharmkg-derived/broader-128-rank.json"
          x=json.loads(p.read_text())
          assert x["schema"]=="nih-p2-bounded-broad-pharmkg-heldout-v1"
          assert x["A_B_and_static_same_information_metrics"]["cases"]==64
          assert x["candidate_pool_alternatives"]==128
          assert x["equally_capable_static_rank_disagreements"]==0
          assert x["candidate_pool_is_full_entity_ranking"] is False
          assert x["unlabeled_alternatives_confirmed_false"] is False
          assert x["official_NIH_benchmark"] is False
          PY
          (cd "$RUNNER_TEMP/pharmkg-derived" && sha256sum broader-128-rank.json > sha256.txt)
      - name: Preserve only derived heldout ranks, not original source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-p2-broad-heldout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pharmkg-derived/
          if-no-files-found: warn
          retention-days: 30
