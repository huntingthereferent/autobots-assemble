name: ARC4 original four-cup no-upper-arrival test
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_upper_strip_counterexample.py'
      - '.github/workflows/arc4-sp80-stage4-upper-strip-counterexample.yml'
jobs:
  original-normal-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile frozen native source programs
        run: python -m compileall -q work/arc3/native_sp80_stage4_upper_strip_counterexample.py
      - name: Run 52 genuine original SP80 native games
        run: python -m work.arc3.native_sp80_stage4_upper_strip_counterexample --out runtime/data/arc4/original-sp80-stage4-upper-strip-counterexample.json
      - name: Save complete original SDK frame stacks and actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-stage4-upper-strip-counterexample
          path: runtime/data/arc4/original-sp80-stage4-upper-strip-counterexample.*
          if-no-files-found: error
          retention-days: 14
