name: ARC3 genuine source stage2 joint four-bar factor trial
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage2_four_bar_factorial.py'
      - '.github/workflows/arc3-sp80-stage2-four-bar-factorial.yml'
jobs:
  original-native-stage2-four-bar-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public original ARC native SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Assert source four-bar independent factorial froze correctly
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_stage2_four_bar_factorial import (
            PROGRAMS,FACTORS,CONTROLS,RESETS)
          from work.arc3.native_sp80_multi_select import parse_plan
          assert len(PROGRAMS)==24 and len(FACTORS)==16 and len(CONTROLS)==8
          assert RESETS==2
          for name,word in PROGRAMS:
              acts=parse_plan(word)
              assert acts[-1][0]==5
              assert sum(a==6 for a,xy in acts)==4
              assert all(a!=6 or xy is not None for a,xy in acts)
          print('UNIT ONLY: genuine original SDK stage2 four-bar factorial frozen')
          PY
      - name: Execute real original SP80 stage2 source four-bar conditions
        run: python -m work.arc3.native_sp80_stage2_four_bar_factorial --out runtime/data/arc3/stage2-four-bar-factorial.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage2-four-bar-factorial
          path: runtime/data/arc3/stage2-four-bar-factorial.*
          if-no-files-found: error
          retention-days: 14
