name: NIH P2 exact historical source version evidence
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_historical_version_evidence.py'
      - 'network/tests/test_nih_historical_version_evidence.py'
      - 'systems/workspace/NIH_P2_EXACT_HISTORY_LIMITS.md'
      - '.github/workflows/nih-p2-exact-historical-version.yml'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/nih_historical_version_evidence.py'
      - 'network/tests/test_nih_historical_version_evidence.py'
      - 'systems/workspace/NIH_P2_EXACT_HISTORY_LIMITS.md'
      - '.github/workflows/nih-p2-exact-historical-version.yml'
permissions:
  contents: read
jobs:
  independent-exact-version-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check exact version identity and negative controls
        run: python -m unittest -v network.tests.test_nih_historical_version_evidence
      - name: Attempt exact historical source retrieval without fabricating source content
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nih-historical-versions"
          python -m systems.workspace.nih_historical_version_evidence \
            --output-dir "$RUNNER_TEMP/nih-historical-versions"
          python - <<'PY'
          import json,os
          from pathlib import Path
          source=Path(os.environ["RUNNER_TEMP"])/"nih-historical-versions/nih-p2-historical-version-receipts.json"
          data=json.loads(source.read_text())
          assert data["two_exact_version_contents_retrieved"] is True
          assert len(data["historical_version_receipts"])==2
          assert data["per_version_publication_date_proven"] is False
          assert data["historical_point_in_time_public_visibility_proven"] is False
          assert data["raw_study_content_not_archived"] is True
          assert data["additional_native_workstation_job"] is False
          assert data["official_NIH_submission"] is False
          assert all(len(x["raw_source_sha256"])==64 for x in data["historical_version_receipts"])
          assert all(x["source_field"]=="study.protocolSection.statusModule.overallStatus" for x in data["historical_version_receipts"])
          PY
      - name: Archive only version-specific minimal provenance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-p2-historical-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nih-historical-versions
          if-no-files-found: warn
          retention-days: 30
