name: owner-w13-encrypted-capsule-producer
on:
  push:
    branches: [main]
    paths:
      - 'systems/workspace/native_retention_requests/w13/verified-child-local-capsule.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: owner-w13-encrypted-capsule
  cancel-in-progress: false
jobs:
  seal-authorized-child:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=45,<47' 'rdflib>=7,<8'
      - name: Authenticate new recipient and encrypted storage request before download
        env:
          PUBLIC_KEY: ${{ vars.W13_CAPSULE_PUBLIC_KEY_B64 }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from systems.workspace.w13_owner_verifier_execution import authenticate_retention_request
          if (os.environ['GITHUB_EVENT_NAME'] != 'push' or os.environ['GITHUB_REF'] != 'refs/heads/main'
              or os.environ['GITHUB_ACTOR'] != os.environ['GITHUB_REPOSITORY_OWNER']
              or os.environ['GITHUB_RUN_ATTEMPT'] != '1'):
              raise SystemExit('new owner push on main, first attempt only')
          key=os.environ['PUBLIC_KEY'].strip()
          authenticate_retention_request(Path.cwd(), os.environ['GITHUB_SHA'], key,
              artifact_retention_days=1)
          (Path(os.environ['RUNNER_TEMP'])/'recipient.b64').write_text(key)
          PY
      - name: Authenticate original owner-run and immutable evidence artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-w13-source"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          from systems.workspace.github_w13_continuation import (
              RUN_ID,ARTIFACT_ID,ORIGINAL_HEAD,ORIGINAL_DIGEST)
          repo=os.environ['GITHUB_REPOSITORY']
          def get(route):
              req=Request(f'https://api.github.com/repos/{repo}/{route}',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'w13-original-native-research-source'})
              with urlopen(req,timeout=20) as stream:
                  return json.load(stream)
          run=get(f'actions/runs/{RUN_ID}')
          if (run['name']!='workstation-w13-owner-merged-one-shot'
                  or run['head_repository']['full_name']!=repo
                  or run['head_sha']!=ORIGINAL_HEAD
                  or run['event']!='push' or run['head_branch']!='main'
                  or run['status']!='completed' or run['conclusion']!='success'
                  or run['actor']['login']!=os.environ['GITHUB_REPOSITORY_OWNER']):
              raise SystemExit('original owner source not authenticated')
          arts=get(f'actions/runs/{RUN_ID}/artifacts?per_page=100')['artifacts']
          matches=[a for a in arts if a['id']==ARTIFACT_ID
                   and a['name']==f'w13-owner-merged-native-{RUN_ID}-1'
                   and a.get('workflow_run',{}).get('id')==RUN_ID
                   and a.get('digest')==ORIGINAL_DIGEST and not a['expired']]
          if len(matches)!=1:
              raise SystemExit('original native artifact expired, missing or changed')
          origin={'repository':repo,'workflow':run['name'],'run_id':RUN_ID,
                  'attempt':1,'head_sha':ORIGINAL_HEAD,'event':'push',
                  'branch':'main','actor':run['actor']['login'],
                  'conclusion':'success','artifact_id':ARTIFACT_ID,
                  'digest':ORIGINAL_DIGEST,'artifact_expired':False}
          (Path(os.environ['RUNNER_TEMP'])/'original-w13-source'/'binding.json').write_text(
              json.dumps(origin,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'run_id={RUN_ID}\n')
              out.write(f'name=w13-owner-merged-native-{RUN_ID}-1\n')
          print('Original owner W13 source and artifact verified')
          PY
      - name: Download authenticated original W13 artifact with digest validation
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.name }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-w13-artifact
      - name: Execute and seal actual verified child before cleanup
        run: |
          mkdir -m 700 "$RUNNER_TEMP/sealed-output"
          python -m systems.workspace.w13_owner_verifier_execution \
            --artifact-dir "$RUNNER_TEMP/original-w13-artifact" \
            --source-binding "$RUNNER_TEMP/original-w13-source/binding.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --owner-merge-sha "$GITHUB_SHA" \
            --recipient-public-key-file "$RUNNER_TEMP/recipient.b64" \
            --encrypted-output "$RUNNER_TEMP/sealed-output/continuation.enc" \
            --artifact-retention-days 1 > "$RUNNER_TEMP/sealed-output/receipt.json"
      - name: Retain only ciphertext and redacted receipt for one day
        uses: actions/upload-artifact@v4
        with:
          name: w13-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sealed-output/continuation.enc
            ${{ runner.temp }}/sealed-output/receipt.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove local encrypted output and public key
        if: always()
        run: rm -rf "$RUNNER_TEMP/sealed-output" "$RUNNER_TEMP/recipient.b64"
