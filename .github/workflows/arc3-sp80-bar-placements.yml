name: ARC3 genuine SP80 selected-bar placements and SDK level2
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_bar_placements.py'
      - '.github/workflows/arc3-sp80-bar-placements.yml'
jobs:
  original-native-three-bar-placements:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real original public ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Assert concrete predeclared source placements and proper click data
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_bar_placements import PROGRAMS,RESETS,SOURCE_BANDS
          from work.arc3.native_sp80_multi_select import parse_plan
          assert len(PROGRAMS)==16 and RESETS==2
          assert len({name for name,_ in PROGRAMS})==16 and len(SOURCE_BANDS)==4
          for name,program in PROGRAMS:
             actions=parse_plan(program)
             assert actions[-1][0]==5
             assert all(n!=6 or xy is not None for n,xy in actions)
          print('UNIT ONLY: source 3-bar legal coordinates and full-stack controls frozen')
          PY
      - name: Execute official original SP80 selected-bar placements
        run: python -m work.arc3.native_sp80_bar_placements --out runtime/data/arc3/sp80-bar-placements.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-bar-placements
          path: runtime/data/arc3/sp80-bar-placements.*
          if-no-files-found: error
          retention-days: 14
