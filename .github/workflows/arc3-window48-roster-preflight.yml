name: ARC3 original Window48 public native A3 preflight

on:
  push:
    paths:
      - "work/arc3/native_window48_roster_preflight.py"
      - ".github/workflows/arc3-window48-roster-preflight.yml"
  workflow_dispatch:

jobs:
  native-rooted-generator-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official native ARC runtime
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" numpy
      - name: Test source F3-48 A3 against advertised real native controls
        run: python -m work.arc3.native_window48_roster_preflight --out runtime/data/arc3/window48-native-A3-preflight.json
      - name: Preserve actual raw frames and negative/unknown controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-window48-public-native-A3-preflight
          path: runtime/data/arc3/window48-native-A3-preflight.*
          if-no-files-found: ignore
          retention-days: 14
