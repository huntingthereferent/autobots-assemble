name: workstation-b14-operator-pin-trust
on:
  push:
    paths:
      - 'systems/workspace/b14_operator_pin_ledger.py'
      - 'systems/workspace/b14_operator_cli.py'
      - 'systems/workspace/b12_b3_native_delivery.py'
      - 'systems/workspace/b13_offline_owner_delivery.py'
      - 'network/tests/test_b14_operator_pin_ledger.py'
      - 'systems/workspace/B14_OPERATOR_PIN_TRUST.md'
      - '.github/workflows/workstation-b14-operator-pin-trust.yml'
  pull_request:
    paths:
      - 'systems/workspace/b14_operator_pin_ledger.py'
      - 'systems/workspace/b14_operator_cli.py'
      - 'systems/workspace/b12_b3_native_delivery.py'
      - 'systems/workspace/b13_offline_owner_delivery.py'
      - 'network/tests/test_b14_operator_pin_ledger.py'
      - 'systems/workspace/B14_OPERATOR_PIN_TRUST.md'
      - '.github/workflows/workstation-b14-operator-pin-trust.yml'
  workflow_dispatch:

jobs:
  operator-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Ed25519 validation dependency
        run: python -m pip install 'cryptography>=45,<47'
      - name: Require exactly 25 B14 pin lifecycle and native subprocess cases
        run: |
          python - <<'PY'
          import unittest
          from network.tests import test_b14_operator_pin_ledger
          suite = unittest.defaultTestLoader.loadTestsFromModule(test_b14_operator_pin_ledger)
          if suite.countTestCases() != 25:
              raise SystemExit(f'expected 25 B14 cases, got {suite.countTestCases()}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('B14 operator pin trust tests failed or skipped')
          PY
      - name: Preserve B13 B12 B11 B10 native and event journal regressions
        run: |
          python -m unittest -v \
            network.tests.test_b13_offline_owner_delivery \
            network.tests.test_b12_b3_native_delivery \
            network.tests.test_b11_native_local_delivery \
            network.tests.test_b9_event_bridge \
            network.tests.test_observed_event_journal \
            network.tests.test_observed_event_journal_native
      - name: Preserve 73 original B9 construction cases
        run: |
          python - <<'PY'
          import importlib, unittest
          names = (
              'network.tests.test_workstation_construction',
              'network.tests.test_workstation_construction_frontier',
              'network.tests.test_workstation_construction_scale',
              'network.tests.test_workstation_construction_route_scope',
          )
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.loadTestsFromModule(importlib.import_module(name))
              for name in names
          )
          if suite.countTestCases() != 73:
              raise SystemExit('original B9 construction count changed')
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('B9 native construction regressions failed')
          PY
