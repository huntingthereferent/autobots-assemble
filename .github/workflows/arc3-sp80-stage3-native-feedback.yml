name: ARC3 genuine SP80 stage3 source feedback to level4
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_native_feedback.py'
      - '.github/workflows/arc3-sp80-stage3-native-feedback.yml'
      - 'work/arc3/cp_gate.py'
      - 'network/tests/test_arc3_cp_gate.py'
jobs:
  original-source-stage3-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ARC-specific CP entry against source and preserved walls
        run: |
          python -m unittest -v network.tests.test_arc3_cp_gate
          python -m work.arc3.cp_gate entry --lane sp80-stage3 --receipt runtime/data/arc3/cp-sp80-stage3.json
      - name: Install authentic ARC SDK and numpy
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Check bounded native trial source compiles
        run: python -m compileall -q work/arc3/native_sp80_stage3_native_feedback.py
      - name: Run original SP80 SDK stage3 feedback trial from genuine 0 to 3
        run: python -m work.arc3.native_sp80_stage3_native_feedback --out runtime/data/arc3/original-sp80-stage3-native-feedback.json
      - name: Enforce B/OUTPUT against original native SDK report and raw frames
        if: always()
        run: python -m work.arc3.cp_gate exit --lane sp80-stage3 --receipt runtime/data/arc3/cp-sp80-stage3.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentic-original-sp80-stage3-feedback
          path: |
            runtime/data/arc3/original-sp80-stage3-native-feedback.*
            runtime/data/arc3/cp-sp80-stage3*.json
          if-no-files-found: error
          retention-days: 14
