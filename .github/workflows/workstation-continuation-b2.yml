name: workstation-continuation-b2
on:
  push:
    paths:
      - "systems/workspace/workstation_continuation.py"
      - "systems/workspace/workstation_harness.py"
      - "network/tests/test_workstation_harness.py"
      - "network/tests/test_workstation_native_feedback_integration.py"
      - "network/tests/test_workstation_return_continuation.py"
      - "systems/workspace/workstation_return_continuation.py"
      - "systems/workspace/workstation_owner_native_observer.py"
      - "network/tests/test_workstation_owner_native_observer.py"
      - "systems/workspace/workstation_native_feedback.py"
      - ".github/workflows/workstation-continuation-b2.yml"
  pull_request:
    paths:
      - "systems/workspace/workstation_continuation.py"
      - "systems/workspace/workstation_harness.py"
      - "network/tests/test_workstation_harness.py"
      - "network/tests/test_workstation_native_feedback_integration.py"
      - "network/tests/test_workstation_return_continuation.py"
      - "systems/workspace/workstation_return_continuation.py"
      - "systems/workspace/workstation_owner_native_observer.py"
      - "network/tests/test_workstation_owner_native_observer.py"
      - "systems/workspace/workstation_native_feedback.py"
      - ".github/workflows/workstation-continuation-b2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuation-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing CP30 witness dependency
        run: python -m pip install 'cryptography>=45,<47'
      - name: Regression tests on real repository runtime
        run: |
          python -m unittest -v network.tests.test_workstation_harness network.tests.test_workstation_native_feedback_integration network.tests.test_workstation_return_continuation
          python -m unittest -v network.tests.test_agent_lineage network.tests.test_branch_help
      - name: Reconstruct original CP30 native modules from preserved source
        run: |
          python work/arc_like_maze/chatbot/research/integrated/assemble.py --stage 30 --out /tmp/workstation-b5-cp30-native
      - name: Verify live CP30 owner-task B5 bridge and native regressions
        env:
          CP30_NATIVE_SOURCE_DIR: /tmp/workstation-b5-cp30-native
        run: |
          python -m unittest -v network.tests.test_workstation_owner_native_observer network.tests.test_native_owner_observation

