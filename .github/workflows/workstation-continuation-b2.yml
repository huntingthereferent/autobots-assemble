name: workstation-continuation-b2
on:
  push:
    branches:
      - feature/workstation-continuation-b2-20261015
    paths:
      - "systems/workspace/workstation_continuation.py"
      - "systems/workspace/workstation_harness.py"
      - "network/tests/test_workstation_harness.py"
      - ".github/workflows/workstation-continuation-b2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuation-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing CP30 witness dependency
        run: python -m pip install 'cryptography>=45,<47'
      - name: Regression tests on real repository runtime
        run: |
          python -m unittest -v network.tests.test_workstation_harness
          python -m unittest -v network.tests.test_agent_lineage network.tests.test_branch_help
