name: ARC B native intervention controls
on:
  pull_request:
    paths:
      - '.github/workflows/arc-b-native-controls.yml'
  workflow_dispatch:
jobs:
  native-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Run original SP80 action5 and selection controls
        run: python -m work.arc3.native_sp80_action5_frame_stacks --out runtime/data/arc3/arc-b-native-controls.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-b-native-controls
          path: runtime/data/arc3/arc-b-native-controls.*
          if-no-files-found: warn
          retention-days: 14
