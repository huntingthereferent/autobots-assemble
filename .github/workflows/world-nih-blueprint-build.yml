name: WORLD — Phase 1-contained Phase 2 temporal blueprint BUILD
on:
  push:
    branches:
      - 'world/w13-two-world-advance-contract-20261016'
    paths:
      - '.github/workflows/world-nih-blueprint-build.yml'
      - 'docs/world_phase1_phase2_blueprint.html'
      - 'network/tests/fixtures/world_nih_phase1_phase2_blueprint_v1.json'
      - 'network/tests/test_world_nih_blueprint.py'
      - 'systems/workspace/world_temporal_blueprint.py'
      - 'scripts/verify_world_phase1_phase2_blueprint_browser.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-world-blueprint-build-and-independent-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read unmodified WORLD contract and new blueprint source
        uses: actions/checkout@v5
        with:
          path: world
          persist-credentials: false
      - name: Restore pinned original W12/W13 browser and native verifier
        uses: actions/checkout@v5
        with:
          ref: cbeea0e5994ac72674bc4e4e304405b5fff66dc2
          path: original-w13
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify this WORLD branch still has exact two-room movement contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path("world")
          w=json.loads((root/"network/tests/fixtures/world_w13_movement_01.json").read_text())
          b=json.loads((root/"network/tests/fixtures/world_nih_phase1_phase2_blueprint_v1.json").read_text())
          assert w["worlds"]==b["base_world"]["rooms"]
          assert w["actions"]==["right","interact","advance","right","interact"]
          assert w["contract"]==b["base_world"]["version"]
          assert os.environ["GITHUB_REF_NAME"]=="world/w13-two-world-advance-contract-20261016"
          assert "BUILD NOT YET VERIFIED" in (root/"systems/workspace/WORLD_W13_MOVEMENT_01.md").read_text()
          print("Original WORLD two-room specification and explicit Advance preserved")
          PY
      - name: Install actual headless Chromium
        run: |
          python -m pip install 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Falsify date confusion, forged source, and display/engine mismatch
        run: |
          cd world
          python -m unittest -v network.tests.test_world_nih_blueprint
      - name: Play editable source and query worlds; verify W13 original independently
        run: |
          cd world
          python -m scripts.verify_world_phase1_phase2_blueprint_browser \
            --reference-dir "$GITHUB_WORKSPACE/original-w13" \
            --output-dir "$RUNNER_TEMP/world-temporal-blueprint-build"
      - name: Save screenshot, original room receipt, and independently verified query evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-temporal-blueprint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/world-temporal-blueprint-build/world_phase1_phase2_blueprint.png
            ${{ runner.temp }}/world-temporal-blueprint-build/world_phase1_phase2_blueprint_receipt.json
            ${{ runner.temp }}/world-temporal-blueprint-build/world_phase1_phase2_browser_witness.json
            world/docs/world_phase1_phase2_blueprint.html
            world/network/tests/fixtures/world_nih_phase1_phase2_blueprint_v1.json
          retention-days: 30
          if-no-files-found: warn
