name: ARC4 original frame8 source comparison
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_frame8_middle_fork.py'
      - '.github/workflows/arc4-sp80-stage4-frame8-middle-fork.yml'
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original source code
        run: python -m compileall -q work/arc3/native_sp80_stage4_frame8_middle_fork.py
      - name: Test 64 native SP80 Level4 configurations
        run: python -m work.arc3.native_sp80_stage4_frame8_middle_fork --out runtime/data/arc4/original-sp80-stage4-frame8-middle-fork.json
      - name: Archive original SDK frames and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-stage4-frame8-middle-fork
          path: runtime/data/arc4/original-sp80-stage4-frame8-middle-fork.*
          if-no-files-found: error
          retention-days: 14
