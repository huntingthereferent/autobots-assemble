name: ARC4 original Level4 middle-height source postflight (read-only)
on:
  pull_request:
    paths:
      - 'work/arc3/arc4_middle_height_spill_gate.py'
      - 'work/arc3/arc4_middle_height_spill_contract.json'
      - '.github/workflows/arc4-middle-height-spill-postflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-native-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import-compatible original SDK and NPZ reader, no native game execution
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Fetch actual existing original 24-reset native source evidence by immutable artifact ID
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/data/arc4/height-spill
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/huntingthereferent/autobots-assemble/actions/artifacts/12590876301/zip' \
            --output runtime/data/arc4/height-spill/original-sdk-source-40171838520.zip
          unzip -t runtime/data/arc4/height-spill/original-sdk-source-40171838520.zip >/dev/null
          unzip -o -q runtime/data/arc4/height-spill/original-sdk-source-40171838520.zip \
            -d runtime/data/arc4/height-spill
          cd runtime/data/arc4/height-spill
          printf '%s  %s\n' \
            632b3a0e5b497127a15e73f29c5adb7b88b84febb96e0373201d519d003e3e96 original-height-spill.json \
            9ca5a0eab6344aa6bd100a4b811611796002907a8a87dc607a1fcdac0d80fe4f original-height-spill.npz \
            | sha256sum --check --strict
      - name: Check frozen finite source math question and official game oracle
        run: python -m work.arc3.arc4_middle_height_spill_gate pre
      - name: Independently rederive all native 64x64 frame receipts and source cup and spill relations without running game
        run: |
          python -m work.arc3.arc4_middle_height_spill_gate post \
            --result runtime/data/arc4/height-spill/original-height-spill.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-middle-height-original-read-only-source-proof
          path: runtime/data/arc4/height-spill/original-height-spill.protocol.json
          if-no-files-found: warn
          retention-days: 90
