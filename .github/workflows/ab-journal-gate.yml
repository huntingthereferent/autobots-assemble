name: A/B Journal Gate
on:
  push:
    paths:
      - 'runtime/ab_journal_gate.py'
      - 'runtime/journal.py'
      - 'network/tests/test_ab_journal_gate.py'
      - 'network/tests/test_agent_service.py'
      - 'network/tests/test_agent_lineage.py'
      - '.github/workflows/ab-journal-gate.yml'
  pull_request:
    paths:
      - 'runtime/ab_journal_gate.py'
      - 'runtime/journal.py'
      - 'network/tests/test_ab_journal_gate.py'
      - 'network/tests/test_agent_service.py'
      - 'network/tests/test_agent_lineage.py'
      - '.github/workflows/ab-journal-gate.yml'
  workflow_dispatch:
jobs:
  gate-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate and agent service regressions
        run: |
          python -m unittest -v network.tests.test_ab_journal_gate network.tests.test_agent_service network.tests.test_agent_lineage
