name: ARC3 original SP80 restore third cup without bottom change
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_restore_third_cup.py'
      - '.github/workflows/arc3-sp80-stage3-restore-third-cup.yml'
jobs:
  real-original-sp80:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile genuine native study
        run: python -m compileall -q work/arc3/native_sp80_stage3_restore_third_cup.py
      - name: Execute original 50 game third cup clean-boundary contrast
        run: python -m work.arc3.native_sp80_stage3_restore_third_cup --out runtime/data/arc3/original-sp80-stage3-restore-third-cup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-restore-third-cup
          path: runtime/data/arc3/original-sp80-stage3-restore-third-cup.*
          if-no-files-found: error
          retention-days: 14
