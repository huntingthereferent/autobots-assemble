name: ARC3 original SP80 lower-right receiver first-branch contact
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_right_receiver_contact.py'
      - '.github/workflows/arc3-sp80-stage3-right-receiver-contact.yml'
jobs:
  original-source-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile authentic source trial
        run: python -m compileall -q work/arc3/native_sp80_stage3_right_receiver_contact.py
      - name: Test 36 original SDK right-receiver contact sessions
        run: python -m work.arc3.native_sp80_stage3_right_receiver_contact --out runtime/data/arc3/original-sp80-stage3-right-receiver-contact.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-right-receiver-contact
          path: runtime/data/arc3/original-sp80-stage3-right-receiver-contact.*
          if-no-files-found: error
          retention-days: 14
