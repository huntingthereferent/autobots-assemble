name: Native A/B rooted inverse observation
on:
  push:
    branches: ['experiment/ab-native-inverse-20261017']
    paths:
      - 'work/arc_like_maze/window_rooted_observation.py'
      - 'work/arc_like_maze/WINDOW_ROOTED_OBSERVATION.md'
      - 'network/tests/test_arc_like_window_rooted_observation.py'
      - '.github/workflows/ab-window48-rooted.yml'
  pull_request:
    paths:
      - 'work/arc_like_maze/window_rooted_observation.py'
      - 'work/arc_like_maze/WINDOW_ROOTED_OBSERVATION.md'
      - 'network/tests/test_arc_like_window_rooted_observation.py'
      - '.github/workflows/ab-window48-rooted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rooted-native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actual 48-law classifier, unpointed and rooted inverse
        run: |
          python -m unittest network.tests.test_arc_like_window_combined network.tests.test_arc_like_window_inverse_observation network.tests.test_arc_like_window_rooted_observation network.tests.test_arc_like_inverse_observation_engine -v
      - name: Generate exact source-rooted certificate and synthetic trace
        run: |
          mkdir -p runtime/data/ab-inverse
          python -m work.arc_like_maze.window_rooted_observation --certificate --demo-law 0,0,1,0 > runtime/data/ab-inverse/rooted48-classification.json
          python -m work.arc_like_maze.window_rooted_observation > runtime/data/ab-inverse/rooted48-open-frontier.json
      - name: Retain computed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ab-rooted48-inverse
          path: runtime/data/ab-inverse/rooted48-*.json
          retention-days: 14
          if-no-files-found: warn
