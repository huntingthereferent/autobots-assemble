name: ARC3 original SP80 upward interception of fourth-cup overflow
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_upward_catcher.py'
      - '.github/workflows/arc3-sp80-stage3-upward-catcher.yml'
jobs:
  real-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Verify source code compiles
        run: python -m compileall -q work/arc3/native_sp80_stage3_upward_catcher.py
      - name: Execute 38 original SP80 SDK upward-catch games
        run: python -m work.arc3.native_sp80_stage3_upward_catcher --out runtime/data/arc3/original-sp80-stage3-upward-catcher.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-upward-catcher
          path: runtime/data/arc3/original-sp80-stage3-upward-catcher.*
          if-no-files-found: error
          retention-days: 14
