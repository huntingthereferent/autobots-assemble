name: ARC3 source-native SP80 independent middle-center bar
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_independent_center.py'
      - '.github/workflows/arc3-sp80-stage3-independent-center.yml'
jobs:
  original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Check native source experiment compiles
        run: python -m compileall -q work/arc3/native_sp80_stage3_independent_center.py
      - name: Run 26 genuine SP80 SDK independent middle-center trials
        run: python -m work.arc3.native_sp80_stage3_independent_center --out runtime/data/arc3/original-sp80-stage3-independent-center.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-independent-center
          path: runtime/data/arc3/original-sp80-stage3-independent-center.*
          if-no-files-found: error
          retention-days: 14
