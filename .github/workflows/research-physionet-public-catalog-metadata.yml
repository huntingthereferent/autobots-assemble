name: research-physionet-public-catalog-metadata

on:
  pull_request:
    paths:
      - "research/testing_lanes/physionet_public/**"
      - ".github/workflows/research-physionet-public-catalog-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-metadata-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public identity, license and no-waveform negative controls
        run: python -m unittest discover -s research/testing_lanes/physionet_public -p "test_*.py" -v
      - name: Default command remains offline
        run: python research/testing_lanes/physionet_public/catalog_identity.py

  exact-public-catalog-page:
    needs: offline-metadata-contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect only the publisher's exact public MIT-BIH v1.0.0 landing page
        run: python research/testing_lanes/physionet_public/catalog_identity.py --live --output physionet-public-catalog-receipt.json
      - name: Preserve derived-only source receipt, including access walls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physionet-mitdb-1.0.0-public-catalog-receipt
          path: physionet-public-catalog-receipt.json
          if-no-files-found: warn
          retention-days: 30
