name: ARC3 original 48-law official native smoke

on:
  push:
    paths:
      - "work/arc3/agent/my_agent.py"
      - "work/arc3/native_smoke.py"
      - ".github/workflows/arc3-f3-native-smoke.yml"
  pull_request:
    paths:
      - "work/arc3/agent/my_agent.py"
      - "work/arc3/native_smoke.py"
      - ".github/workflows/arc3-f3-native-smoke.yml"
  workflow_dispatch:

jobs:
  actual-native-window48:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official native ARC runtime
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" python-dotenv numpy
      - name: Prepare official ARC single-file agent harness
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git "$RUNNER_TEMP/arc3-starter"
          mkdir -p "$RUNNER_TEMP/arc3-starter/vendor"
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Agents.git "$RUNNER_TEMP/arc3-starter/vendor/ARC-AGI-3-Agents"
          python "$RUNNER_TEMP/arc3-starter/scripts/slim_framework.py"
      - name: Real SK48 native — first bounded original-window48 agent pass
        env:
          ARC3_FRAMEWORK: ${{ runner.temp }}/arc3-starter/vendor/ARC-AGI-3-Agents
        run: python -m work.arc3.native_smoke --game sk48 --max-actions 12 --out runtime/data/arc3/window48-sk48.json
      - name: Real LS20 native — independent game check with same agent
        env:
          ARC3_FRAMEWORK: ${{ runner.temp }}/arc3-starter/vendor/ARC-AGI-3-Agents
        run: python -m work.arc3.native_smoke --game ls20 --max-actions 12 --out runtime/data/arc3/window48-ls20.json
      - name: Real FT09 click-only — verify no fictional A/B controls issued
        env:
          ARC3_FRAMEWORK: ${{ runner.temp }}/arc3-starter/vendor/ARC-AGI-3-Agents
        run: python -m work.arc3.native_smoke --game ft09 --max-actions 12 --out runtime/data/arc3/window48-ft09.json
      - name: Preserve source-owned raw frames and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-original-window48-native-observations
          path: runtime/data/arc3/window48-*.*
          if-no-files-found: ignore
          retention-days: 14
