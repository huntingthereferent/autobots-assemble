name: ARC3 F3 official native smoke

on:
  push:
    paths:
      - "work/arc3/native_smoke.py"
      - "work/arc3/native_f3_generator_probe.py"
      - ".github/workflows/arc3-f3-native-smoke.yml"
  workflow_dispatch:

jobs:
  real-native-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official local native ARC runtime
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" python-dotenv numpy
      - name: Prepare official ARC agent framework
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git "$RUNNER_TEMP/arc3-starter"
          mkdir -p "$RUNNER_TEMP/arc3-starter/vendor"
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Agents.git "$RUNNER_TEMP/arc3-starter/vendor/ARC-AGI-3-Agents"
          python "$RUNNER_TEMP/arc3-starter/scripts/slim_framework.py"
      - name: Native LS20 — bounded F3 intervention and raw observation
        env:
          ARC3_FRAMEWORK: ${{ runner.temp }}/arc3-starter/vendor/ARC-AGI-3-Agents
        run: python -m work.arc3.native_smoke --game ls20 --max-actions 12 --out runtime/data/arc3/f3-native-smoke.json
      - name: Native LS20 — test necessary F3 A-cubed equality for each advertised simple action
        run: python -m work.arc3.native_f3_generator_probe --game ls20 --out runtime/data/arc3/f3-generator-probe.json
      - name: Save actual native frames and F3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-f3-native-ls20-observations
          path: |
            runtime/data/arc3/f3-native-smoke.*
            runtime/data/arc3/f3-generator-probe.*
          if-no-files-found: ignore
          retention-days: 14
