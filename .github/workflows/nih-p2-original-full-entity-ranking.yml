name: NIH P2 original PharmKG full entity ranking
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_p2_full_entity_filtered_trial.py'
      - 'network/tests/test_nih_p2_full_entity_filtered_trial.py'
      - '.github/workflows/nih-p2-original-full-entity-ranking.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nih-p2-full-source-entity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source-full-candidate-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pin and download exact full original PharmKG train test valid splits
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pharmkg-original" "$RUNNER_TEMP/full-entity-evidence"
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from systems.workspace import nih_p2_external_pharmkg_heldout_trial as source
          import os
          root="https://raw.githubusercontent.com/"+source.ORIGIN+"/"+source.COMMIT+"/data/PharmKG-8k/"
          dest=Path(os.environ["RUNNER_TEMP"])/"pharmkg-original"
          for file,expected in source.SOURCE_FILES.items():
              url=root+file
              with urlopen(Request(url,headers={"User-Agent":"NIH-P2-Full-Entity-ReadOnly/1.0"}),timeout=45) as response:
                  if response.status!=200 or response.geturl()!=url:
                      raise ValueError("wrong original source release/host")
                  raw=response.read(15_000_001)
              if len(raw)>15_000_000 or source.git_blob_sha1(raw)!=expected:
                  raise ValueError("whole original source Git object mismatch")
              (dest/file).write_bytes(raw)
          PY
      - name: Independent source witness and full-entity tie-rank controls
        env:
          PHARMKG_ORIGINAL_TRAIN: ${{ runner.temp }}/pharmkg-original/train.tsv
          PHARMKG_ORIGINAL_TEST: ${{ runner.temp }}/pharmkg-original/test.tsv
          PHARMKG_ORIGINAL_VALID: ${{ runner.temp }}/pharmkg-original/valid.tsv
        run: python -m unittest -v network.tests.test_nih_p2_full_entity_filtered_trial
      - name: Run fixed heldout questions against all original source entity IDs
        env:
          PHARMKG_ORIGINAL_TRAIN: ${{ runner.temp }}/pharmkg-original/train.tsv
          PHARMKG_ORIGINAL_TEST: ${{ runner.temp }}/pharmkg-original/test.tsv
          PHARMKG_ORIGINAL_VALID: ${{ runner.temp }}/pharmkg-original/valid.tsv
        run: |
          set -euo pipefail
          python -m systems.workspace.nih_p2_full_entity_filtered_trial \
            --train "$PHARMKG_ORIGINAL_TRAIN" \
            --test "$PHARMKG_ORIGINAL_TEST" \
            --valid "$PHARMKG_ORIGINAL_VALID" \
            --output "$RUNNER_TEMP/full-entity-evidence/source-full-entity.json"
          python - <<'PY'
          from pathlib import Path
          import os,json
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"full-entity-evidence/source-full-entity.json").read_text())
          assert r["schema"]=="nih-p2-pharmkg-frozen-full-entity-filtered-ranking-v1"
          assert r["A_B_source_label_filtered"]["n"]==64
          assert r["original_source_entities_from_all_splits"]>128
          assert r["independent_equal_strength_static_feature_disagreements"]==0
          assert r["equally_capable_static_scores_identical"] is True
          assert r["test_valid_labels_used_for_model_or_rule_selection"] is False
          assert r["official_NIH_benchmark"] is False
          assert r["original_W13_journal_modified"] is False
          PY
          (cd "$RUNNER_TEMP/full-entity-evidence" && sha256sum source-full-entity.json > sha256.txt)
      - name: Preserve derived full candidate scores only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-p2-full-original-source-ranking-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-entity-evidence/
          if-no-files-found: warn
          retention-days: 30
