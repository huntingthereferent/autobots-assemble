name: NIH P2 Lane C E18 original referent all-predicate OWL RL differential
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_p2_bgee_original_referent_all_predicate_inventory.py'
      - 'network/tests/test_nih_p2_bgee_original_referent_all_predicate_inventory.py'
      - '.github/workflows/nih-p2-bgee-all-referent-predicates-e18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whole-original-general-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install general OWL RL and independent RDFLib baseline
        run: python -m pip install 'rdflib>=7,<8' 'owlrl>=7,<8'
      - name: Download immutable complete original author sources under whole-file integrity checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nih-c-bgee" "$RUNNER_TEMP/nih-c-ro" lane-c-e18-evidence
          python - <<'PY'
          from systems.workspace import nih_p2_author_genex_bgee_ro_mapping_gate as b
          from systems.workspace import nih_p2_original_bgee_real_expression_join as trial
          from systems.workspace import nih_phase2_external_obo_graph_trial as ro
          from pathlib import Path
          from urllib.request import Request, urlopen
          from hashlib import sha256
          import os
          header={"User-Agent":"NIH-P2-LaneC-FullProfile/1.0"}
          out=Path(os.environ["RUNNER_TEMP"])/"nih-c-bgee"
          for filename,pin in b.FILES.items():
              url="https://raw.githubusercontent.com/"+b.OWNER+"/"+b.COMMIT+"/obda/"+filename
              with urlopen(Request(url,headers=header),timeout=60) as response:
                  if response.status!=200 or response.geturl()!=url:
                      raise ValueError("author source URL differed")
                  raw=response.read(1_000_001)
              if len(raw)>1_000_000 or b.git_blob(raw)!=pin:
                  raise ValueError("author Git blob integrity changed")
              (out/filename).write_bytes(raw)
          url="https://raw.githubusercontent.com/"+b.OWNER+"/"+b.COMMIT+"/data/postgresql.zip"
          with urlopen(Request(url,headers=header),timeout=90) as response:
              if response.status!=200 or response.geturl()!=url:
                  raise ValueError("author Bgee archive URL differed")
              raw=response.read(30_000_001)
          if b.git_blob(raw)!=trial.ZIP_BLOB:
              raise ValueError("author Bgee archive Git blob changed")
          (out/"postgresql.zip").write_bytes(raw)
          dest=Path(os.environ["RUNNER_TEMP"])/"nih-c-ro"
          for filename in ro.SOURCE_FILES:
              url=ro.SOURCE_URL+filename
              with urlopen(Request(url,headers=header),timeout=60) as response:
                  if response.status!=200 or response.geturl()!=url:
                      raise ValueError("original RO owner URL changed")
                  raw=response.read(5_000_001)
              if sha256(raw).hexdigest()!=ro.PINNED_WHOLE_SOURCE_SHA256[filename]:
                  raise ValueError("original RO complete SHA256 changed")
              (dest/filename).write_bytes(raw)
          print("original complete Bgee+GenEx+RO owner-source hashes verified")
          PY
      - name: Run separate synthetic negative controls
        run: python -m unittest -v network.tests.test_nih_p2_bgee_original_referent_all_predicate_inventory
      - name: Audit every RDF predicate touching authenticated Bgee referents in full OWL RL graph
        run: |
          set -euo pipefail
          ulimit -v 6291456
          set +e
          /usr/bin/time -v -o lane-c-e18-evidence/resource-statistics.txt \
            timeout --signal=TERM --kill-after=30s 12m \
            python -m systems.workspace.nih_p2_bgee_original_referent_all_predicate_inventory \
              --archive "$RUNNER_TEMP/nih-c-bgee/postgresql.zip" \
              --obda "$RUNNER_TEMP/nih-c-bgee/bgee_v14_genex.obda" \
              --owl "$RUNNER_TEMP/nih-c-bgee/bgee_v14_genex.owl" \
              --r2rml "$RUNNER_TEMP/nih-c-bgee/bgee_v14_genex.r2rml" \
              --ro-base "$RUNNER_TEMP/nih-c-ro/ro-base.owl" \
              --core "$RUNNER_TEMP/nih-c-ro/core.owl" \
              --output lane-c-e18-evidence/all-original-referent-predicate-differential.json
          code=$?
          set -e
          printf 'experiment_exit_code=%s\n124=timeout\n137=forced_termination_possible\n' "$code" > lane-c-e18-evidence/process-exit.txt
          if [ "$code" -ne 0 ]; then
            echo "NOT VERIFIED: preserve failure or difference in derived evidence"
            exit "$code"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("lane-c-e18-evidence/all-original-referent-predicate-differential.json").read_text())
          assert r["schema"]=="nih-p2-e18-complete-original-referent-predicate-differential-v1"
          assert r["status"] in ("E18_REFERENT_METADATA_OR_OTHER_RELATIONSHIP_ENTAILMENTS_PRESENT",
                                 "E18_ORIGINAL_REFERENTS_ONLY_SOURCE_AND_FOUR_RULE_RELATIONSHIPS")
          assert r["source_original_combined_graph_triples"]==34181
          assert r["full_owlrl_materialized_graph_triples"]<=1800000
          assert r["source_owner_whole_file_authenticated"] is True
          assert r["original_four_rule_source_relationship_triples"]==100108
          assert r["four_rule_source_relationships_missing"]==0
          assert r["source_scope_native_equals_independent_SPARQL"] is True
          assert r["whole_scope_native_sha256"]==r["whole_scope_SPARQL_sha256"]
          assert r["whole_profile_touching_original_referents"]>=r["source_original_graph_touching_referents"]
          assert r["remaining_entailments_beyond_source_plus_four_rules"]==(r["remaining_entailments_under_other_predicates"]+r["remaining_entailments_under_same_three_RO_predicates"])
          assert sum(r["beyond_original_and_four_rule_predicate_counts"].values())==r["remaining_entailments_beyond_source_plus_four_rules"]
          assert sum(r["beyond_original_and_four_rule_orientation_counts"].values())==r["remaining_entailments_beyond_source_plus_four_rules"]
          assert sum(r["other_predicate_classifications"].values())==r["remaining_entailments_under_other_predicates"]
          assert r["source_raw_data_redistributed"] is False
          assert r["additional_RDF_closure_statements_are_not_new_biomedical_observations"] is True
          assert r["independent_complete_OWL_RL_reasoner_confirmed"] is False
          assert r["official_NIH_benchmark"] is False
          assert r["original_W13_and_other_research_lanes_modified"] is False
          PY
      - name: Retain derived counts, disagreement hashes, resource and failure receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-p2-lane-c-e18-all-referent-predicate-inventory
          path: lane-c-e18-evidence/
          if-no-files-found: warn
          retention-days: 30
