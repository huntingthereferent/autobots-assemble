name: ARC3 original SP80 stage2 four-bar pairwise native movement
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage2_fourbar_pairwise.py'
      - '.github/workflows/arc3-sp80-stage2-fourbar-pairwise.yml'
jobs:
  original-native-fourbar-pairwise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Freeze original four-bar source pairwise design before native execution
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_stage2_fourbar_pairwise import (
            MAIN,EXTRA,PROGRAMS,VALUES,STAGE1_WITNESSES)
          from work.arc3.native_sp80_multi_select import parse_plan
          from itertools import product
          assert len(MAIN)==27 and len(EXTRA)==9 and len(PROGRAMS)==36
          assert len(set(MAIN+EXTRA))==36 and len(STAGE1_WITNESSES)==2
          for a in range(4):
              for b in range(a+1,4):
                  assert set((x[a],x[b]) for x in MAIN)==set(product(VALUES,repeat=2))
          for _,_,word in PROGRAMS:
              arr=parse_plan(word)
              assert sum(a==6 for a,xy in arr)==4
              assert arr[-1][0]==5
              assert all(a!=6 or xy is not None for a,xy in arr)
          print('UNIT ONLY: true original stage2 four-bar pairwise source interventions frozen')
          PY
      - name: Execute authentic original SP80 stage2 four-bar native interventions
        run: python -m work.arc3.native_sp80_stage2_fourbar_pairwise --out runtime/data/arc3/sp80-stage2-fourbar-pairwise.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage2-fourbar-pairwise
          path: runtime/data/arc3/sp80-stage2-fourbar-pairwise.*
          if-no-files-found: error
          retention-days: 14
