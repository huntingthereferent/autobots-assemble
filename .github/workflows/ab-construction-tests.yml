name: inverse-ab-construction

on:
  pull_request:
    paths:
      - "runtime/ab_construction.py"
      - "runtime/ab_relation_generator.py"
      - "runtime/ab_world_experiment.py"
      - "runtime/service.py"
      - "network/tests/test_ab_construction.py"
      - "network/tests/test_ab_generic_construction.py"
      - "network/tests/test_ab_native_subsystems.py"
      - "network/tests/test_ab_construction_comparison.py"
      - "network/tests/test_ab_exploratory_construction.py"
      - "network/tests/test_ab_world_experiment.py"
      - "runtime/AB_CONSTRUCTION_DIRECTION.md"
      - ".github/workflows/ab-construction-tests.yml"
  push:
    paths:
      - "runtime/ab_construction.py"
      - "runtime/ab_relation_generator.py"
      - "network/tests/test_ab_construction.py"
      - "network/tests/test_ab_generic_construction.py"
      - "network/tests/test_ab_native_subsystems.py"
      - "network/tests/test_ab_construction_comparison.py"
      - "network/tests/test_ab_exploratory_construction.py"
      - ".github/workflows/ab-construction-tests.yml"

jobs:
  inverse-construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify inverse category and nested world construction
        run: python -m unittest discover -s network/tests -p "test_ab_construction.py" -v
      - name: Verify generic construction across unrelated referents
        run: python -m unittest discover -s network/tests -p "test_ab_generic_construction.py" -v
      - name: Test generic construction against two native Continuity APIs
        run: python -m unittest discover -s network/tests -p "test_ab_native_subsystems.py" -v
      - name: Verify unclassified cross-category exploration and native API witness gate
        run: python -m unittest discover -s network/tests -p "test_ab_exploratory_construction.py" -v
      - name: Compare held-out real API task completion against evidence-only A/B
        run: python -m unittest discover -s network/tests -p "test_ab_construction_comparison.py" -v
      - name: Verify world simulation and category refinement
        run: python -m unittest discover -s network/tests -p "test_ab_world_experiment.py" -v
      - name: Verify original A/B math is unchanged
        run: python -m unittest discover -s network/tests -p "test_ab_information.py" -v
      - name: Verify existing recursive A/B traversal
        run: python -m unittest discover -s network/tests -p "test_ab_loop.py" -v
