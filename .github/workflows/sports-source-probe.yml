name: SPORTS source probe
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/sports/collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-source-probe
          path: research/sports/observations/
          retention-days: 14
