name: ARC A independent native holdout
on:
  pull_request:
    paths:
      - '.github/workflows/arc-a-heldout-factorial.yml'
  workflow_dispatch:
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - run: python -m work.arc3.native_sp80_action5_temporal_factorial --out runtime/data/arc3/arc-a-heldout-factorial.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-a-heldout-factorial
          path: runtime/data/arc3/arc-a-heldout-factorial.*
          if-no-files-found: warn
          retention-days: 14
