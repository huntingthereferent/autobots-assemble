name: workstation-game-build-stack
on:
  pull_request:
    paths:
      - 'systems/workspace/game_build_worker_source/**'
      - 'systems/workspace/game_build_native.py'
      - 'systems/workspace/game_build_bridge.py'
      - 'systems/workspace/game_build_stack.py'
      - 'systems/workspace/controls.py'
      - 'network/tests/test_game_build_in_workstation.py'
      - 'network/browser_game_build_stack.py'
      - 'network/tests/fixtures/game_build_world_*.json'
      - '.github/workflows/workstation-game-build-stack.yml'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/game_build_worker_source/**'
      - 'systems/workspace/game_build_native.py'
      - 'systems/workspace/game_build_bridge.py'
      - 'systems/workspace/game_build_stack.py'
      - 'systems/workspace/controls.py'
      - 'network/tests/test_game_build_in_workstation.py'
      - 'network/browser_game_build_stack.py'
      - 'network/tests/fixtures/game_build_world_*.json'
      - '.github/workflows/workstation-game-build-stack.yml'
permissions:
  contents: read
jobs:
  build-new-playable-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install native dependency and browser WITNESS
        run: |
          python -m pip install 'cryptography>=45,<47' 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Test preserved W12 and W13 plus NEW native game construction
        run: |
          python -m unittest -v \
            network.tests.test_game_construction \
            network.tests.test_game_w13_build_receipt \
            network.tests.test_game_build_in_workstation \
            network.tests.test_workstation_controls
      - name: Execute actual WORLD -> workstation BUILD -> native WITNESS
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game-build-output"
          python -m systems.workspace.game_build_stack \
            --world-file network/tests/fixtures/game_build_world_next.json \
            --data-dir "$RUNNER_TEMP/game-build-workstation" \
            --output-dir "$RUNNER_TEMP/game-build-output"
          test -s "$RUNNER_TEMP/game-build-output/built-world-room.html"
          tar -czf "$RUNNER_TEMP/game-build-output/workstation-runtime.tar.gz" \
            -C "$RUNNER_TEMP/game-build-workstation" runtime.jsonl workstation world-request.json
          sha256sum "$RUNNER_TEMP/game-build-output/workstation-runtime.tar.gz" \
            > "$RUNNER_TEMP/game-build-output/workstation-runtime.sha256"
      - name: Independent Chromium plays NEW rooms and failure cases
        run: python -m unittest -v network.browser_game_build_stack
      - name: Publish new playable game AND native job journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-built-in-workstation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/game-build-output/
          if-no-files-found: warn
          retention-days: 30
