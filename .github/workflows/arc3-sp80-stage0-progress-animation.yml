name: ARC3 SP80 real stage0 progress frames
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage0_progress_animation.py'
      - '.github/workflows/arc3-sp80-stage0-progress-animation.yml'
jobs:
  native-stage0-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - run: python -m work.arc3.native_sp80_stage0_progress_animation --out runtime/data/arc3/sp80-stage0-progress-animation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage0-animation
          path: runtime/data/arc3/sp80-stage0-progress-animation.*
          if-no-files-found: error
          retention-days: 14
