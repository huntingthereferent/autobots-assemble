name: ARC4 Level4 original SDK diagonal upper-right finite source relation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native-level4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic original Arcade SDK and NPZ source reader
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile frozen original native experiment, verifier, workstation
        run: |
          python -m compileall -q \
            work/arc3/native_sp80_stage4_diagonal_contact.py \
            work/arc3/arc4_diagonal_contact_gate.py \
            work/arc3/diagonal_contact_workstation.py
      - name: Check finite original source action matrix and official Level4 oracle
        run: python -m work.arc3.arc4_diagonal_contact_gate pre
      - name: Execute 24 true original SDK Level4 source trials through ProcessWorkstation
        run: |
          python -m work.arc3.diagonal_contact_workstation \
            --execute \
            --data-dir runtime/data/arc4/diagonal-contact/workstation \
            --out runtime/data/arc4/diagonal-contact/original-diagonal.json
      - name: Independently verify every true native SDK returned 64x64 frame and source/contact outcome
        run: |
          python -m work.arc3.arc4_diagonal_contact_gate post \
            --result runtime/data/arc4/diagonal-contact/original-diagonal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-sdk-diagonal-contact
          path: |
            runtime/data/arc4/diagonal-contact/original-diagonal.*
            runtime/data/arc4/diagonal-contact/workstation/**
          if-no-files-found: warn
          retention-days: 90
