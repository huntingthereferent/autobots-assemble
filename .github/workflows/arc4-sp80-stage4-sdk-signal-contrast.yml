name: ARC4 original SDK observation signal contrast
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_sdk_signal_contrast.py'
      - '.github/workflows/arc4-sp80-stage4-sdk-signal-contrast.yml'
jobs:
  original-sdk-public-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real public ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original native source control
        run: python -m compileall -q work/arc3/native_sp80_stage4_sdk_signal_contrast.py
      - name: Run six original SDK observation comparison games
        run: python -m work.arc3.native_sp80_stage4_sdk_signal_contrast --out runtime/data/arc4/original-sp80-sdk-signal-contrast.json
      - name: Save complete real SDK observation and full original frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-sdk-signal-contrast
          path: runtime/data/arc4/original-sp80-sdk-signal-contrast.*
          if-no-files-found: error
          retention-days: 14
