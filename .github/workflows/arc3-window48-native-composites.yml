name: ARC3 Window48 native two-control macro screen

on:
  push:
    paths:
      - "work/arc3/native_window48_composite_probe.py"
      - ".github/workflows/arc3-window48-native-composites.yml"
  pull_request:
    paths:
      - "work/arc3/native_window48_composite_probe.py"
      - ".github/workflows/arc3-window48-native-composites.yml"
  workflow_dispatch:

jobs:
  native-composite-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official native ARC SDK
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" numpy
      - name: Check original F3 A cubed using actual native two-control macros
        run: python -m work.arc3.native_window48_composite_probe --out runtime/data/arc3/window48-native-composites.json
      - name: Preserve native raw frames, admitted and rejected factors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-window48-native-composite-probes
          path: runtime/data/arc3/window48-native-composites.*
          if-no-files-found: ignore
          retention-days: 14
