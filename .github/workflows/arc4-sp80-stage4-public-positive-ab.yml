name: ARC4 original native public positive comparator
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_public_positive_ab.py'
      - '.github/workflows/arc4-sp80-stage4-public-positive-ab.yml'
jobs:
  actual-original-sp80:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original source
        run: python -m compileall -q work/arc3/native_sp80_stage4_public_positive_ab.py
      - name: Independently replay attributed fifth-level trace in actual SDK
        run: python -m work.arc3.native_sp80_stage4_public_positive_ab --out runtime/data/arc4/original-sp80-stage4-public-positive-ab.json
      - name: Retain true original SDK frame arrays and independent witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-stage4-public-positive-ab
          path: runtime/data/arc4/original-sp80-stage4-public-positive-ab.*
          if-no-files-found: error
          retention-days: 14
