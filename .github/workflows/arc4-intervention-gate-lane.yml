name: ARC4 lane B source-first intervention gate
on:
  pull_request:
    paths:
      - 'work/arc3/arc4_intervention_gate.py'
      - 'work/arc3/native_sp80_stage4_gated_intervention.py'
      - 'network/tests/test_arc4_intervention_gate.py'
      - '.github/workflows/arc4-intervention-gate-lane.yml'
  workflow_dispatch:
    inputs:
      approved_plan_path:
        description: 'Committed, audited source-pinned plan path (required; otherwise fail closed)'
        required: true
        type: string
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract tests
        run: python -m unittest network.tests.test_arc4_intervention_gate -v
      - name: Compile native runner
        run: python -m compileall -q work/arc3/native_sp80_stage4_gated_intervention.py
  original-native-if-approved:
    if: github.event_name == 'workflow_dispatch'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Execute only source-pinned admitted plan
        env:
          PLAN_PATH: ${{ inputs.approved_plan_path }}
        run: |
          test -f "$PLAN_PATH"
          case "$PLAN_PATH" in
            work/arc3/lanes/approved-*.json) ;;
            *) echo 'Refusing non-canonical plan path'; exit 1 ;;
          esac
          python -m work.arc3.native_sp80_stage4_gated_intervention --plan "$PLAN_PATH" --out runtime/data/arc4/arc4-gated-intervention.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-gated-native-intervention
          path: runtime/data/arc4/arc4-gated-intervention.*
          retention-days: 90
          if-no-files-found: error
