name: Complete Stack temporal NIH and game construction
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_temporal_game_stack.py'
      - 'systems/workspace/nih_packet_*.py'
      - 'systems/workspace/nih_prototype_*.py'
      - 'systems/workspace/nih_prototype_worker_source/**'
      - 'network/tests/fixtures/nih_prototype_example.json'
      - 'systems/workspace/nih_packet_worker_source/**'
      - 'systems/workspace/controls.py'
      - 'network/tests/fixtures/nih_packet_example.json'
      - 'network/tests/test_nih_temporal_game_stack.py'
      - '.github/workflows/complete-stack-temporal-game.yml'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/nih_temporal_game_stack.py'
      - 'systems/workspace/nih_packet_*.py'
      - 'systems/workspace/nih_prototype_*.py'
      - 'systems/workspace/nih_prototype_worker_source/**'
      - 'network/tests/fixtures/nih_prototype_example.json'
      - 'systems/workspace/nih_packet_worker_source/**'
      - 'systems/workspace/controls.py'
      - 'network/tests/fixtures/nih_packet_example.json'
      - 'network/tests/test_nih_temporal_game_stack.py'
      - '.github/workflows/complete-stack-temporal-game.yml'
permissions:
  contents: read
jobs:
  witness-complete-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Original native verifier dependencies and real browser
        run: |
          python -m pip install 'cryptography>=45,<47' 'rdflib>=7,<8' 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Test native temporal/game stack and original CP boundaries
        run: |
          python -m unittest -v \
            network.tests.test_nih_temporal_game_stack \
            network.tests.test_cp_motion \
            network.tests.test_nih_scope_worker \
            network.tests.test_nih_ontology_worker \
            network.tests.test_nih_reasoning_worker \
            network.tests.test_game_build_in_workstation
      - name: Run actual NIH Phase 1 temporal bounded workers with native playable GAME BUILD
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/complete-stack-artifacts"
          python -m systems.workspace.nih_temporal_game_stack \
            --data-dir "$RUNNER_TEMP/complete-stack-workstation" \
            --output-dir "$RUNNER_TEMP/complete-stack-artifacts" \
            --browser-witness \
            --build-packet \
            --build-prototype
          python - <<'PY'
          import json, os
          from pathlib import Path
          source=Path(os.environ["RUNNER_TEMP"])/"complete-stack-artifacts"
          result=json.loads((source/"complete-stack-temporal-game.json").read_text())
          assert result["game_browser_witness"]=="PASS"
          assert result["phase_2_test"]=="BLOCKED"
          assert result["one_native_workstation"] and result["synthetic_only"]
          assert len(result["witnessed_nih_phase_1"])==5
          assert result["phase_2_prototype"]=="WITNESSED"
          assert result["prototype_native_witness"]=="PASS"
          assert result["prototype_hidden_queries"]>=1
          assert result["prototype_static_leakage_examples"]>=1
          assert result["phase_2_game_test"]=="BLOCKED"
          assert "NIH-P2-PROTOTYPE" not in result["phase_2_test_blocked_by"]
          assert (source/"temporal_query.py").is_file()
          assert (source/"temporal_dataset.json").is_file()
          assert result["packet_native_witness"]=="PASS"
          assert result["next_prototype"]=="NIH-P2-PROTOTYPE"
          assert result["official_submission"] is False
          draft=(source/"nih-phase1-temporal-design-packet.md").read_text()
          assert "## Temporal benchmark cases" in draft
          assert "Not an NIH submission" in draft
          PY
          tar -czf "$RUNNER_TEMP/complete-stack-artifacts/shared-native-workstation.tar.gz" \
            -C "$RUNNER_TEMP/complete-stack-workstation" \
            runtime.jsonl coordinator-windows.jsonl workstation world-request.json
          sha256sum "$RUNNER_TEMP/complete-stack-artifacts/shared-native-workstation.tar.gz" \
            > "$RUNNER_TEMP/complete-stack-artifacts/shared-native-workstation.sha256"
      - name: Publish runnable Phase 2 temporal prototype, Phase 1 evidence, game and shared journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-game-complete-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/complete-stack-artifacts/
          if-no-files-found: warn
          retention-days: 30
