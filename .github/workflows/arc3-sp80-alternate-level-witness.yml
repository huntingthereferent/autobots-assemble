name: ARC3 SP80 independent alternate native level witness

on:
  push:
    paths:
      - "work/arc3/native_sp80_alternate_level_witness.py"
      - ".github/workflows/arc3-sp80-alternate-level-witness.yml"
  pull_request:
    paths:
      - "work/arc3/native_sp80_alternate_level_witness.py"
      - ".github/workflows/arc3-sp80-alternate-level-witness.yml"
  workflow_dispatch:

jobs:
  native-level-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official public native ARC SDK
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" numpy
      - name: Compare alternate SP80 native level progression and prefix controls
        run: python -m work.arc3.native_sp80_alternate_level_witness --out runtime/data/arc3/sp80-alternate-level-witness.json
      - name: Preserve actual native frame stacks and native level-counter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-sp80-alternate-native-level-witness
          path: runtime/data/arc3/sp80-alternate-level-witness.*
          if-no-files-found: ignore
          retention-days: 14
