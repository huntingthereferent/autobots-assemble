name: NIH Phase 1 output comparison - bounded execution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'systems/workspace/nih_phase1_output_compare.py'
      - 'research/nih_audit/PHASE1_OUTPUT_LANE.md'
      - 'network/tests/test_nih_phase1_output_compare.py'
      - '.github/workflows/nih-phase1-output-comparison.yml'
  pull_request:
    paths:
      - 'systems/workspace/nih_phase1_output_compare.py'
      - 'network/tests/test_nih_phase1_output_compare.py'
      - '.github/workflows/nih-phase1-output-comparison.yml'
permissions:
  contents: read
jobs:
  compare-original-world-outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test finite comparator before executing expensive native work
        run: python -m unittest -v network.tests.test_nih_phase1_output_compare
      - name: Install original native W13 and Chromium dependencies
        run: |
          python -m pip install 'cryptography>=45,<47' 'rdflib>=7,<8' 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Execute four bounded original-world output experiments
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/nih-compare"
          printf '%s\\n' "$GITHUB_SHA" > "$RUNNER_TEMP/nih-compare/source-sha.txt"
          printf '%s\\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/nih-compare/run-id.txt"
          for candidate in frontier two_clock source_motion publication_uncertainty; do
            mkdir -p "$RUNNER_TEMP/nih-compare/$candidate"
            python -m systems.workspace.nih_phase1_world_${candidate} \
              --data-dir "$RUNNER_TEMP/nih-compare/native-$candidate" \
              --output-dir "$RUNNER_TEMP/nih-compare/$candidate" \
              > "$RUNNER_TEMP/nih-compare/$candidate/execution.log" 2>&1
            code=$?
            printf '%s\n' "$code" > "$RUNNER_TEMP/nih-compare/$candidate/exit-code.txt"
            echo "$candidate exit=$code"
            if [[ "$code" != "0" ]]; then
              tail -n 35 "$RUNNER_TEMP/nih-compare/$candidate/execution.log" || true
            fi
          done
      - name: Compare actual receipt claims without inventing a winner
        if: always()
        run: |
          python -m systems.workspace.nih_phase1_output_compare \
            --receipts "$RUNNER_TEMP/nih-compare" \
            --output "$RUNNER_TEMP/nih-compare/comparison.json"
      - name: Preserve source outputs, failed logs and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-phase1-output-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nih-compare
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce observed execution failures after preserving evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for candidate in frontier two_clock source_motion publication_uncertainty; do
            receipt="$RUNNER_TEMP/nih-compare/$candidate/exit-code.txt"
            if [[ ! -f "$receipt" ]] || [[ "$(cat "$receipt")" != "0" ]]; then
              echo "::error::$candidate did not finish successfully"
              exit 1
            fi
          done
          echo "All four native candidate executions exited successfully; source comparison remains separate."
