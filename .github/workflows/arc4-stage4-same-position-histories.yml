name: ARC4 lane B same-position genuine native histories
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_same_position_histories.py'
      - '.github/workflows/arc4-stage4-same-position-histories.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-native-histories:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual original SP80 SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile exact source
        run: python -m compileall -q work/arc3/native_sp80_stage4_same_position_histories.py
      - name: Execute five frozen histories with two native entrance witnesses
        run: python -m work.arc3.native_sp80_stage4_same_position_histories --out runtime/data/arc4/arc4-same-position-source-histories.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-same-position-native-histories
          path: runtime/data/arc4/arc4-same-position-source-histories.*
          if-no-files-found: error
          retention-days: 90
