name: ARC3 SP80 independent extended history
on:
  pull_request:
    paths:
      - "work/arc3/native_sp80_extended_history.py"
      - "work/arc3/native_sp80_boundary_timing.py"
      - ".github/workflows/arc3-sp80-extended-history.yml"
  push:
    paths:
      - "work/arc3/native_sp80_extended_history.py"
      - "work/arc3/native_sp80_boundary_timing.py"
      - ".github/workflows/arc3-sp80-extended-history.yml"
jobs:
  native-extended-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "arc-agi>=0.9.6,<1" numpy
      - name: Verify frozen predeclared candidate boundaries
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_extended_history import WORDS, boundary_condition
          from work.arc3.native_sp80_spatial_condition import spatial_condition
          assert len(WORDS) == 4 and all(len(w) == 11 for w in WORDS)
          source = {(11, 63): (14, 0), (45, 20): (9, 12)}
          assert boundary_condition(source, 8) == {}
          assert boundary_condition(source, 9) == {(11, 63): (14, 0)}
          assert boundary_condition(source, 10) == spatial_condition(source, 10)
          PY
      - name: Execute fresh real native SP80 11-step histories
        run: python -m work.arc3.native_sp80_extended_history --out runtime/data/arc3/sp80-extended-history.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-extended-history
          path: runtime/data/arc3/sp80-extended-history.*
          if-no-files-found: error
          retention-days: 14
