name: workstation-construction-b9
on:
  push:
    paths:
      - 'systems/workspace/workstation_construction.py'
      - 'network/tests/test_workstation_construction.py'
      - 'network/tests/test_workstation_construction_frontier.py'
      - 'network/tests/test_workstation_construction_scale.py'
      - 'network/tests/test_workstation_construction_route_scope.py'
      - 'examples/route_scope_demo.py'
      - 'systems/workspace/WORKSTATION_CONSTRUCTION_B9.md'
      - '.github/workflows/workstation-construction-b9.yml'
  pull_request:
    paths:
      - 'systems/workspace/workstation_construction.py'
      - 'network/tests/test_workstation_construction.py'
      - 'network/tests/test_workstation_construction_frontier.py'
      - 'network/tests/test_workstation_construction_scale.py'
      - 'network/tests/test_workstation_construction_route_scope.py'
      - 'examples/route_scope_demo.py'
      - '.github/workflows/workstation-construction-b9.yml'
  workflow_dispatch:

jobs:
  candidate-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify B9 candidate construction and source boundaries
        run: |
          python - <<'PY'
          import importlib, unittest
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for name in ('network.tests.test_workstation_construction',
                       'network.tests.test_workstation_construction_frontier',
                       'network.tests.test_workstation_construction_scale',
                       'network.tests.test_workstation_construction_route_scope'):
              suite.addTests(loader.loadTestsFromModule(importlib.import_module(name)))
          count = suite.countTestCases()
          if count != 73:
              raise SystemExit(f'expected 73 B9 tests; found {count}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or len(result.skipped) != 0:
              raise SystemExit('B9 candidate tests failed or skipped')
          PY
      - name: Preserve existing B2/B7 regression behavior
        run: |
          python -m unittest -v \
            network.tests.test_workstation_harness \
            network.tests.test_workstation_cycle_bounds
      - name: Keep canonical observational reference independent
        run: |
          cd runtime/examples/continuous_handoff
          python -m unittest -v test_reference.py
      - name: Demonstrate independent candidate route histories
        run: |
          python - <<'PY'
          from examples.route_scope_demo import demonstrate
          result = demonstrate()
          assert result['number_of_candidate_routes'] == 2
          assert {r['route_state'] for r in result['routes']} == {
              'HISTORICAL_CONTRADICTION_PRESENT', 'HISTORICALLY_UNDETERMINED'}
          assert not result['native_worker_executed']
          assert all(not r['whole_route_verified'] and not r['execution_authorized']
                     for r in result['routes'])
          PY
