name: WORLD 24 finite endpoint rotating-square edge test

on:
  push:
    paths:
      - 'systems/workspace/world_ab_rotating_edge_face_endpoint.py'
      - 'network/tests/test_world_ab_rotating_edge_face_endpoint.py'
      - 'systems/workspace/WORLD_AB_ENDPOINT_EDGE_TRIAL_24_2026-10-20.md'
      - '.github/workflows/world-ab-endpoint-edge.yml'
  pull_request:
    paths:
      - 'systems/workspace/world_ab_rotating_edge_face_endpoint.py'
      - 'network/tests/test_world_ab_rotating_edge_face_endpoint.py'
      - 'systems/workspace/WORLD_AB_ENDPOINT_EDGE_TRIAL_24_2026-10-20.md'
      - '.github/workflows/world-ab-endpoint-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-endpoint-to-rotating-square-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source 04 18 20 21 22 and new independent endpoint-edge test
        run: |
          python -m unittest -v network.tests.test_world_ab_oblique_impact network.tests.test_world_ab_local_recontact_impulse network.tests.test_world_ab_rotating_receiver network.tests.test_world_ab_third_contact network.tests.test_world_ab_first_post_third_candidate network.tests.test_world_ab_rotating_edge_face_endpoint
      - name: Retain original conditional endpoint-edge results and independent witness
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          from systems.workspace.world_ab_rotating_edge_face_endpoint import run
          from network.tests.test_world_ab_rotating_edge_face_endpoint import verify
          source=run()
          witness=[{"angle":case["angle"],"status":case["status"],
                    "independently_verified":verify(case)} for case in source["cases"]]
          assert len(witness)==8 and all(w["independently_verified"] for w in witness)
          assert source["conditional_source_inputs"]==6
          assert source["without_source_impulse"]==2
          assert source["source_edge_pairs_checked"]==96
          assert source["physical_measurements"]==0 and source["fourth_impulses_selected"]==0
          folder=Path("world24-native-evidence")
          folder.mkdir(exist_ok=True)
          result=json.dumps({"source":source,"independent_witness":witness},
                            indent=2,sort_keys=True,allow_nan=False)+"\n"
          (folder/"endpoint_edge_candidates.json").write_text(result)
          (folder/"endpoint_edge_candidates.sha256").write_text(
              sha256(result.encode()).hexdigest()+"  endpoint_edge_candidates.json\n")
          print(json.dumps({
              "edge_endpoint_pairs":source["source_edge_pairs_checked"],
              "eligible_endpoint_edge_cases":source["cases_with_eligible_endpoint_edge"],
              "eligible_before_vertex_case_count":source["edge_candidates_preceding_vertex_line"],
              "no_endpoint_edge_windows":source["cases_without_eligible_endpoint_edge"],
              "source_root_count":source["numerical_endpoint_edge_roots"],
              "edge_extension_only_roots":source["extension_only_roots"],
              "square_vertex_endpoint_uncertainties":source["vertex_endpoint_uncertainties"],
              "real_fourth_impulses":0},sort_keys=True))
          PY
      - name: Retain original finite geometric witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world24-finite-endpoint-edge-conditional-candidates
          path: world24-native-evidence/
          if-no-files-found: warn
          retention-days: 30
