name: ARC3 original SP80 matched-age selected-bar geometry
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_matched_geometry.py'
      - '.github/workflows/arc3-sp80-matched-geometry.yml'
jobs:
  genuine-native-matched-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real native ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Check predeclared original click and action-age controls
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_matched_geometry import TARGETS,SUFFIXES,PLANS,RESETS
          from work.arc3.native_sp80_multi_select import parse_plan
          assert len(TARGETS)==3 and len(SUFFIXES)==8
          assert len(PLANS)==24 and RESETS==2
          for _,word in PLANS:
            actions=parse_plan(word)
            assert actions[0][0]==6 and actions[0][1] is not None
            assert actions[-1][0]==5
            assert all(a!=6 or xy is not None for a,xy in actions)
          print('UNIT ONLY: original SDK selected-bar geometry controls frozen')
          PY
      - name: Run genuine native SP80 matched-age source geometry experiments
        run: python -m work.arc3.native_sp80_matched_geometry --out runtime/data/arc3/sp80-matched-geometry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-matched-geometry
          path: runtime/data/arc3/sp80-matched-geometry.*
          if-no-files-found: error
          retention-days: 14
