name: ARC3 original-native dual color8 contact and level2
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_dual_contact.py'
      - '.github/workflows/arc3-sp80-dual-contact.yml'
jobs:
  genuine-native-dual-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official original ARC game SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Freeze dual-contact original game trials (unit only)
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_dual_contact import WORDS,RESETS,L_TO_U,U_TO_L
          assert len(WORDS)==len(set(WORDS))==18 and RESETS==2
          assert '1115'+L_TO_U+'5' in WORDS
          assert '1115'+L_TO_U+'6' in WORDS
          assert '1115'+U_TO_L+'5' in WORDS
          assert '1115'+U_TO_L+'6' in WORDS
          assert all(set(w)<={'1','3','4','5','6'} for w in WORDS)
          print('UNIT ONLY: all original dual-contact words fixed')
          PY
      - name: Run genuine native SP80 level1 dual-contact controls
        run: python -m work.arc3.native_sp80_dual_contact --out runtime/data/arc3/sp80-dual-contact.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-dual-contact
          path: runtime/data/arc3/sp80-dual-contact.*
          if-no-files-found: error
          retention-days: 14
