name: WORLD 35 whole original contact configuration

on:
  push:
    paths:
      - 'systems/workspace/world_ab_whole_contact_configuration.py'
      - 'network/tests/test_world_ab_whole_contact_configuration.py'
      - 'systems/workspace/WORLD_AB_WHOLE_CONTACT_CONFIGURATION_TRIAL_35_2026-10-20.md'
      - '.github/workflows/world-ab-whole-contact-configuration.yml'
  pull_request:
    paths:
      - 'systems/workspace/world_ab_whole_contact_configuration.py'
      - 'network/tests/test_world_ab_whole_contact_configuration.py'
      - 'systems/workspace/WORLD_AB_WHOLE_CONTACT_CONFIGURATION_TRIAL_35_2026-10-20.md'
      - '.github/workflows/world-ab-whole-contact-configuration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-original-whole-contact-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original WORLD regressions and independent contact configuration verifier
        run: |
          python -m unittest -v network.tests.test_world_ab_oblique_impact network.tests.test_world_ab_local_recontact_impulse network.tests.test_world_ab_rotating_receiver network.tests.test_world_ab_third_contact network.tests.test_world_ab_first_post_third_candidate network.tests.test_world_ab_all_inward_finite_features network.tests.test_world_ab_rotating_edge_face_endpoint network.tests.test_world_ab_finite_segment_square_overlap network.tests.test_world_ab_between_sample_clearance network.tests.test_world_ab_local_finite_onset network.tests.test_world_ab_first_finite_response_qualification network.tests.test_world_ab_post_fourth_local_clearance network.tests.test_world_ab_first_envelope_limit network.tests.test_world_ab_geometry_at_first_envelope_limit network.tests.test_world_ab_local_plane_prefix network.tests.test_world_ab_first_unknown_finite_feature network.tests.test_world_ab_whole_contact_configuration
      - name: Preserve original numerical report, independent witness and hashes
        run: |
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          from systems.workspace.world_ab_whole_contact_configuration import run
          from network.tests.test_world_ab_whole_contact_configuration import reconstruct
          data=run()
          checks=[{"angle":x["angle"],"status":x["status"],
                   "independent_world_coordinate_original_configuration":reconstruct(x)}
                  for x in data["cases"]]
          assert len(checks)==8 and all(x["independent_world_coordinate_original_configuration"] for x in checks)
          assert data["original_local_candidate_cases"]==1
          assert data["inactive_source_controls"]==7
          assert (data["conditionally_qualified_fifth_responses"]+
                  data["original_configuration_unresolved_cases"])==1
          assert data["actual_fifth_contacts_measured"]==0
          assert data["physical_fifth_responses_selected"]==0
          folder=Path("world35-native-evidence")
          folder.mkdir(exist_ok=True)
          data_text=json.dumps({"original_source":data,"independent_replay":checks},
                               sort_keys=True,indent=2,allow_nan=False)+"\n"
          (folder/"original_whole_contact_configuration.json").write_text(data_text)
          (folder/"original_whole_contact_configuration.sha256").write_text(
              sha256(data_text.encode()).hexdigest()+"  original_whole_contact_configuration.json\n")
          print(json.dumps({
              "source_local_contact_feature_cases":data["original_local_candidate_cases"],
              "mathematically_qualified_fifth_responses":data["conditionally_qualified_fifth_responses"],
              "unresolved_source_configurations":data["original_configuration_unresolved_cases"],
              "inactive_cases":data["inactive_source_controls"],
              "physical_fifth_impulses":0},sort_keys=True))
          for row in data["cases"]:
              if row["candidate_virtual_time"] is not None:
                  print(json.dumps({
                      "source_angle":row["angle"],
                      "source_time_after_hypothetical_fourth":row["candidate_virtual_time"],
                      "status":row["status"],
                      "all_original_competitors_clear":row["all_competing_original_constraints_clear"],
                      "selected_source_corner_inward":row["source_feature_geometry_consistent"],
                      "conditional_model_impulse":(
                          row["conditional_fifth_response"]["normal_impulse"]
                          if row["conditional_fifth_response"] is not None else None),
                      "real_fifth_response":None},sort_keys=True))
          PY
      - name: Retain original WORLD35 source and independent witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world35-original-whole-contact-configuration
          path: world35-native-evidence/
          if-no-files-found: warn
          retention-days: 30
