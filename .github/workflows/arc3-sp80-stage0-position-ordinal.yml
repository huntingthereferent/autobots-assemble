name: ARC3 original SP80 stage0 bar-position versus ACTION4 ordinal
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage0_position_ordinal.py'
      - '.github/workflows/arc3-sp80-stage0-position-ordinal.yml'
jobs:
  real-native-stage0-position-ordinal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - run: python -m work.arc3.native_sp80_stage0_position_ordinal --out runtime/data/arc3/sp80-stage0-position-ordinal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage0-position-ordinal
          path: runtime/data/arc3/sp80-stage0-position-ordinal.*
          if-no-files-found: error
          retention-days: 14
