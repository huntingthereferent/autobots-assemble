name: ARC3 genuine SP80 heldout late-contact upper source
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_late_contact_heldout.py'
      - '.github/workflows/arc3-sp80-stage3-late-contact-heldout.yml'
jobs:
  genuine-source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Check native experiment syntax
        run: python -m compileall -q work/arc3/native_sp80_stage3_late_contact_heldout.py
      - name: Run 28 genuinely reset original SP80 late-contact games
        run: python -m work.arc3.native_sp80_stage3_late_contact_heldout --out runtime/data/arc3/original-sp80-stage3-late-contact-heldout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-late-contact-heldout
          path: runtime/data/arc3/original-sp80-stage3-late-contact-heldout.*
          if-no-files-found: error
          retention-days: 14
