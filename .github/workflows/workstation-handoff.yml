name: Workstation handoff snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - "systems/workspace/**"
      - "views/traces/**"
      - ".github/workflows/workstation-handoff.yml"
  push:
    branches: [main]
    paths:
      - "systems/workspace/**"
      - "views/traces/**"
      - ".github/workflows/workstation-handoff.yml"

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: workstation-handoff-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source-aware handoff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"

          def api(path):
              req = urllib.request.Request(
                  base + path,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.load(r)

          pulls = api("/pulls?state=open&per_page=100")
          lanes = []
          for pr in pulls:
              title = pr.get("title", "")
              branch = pr.get("head", {}).get("ref", "")
              if "arc" not in (title + " " + branch).lower() and "workstation" not in (title + " " + branch).lower():
                  continue
              sha = pr.get("head", {}).get("sha")
              runs = []
              if sha:
                  try:
                      data = api(f"/actions/runs?head_sha={sha}&per_page=10")
                      runs = [{
                          "name": x.get("name"), "run_id": x.get("id"),
                          "status": x.get("status"), "conclusion": x.get("conclusion"),
                          "html_url": x.get("html_url"), "created_at": x.get("created_at"),
                          "updated_at": x.get("updated_at")
                      } for x in data.get("workflow_runs", [])]
                  except Exception as e:
                      runs = [{"observation_error": type(e).__name__}]
              lanes.append({
                  "pr": pr.get("number"), "title": title, "url": pr.get("html_url"),
                  "state": pr.get("state"), "draft": pr.get("draft"),
                  "branch": branch, "head_sha": sha,
                  "updated_at": pr.get("updated_at"), "workflow_runs": runs
              })

          result = {
              "schema": "workstation-chatgpt-handoff/v1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "source_scope": "GitHub-visible repository and Actions metadata only",
              "runtime_state": {
                  "status": "NOT_OBSERVED",
                  "reason": "Private runtime/data journals are not available to this GitHub-hosted workflow."
              },
              "trigger": {"event": os.environ["GH_EVENT_NAME"], "sha": os.environ["GH_SHA"],
                          "run_id": os.environ["GH_RUN_ID"], "attempt": os.environ["GH_RUN_ATTEMPT"]},
              "open_research_lanes": sorted(lanes, key=lambda x: x["pr"]),
              "resume_rules": [
                  "Use the native source and latest workflow artifact as evidence, not PR title alone.",
                  "A successful workflow does not establish private coordinator state.",
                  "NOT_OBSERVED is not the same as empty, blocked, or failed.",
                  "No job admission or worker execution is performed by this snapshot."
              ]
          }
          Path("handoff-out").mkdir(exist_ok=True)
          Path("handoff-out/workstation-handoff.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"schema": result["schema"], "runtime_state": result["runtime_state"],
                            "open_research_lanes": len(lanes), "output": "handoff-out/workstation-handoff.json"}, indent=2))
          PY

      - name: Upload handoff snapshot
        uses: actions/upload-artifact@v4
        with:
          name: workstation-handoff-${{ github.run_id }}
          path: handoff-out/workstation-handoff.json
          if-no-files-found: error
          retention-days: 14
