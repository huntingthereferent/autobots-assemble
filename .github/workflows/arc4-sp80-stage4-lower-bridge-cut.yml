name: ARC4 original lower source bridge cut
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_lower_bridge_cut.py'
      - '.github/workflows/arc4-sp80-stage4-lower-bridge-cut.yml'
jobs:
  true-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile source experiment
        run: python -m compileall -q work/arc3/native_sp80_stage4_lower_bridge_cut.py
      - name: Run 16 original SP80 lower-bridge interventions
        run: python -m work.arc3.native_sp80_stage4_lower_bridge_cut --out runtime/data/arc4/original-sp80-lower-bridge-cut.json
      - name: Save actual original SDK native arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-lower-bridge-cut
          path: runtime/data/arc4/original-sp80-lower-bridge-cut.*
          if-no-files-found: error
          retention-days: 14
