name: REA A/B construct a novel observation from source
on:
  push:
    branches: ['experiment/swallow-rea-ab-20261017']
    paths: ['experiments/rea-swallow/**', '.github/workflows/rea-swallow-construct.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  construct-and-independently-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact pinned actual REA
        working-directory: experiments/rea-swallow/upstream
        run: |
          test "$(git rev-parse HEAD)" = "f0b9ef34c404c1c65f8167502db972b0bd708403"
          npm ci --no-audit --no-fund
      - name: Replay genuine verified source movement 8 and branch source
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/observation_source_experiment.py prepare --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/observation_source_experiment.py apply --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/construct_source_experiment.py prepare --rea experiments/rea-swallow/upstream
          cp experiments/rea-swallow/observation_refinement_contract.test.ts experiments/rea-swallow/upstream/src/domain/javascript/javascriptObservationRefinement.ab-swallow.test.ts
      - name: Verify original movement 8 baseline
        working-directory: experiments/rea-swallow/upstream
        run: |
          set -o pipefail
          npx --no-install vitest run src/domain/javascript/javascriptObservationRefinement.ab-swallow.test.ts src/domain/javascript/javascriptApplicationVersionMatching.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/experiments/rea-swallow/results/construct-control.log"
      - name: Apply source construction inside actual REA
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/construct_source_experiment.py apply --rea experiments/rea-swallow/upstream
          cp experiments/rea-swallow/construct_contract.test.ts experiments/rea-swallow/upstream/src/domain/javascript/javascriptConstructObservation.ab-swallow.test.ts
          git -C experiments/rea-swallow/upstream diff > experiments/rea-swallow/results/construct-source.patch
      - name: Independently execute newly generated observations and verify REA separation
        working-directory: experiments/rea-swallow/upstream
        run: |
          set -o pipefail
          REA_AB_CONSTRUCTION_OUTPUT="$GITHUB_WORKSPACE/experiments/rea-swallow/results/construct-witness.json" npx --no-install vitest run src/domain/javascript/javascriptConstructObservation.ab-swallow.test.ts src/domain/javascript/javascriptObservationRefinement.ab-swallow.test.ts src/domain/javascript/javascriptApplicationVersionMatching.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/experiments/rea-swallow/results/construct-experimental.log"
      - name: Typecheck all real REA source
        working-directory: experiments/rea-swallow/upstream
        run: npx --no-install tsc --noEmit -p tsconfig.json
      - name: Preserve the real source change and outcome records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-constructed-observation-evidence
          path: experiments/rea-swallow/results/construct-*
          retention-days: 14
          if-no-files-found: warn
