name: REA A/B integrated investigation continuation
on:
  push:
    branches: ['experiment/swallow-rea-ab-20261017']
    paths:
      - 'experiments/rea-swallow/**'
      - '.github/workflows/rea-swallow-advance.yml'
  pull_request:
    paths:
      - 'experiments/rea-swallow/**'
      - '.github/workflows/rea-swallow-advance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-source-investigation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual pinned upstream REA
        working-directory: experiments/rea-swallow/upstream
        run: |
          test "$(git rev-parse HEAD)" = "f0b9ef34c404c1c65f8167502db972b0bd708403"
          npm ci --no-audit --no-fund
      - name: Restore three separately verified REAL REA source operations
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/observation_source_experiment.py prepare --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/observation_source_experiment.py apply --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/choice_source_experiment.py prepare --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/choice_source_experiment.py apply --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/construct_source_experiment.py prepare --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/construct_source_experiment.py apply --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/advance_source_experiment.py prepare --rea experiments/rea-swallow/upstream
          cp experiments/rea-swallow/observation_refinement_contract.test.ts experiments/rea-swallow/upstream/src/domain/javascript/javascriptObservationRefinement.ab-swallow.test.ts
          cp experiments/rea-swallow/choice_contract.test.ts experiments/rea-swallow/upstream/src/domain/javascript/javascriptObservationChoice.ab-swallow.test.ts
          cp experiments/rea-swallow/construct_contract.test.ts experiments/rea-swallow/upstream/src/domain/javascript/javascriptConstructObservation.ab-swallow.test.ts
      - name: Verify actual parent implementation before continuation integration
        working-directory: experiments/rea-swallow/upstream
        run: |
          set -o pipefail
          npx --no-install vitest run src/domain/javascript/javascriptObservationRefinement.ab-swallow.test.ts src/domain/javascript/javascriptObservationChoice.ab-swallow.test.ts src/domain/javascript/javascriptConstructObservation.ab-swallow.test.ts src/domain/javascript/javascriptApplicationVersionMatching.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/experiments/rea-swallow/results/advance-control.log"
      - name: Branch and install the experimental REA continuation source
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/advance_source_experiment.py apply --rea experiments/rea-swallow/upstream
          cp experiments/rea-swallow/advance_contract.test.ts experiments/rea-swallow/upstream/src/domain/javascript/javascriptInvestigationAdvance.ab-swallow.test.ts
          git -C experiments/rea-swallow/upstream diff > experiments/rea-swallow/results/advance-source.patch
      - name: Replay 256 unresolved matches through propose capture verify repeat
        working-directory: experiments/rea-swallow/upstream
        run: |
          set -o pipefail
          REA_AB_ADVANCE_OUTPUT="$GITHUB_WORKSPACE/experiments/rea-swallow/results/advance-movement-witness.json" npx --no-install vitest run src/domain/javascript/javascriptInvestigationAdvance.ab-swallow.test.ts src/domain/javascript/javascriptObservationRefinement.ab-swallow.test.ts src/domain/javascript/javascriptObservationChoice.ab-swallow.test.ts src/domain/javascript/javascriptConstructObservation.ab-swallow.test.ts src/domain/javascript/javascriptApplicationVersionMatching.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/experiments/rea-swallow/results/advance-experiment.log"
      - name: Full actual REA TypeScript check
        working-directory: experiments/rea-swallow/upstream
        run: npx --no-install tsc --noEmit -p tsconfig.json
      - name: Keep actual patch and all source/evidence receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-investigation-transition-evidence
          path: experiments/rea-swallow/results/advance-*
          if-no-files-found: warn
          retention-days: 14
