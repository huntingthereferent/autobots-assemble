name: Inspector Gadget

on:
  workflow_run:
    workflows:
      - protocol-tests
      - pages build and deployment
      - Publish source-bound research for the live trace surface
      - ARC3 direct observation lane
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  inspector-gadget:
    if: ${{ github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture source-owned cancellation observation
        env:
          EVENT_JSON: ${{ github.event_path }}
        run: |
          python systems/workspace/audit_cancelled_run.py "$EVENT_JSON" audit-cancellation.json
          python -m unittest discover -s network/tests -p 'test_audit_cancelled_run.py' -v
      - name: Activate native source-observation adapter
        env:
          EVENT_JSON: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m systems.workspace.inspector_gadget_adapter event "$EVENT_JSON" inspector-gadget-handoff.json
          python -m unittest discover -s network/tests -p 'test_inspector_gadget_adapter.py' -v
      - name: Retain immutable incident and movement receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-cancelled-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            audit-cancellation.json
            inspector-gadget-handoff.json
            inspector-gadget-runtime.jsonl
          retention-days: 90
