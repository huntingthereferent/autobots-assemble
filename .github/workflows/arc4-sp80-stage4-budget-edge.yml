name: ARC4 native fixed-geometry final budget
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_budget_edge.py'
      - '.github/workflows/arc4-sp80-stage4-budget-edge.yml'
jobs:
  original-sdk-final-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile genuine SDK source
        run: python -m compileall -q work/arc3/native_sp80_stage4_budget_edge.py
      - name: Execute true original fixed-geometry boundary POUR
        run: python -m work.arc3.native_sp80_stage4_budget_edge --out runtime/data/arc4/original-sp80-stage4-budget-edge.json
      - name: Save genuine SDK source arrays and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-stage4-budget-edge
          path: runtime/data/arc4/original-sp80-stage4-budget-edge.*
          retention-days: 14
          if-no-files-found: error
