name: GAME-WORKER-READY original temporal-game workstation
on:
  pull_request:
    paths:
      - 'systems/workspace/game_worker_ready_*.py'
      - 'systems/workspace/game_worker_ready_source/**'
      - 'systems/workspace/controls.py'
      - 'network/tests/test_game_worker_ready_temporal_join.py'
      - '.github/workflows/game-worker-ready-temporal.yml'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/game_worker_ready_*.py'
      - 'systems/workspace/game_worker_ready_source/**'
      - 'systems/workspace/controls.py'
      - 'network/tests/test_game_worker_ready_temporal_join.py'
      - '.github/workflows/game-worker-ready-temporal.yml'
permissions:
  contents: read
jobs:
  original-ten-job-native-game-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install native and real browser witness tools
        run: |
          python -m pip install 'cryptography>=45,<47' 'rdflib>=7,<8' 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Assert source-pinned adapter readiness, exact confirmation, tamper and replay
        run: python -m unittest -v network.tests.test_game_worker_ready_temporal_join
      - name: Run original ten jobs, real temporal game browser and native game readiness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game-ready-evidence"
          python -m systems.workspace.game_worker_ready_temporal_join \
            --data-dir "$RUNNER_TEMP/game-ready-workstation" \
            --output-dir "$RUNNER_TEMP/game-ready-evidence"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"game-ready-evidence"
          proof=json.loads((root/"game-worker-ready-complete-stack.json").read_text())
          assert proof["native_jobs"]==10
          assert proof["original_game_browser"]=="PASS"
          assert proof["game_worker_ready_witnessed"] is True
          assert proof["next_admissible_NIH_checkpoint"]=="NIH-P2-TEST"
          assert proof["nih_p2_test_witnessed"] is False
          assert (root/"game-temporal-query-events.jsonl").is_file()
          PY
          tar -czf "$RUNNER_TEMP/game-ready-evidence/original-ten-native-jobs.tar.gz" \
            -C "$RUNNER_TEMP/game-ready-workstation" \
            runtime.jsonl coordinator-windows.jsonl workstation world-request.json
      - name: Preserve game readiness CP and original native temporal journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-game-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/game-ready-evidence
          if-no-files-found: warn
          retention-days: 30
