name: ARC3 real native sp80 level change verification

on:
  push:
    paths:
      - "work/arc3/native_sp80_level_recheck.py"
      - ".github/workflows/arc3-native-sp80-recheck.yml"
  pull_request:
    paths:
      - "work/arc3/native_sp80_level_recheck.py"
      - ".github/workflows/arc3-native-sp80-recheck.yml"
  workflow_dispatch:

jobs:
  actual-native-level-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official native ARC runtime
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" numpy
      - name: Recheck witnessed sp80 level change and independent controls
        run: python -m work.arc3.native_sp80_level_recheck --out runtime/data/arc3/window48-sp80-level-recheck.json
      - name: Preserve actual native level counter and raw frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-sp80-native-level-recheck
          path: runtime/data/arc3/window48-sp80-level-recheck.*
          if-no-files-found: ignore
          retention-days: 14
