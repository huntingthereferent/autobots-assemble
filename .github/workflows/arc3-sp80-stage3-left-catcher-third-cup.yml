name: ARC3 original SP80 left-shift catcher third cup routing
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_left_catcher_third_cup.py'
      - '.github/workflows/arc3-sp80-stage3-left-catcher-third-cup.yml'
jobs:
  authentic-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile genuine stage3 source trial
        run: python -m compileall -q work/arc3/native_sp80_stage3_left_catcher_third_cup.py
      - name: Run 52 original SDK games for left catcher third cup source
        run: python -m work.arc3.native_sp80_stage3_left_catcher_third_cup --out runtime/data/arc3/original-sp80-stage3-left-catcher-third-cup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-left-catcher-third-cup
          path: runtime/data/arc3/original-sp80-stage3-left-catcher-third-cup.*
          if-no-files-found: error
          retention-days: 14
