name: ARC3 Window48 SP80 native stage-to-stage observation

on:
  push:
    paths:
      - "work/arc3/native_sp80_stage_transfer.py"
      - ".github/workflows/arc3-sp80-stage-transfer.yml"
  pull_request:
    paths:
      - "work/arc3/native_sp80_stage_transfer.py"
      - ".github/workflows/arc3-sp80-stage-transfer.yml"
  workflow_dispatch:

jobs:
  actual-native-stage-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual official native ARC runtime
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" numpy
      - name: Check witnessed SP80 0 to 1 and predeclared level-1 word transfers
        run: python -m work.arc3.native_sp80_stage_transfer --out runtime/data/arc3/window48-sp80-stage-transfer.json
      - name: Keep native frames, action observations and stage distinctions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-window48-sp80-native-stage-transfer
          path: runtime/data/arc3/window48-sp80-stage-transfer.*
          if-no-files-found: ignore
          retention-days: 14
