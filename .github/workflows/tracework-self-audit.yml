name: Tracework self audit - bounded manual audit

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: tracework-self-audit
  cancel-in-progress: false

jobs:
  close-audit-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify finite closure semantics
        run: python -m unittest -v network.tests.test_tracework_self_audit
      - name: Evaluate frozen audit and its bounded descendants
        run: python -m systems.workspace.tracework_self_audit
      - name: Retain immutable audit decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracework-self-audit-${{ github.run_id }}
          path: tracework-self-audit.json
          if-no-files-found: warn
          retention-days: 90
