name: NIH Phase 1 native W13 world source-motion witness
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_phase1_world_source_motion.py'
      - 'systems/workspace/NIH_PHASE1_WORLD_SOURCE_MOTION.md'
      - 'network/tests/test_nih_phase1_world_source_motion.py'
      - '.github/workflows/nih-phase1-world-source-motion.yml'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/nih_phase1_world_source_motion.py'
      - 'systems/workspace/NIH_PHASE1_WORLD_SOURCE_MOTION.md'
      - 'network/tests/test_nih_phase1_world_source_motion.py'
      - '.github/workflows/nih-phase1-world-source-motion.yml'
permissions:
  contents: read
jobs:
  original-native-game-source-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install original native stack and real Chromium
        run: |
          python -m pip install 'cryptography>=45,<47' 'rdflib>=7,<8' 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Reject invalid source partitions and false conflict reports
        run: python -m unittest -v network.tests.test_nih_phase1_world_source_motion
      - name: Play original twelve native jobs and test source motion inside live W13 world
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nih-phase1-source-motion"
          python -m systems.workspace.nih_phase1_world_source_motion \
            --data-dir "$RUNNER_TEMP/nih-original-world-native" \
            --output-dir "$RUNNER_TEMP/nih-phase1-source-motion"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"nih-phase1-source-motion"
          report=json.loads((root/"nih-phase1-world-source-motion.json").read_text())
          assert report["schema"]=="nih-phase1-original-world-source-motion/v1"
          assert report["native_jobs"]==12
          assert report["prior_world_axes_witnessed"] is True
          assert report["actual_world_actions"]>=2
          assert report["selected_counterfactual_profiles"]==[
              "original","later-knowledge","additional-conflict"]
          assert len(report["actual_browser_source_frames"])==(
              report["actual_world_actions"]+1)*3
          assert len(report["independently_verified_original_python_calls"])>=(
              len(report["actual_browser_source_frames"]))
          assert report["actual_world_solved"] is True
          assert report["source_partition_verified"] is True
          assert report["source_conflict_found_in_counterfactual"] is True
          assert report["original_journals_preserved"] is True
          assert report["new_native_job"] is False
          assert report["new_NIH_checkpoint"] is False
          assert report["real_historical_registry_version_authenticated"] is False
          assert report["synthetic_only"] is True
          assert report["clinical_verdict"]=="NOT_EVALUATED"
          assert report["official_NIH_submission"] is False
          assert (root/"nih-phase1-world-source-motion.png").is_file()
          assert (root/"nih-phase1-two-clock-live-world.png").is_file()
          PY
          tar -czf "$RUNNER_TEMP/nih-phase1-source-motion/original-native-journal.tgz" \
            -C "$RUNNER_TEMP/nih-original-world-native" \
            runtime.jsonl coordinator-windows.jsonl workstation
      - name: Archive actual world, source snapshots, verifier receipts and original native journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-phase1-world-source-motion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nih-phase1-source-motion/
          if-no-files-found: warn
          retention-days: 30
