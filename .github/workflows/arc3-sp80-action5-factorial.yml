name: ARC3 native SP80 ACTION5 selected-bar order and prior history
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_action5_temporal_factorial.py'
      - '.github/workflows/arc3-sp80-action5-factorial.yml'
jobs:
  original-native-ACTION5-history-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC public native SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Verify prospectively frozen source contrasts before game play
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_action5_temporal_factorial import (
            PAIRS,REPEATED,PLANS,RESETS)
          from work.arc3.native_sp80_multi_select import parse_plan
          assert len(PAIRS)==8 and len(REPEATED)==8
          assert len(PLANS)==16 and RESETS==2
          assert all(any(n==5 for n,_ in parse_plan(p)) for _,p in PLANS)
          assert all(n!=6 or xy is not None for _,p in PLANS
                     for n,xy in parse_plan(p))
          assert dict(PLANS)['upper_lower_442']=='6@12,17 6@32,25 4 4 2 5'
          assert dict(PLANS)['lower_upper_442']=='6@32,25 6@12,17 4 4 2 5'
          print('UNIT ONLY: selection-order and repeated ACTION5 histories frozen')
          PY
      - name: Witness actual original SDK ACTION5 full-frame history contrasts
        run: python -m work.arc3.native_sp80_action5_temporal_factorial --out runtime/data/arc3/sp80-action5-factorial.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-action5-factorial
          path: runtime/data/arc3/sp80-action5-factorial.*
          if-no-files-found: error
          retention-days: 14
