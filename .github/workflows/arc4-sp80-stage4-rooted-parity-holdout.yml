name: ARC4 source rooted parity holdout
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_rooted_parity_holdout.py'
      - '.github/workflows/arc4-sp80-stage4-rooted-parity-holdout.yml'
jobs:
  original-sp80-sdk-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install true native ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile prospective bounded source test
        run: python -m compileall -q work/arc3/native_sp80_stage4_rooted_parity_holdout.py
      - name: Run 24 genuine original SDK rooted parity tests
        run: python -m work.arc3.native_sp80_stage4_rooted_parity_holdout --out runtime/data/arc4/original-sp80-rooted-parity-holdout.json
      - name: Preserve all original SDK frames and A-B receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-rooted-parity-holdout
          path: runtime/data/arc4/original-sp80-rooted-parity-holdout.*
          if-no-files-found: error
          retention-days: 14
