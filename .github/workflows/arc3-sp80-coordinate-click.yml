name: ARC3 real SP80 coordinate-bearing ACTION6 original objects
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_coordinate_click.py'
      - '.github/workflows/arc3-sp80-coordinate-click.yml'
jobs:
  genuine-native-coordinate-click:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Validate predeclared original native click coordinates (unit only)
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_coordinate_click import TRIALS,RESETS
          assert len(TRIALS)==15 and RESETS==2
          assert len(set(name for name,_,_ in TRIALS))==15
          coords={tuple(p) for _,p,_ in TRIALS if p is not None}
          assert (24,37) in coords and (12,17) in coords and (32,25) in coords
          assert (41,57) in coords and (50,40) in coords
          assert sum(p is None for _,p,_ in TRIALS)==2
          print('UNIT ONLY: real SDK ACTION6 coordinate input contract and native source controls frozen')
          PY
      - name: Execute genuine original native SP80 coordinate click, movement and commit trials
        run: python -m work.arc3.native_sp80_coordinate_click --out runtime/data/arc3/sp80-coordinate-click.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-coordinate-click
          path: runtime/data/arc3/sp80-coordinate-click.*
          if-no-files-found: error
          retention-days: 14
