name: NIH P2 original source variation experiment
on:
  pull_request:
    paths:
      - 'systems/workspace/nih_dataset_sensitivity.py'
      - 'network/tests/test_nih_dataset_sensitivity.py'
      - '.github/workflows/nih-p2-source-variation.yml'
      - 'systems/workspace/nih_benchmark_*.py'
      - 'systems/workspace/nih_benchmark_worker_source/**'
  push:
    branches: [main]
    paths:
      - 'systems/workspace/nih_dataset_sensitivity.py'
      - 'network/tests/test_nih_dataset_sensitivity.py'
      - '.github/workflows/nih-p2-source-variation.yml'
permissions:
  contents: read
jobs:
  independently-replay-original-program-across-source-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install original workstation and actual browser witness requirements
        run: |
          python -m pip install 'cryptography>=45,<47' 'rdflib>=7,<8' 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Verify independent source-variation tests and tamper rejection
        run: python -m unittest -v network.tests.test_nih_dataset_sensitivity
      - name: Replay original twelve native jobs and independent source variations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nih-source-variations"
          python -m systems.workspace.nih_dataset_sensitivity \
            --data-dir "$RUNNER_TEMP/nih-original-workstation" \
            --output-dir "$RUNNER_TEMP/nih-source-variations"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"nih-source-variations"
          result=json.loads((out/"nih-p2-source-variation-summary.json").read_text())
          assert result["variation_count"]==9
          assert result["queries_per_variation"]>=20
          assert result["total_independent_original_program_executions"]>=180
          assert result["source_owned_native_checkpoint"] is False
          assert result["synthetic_only"] is True
          assert result["official_NIH_submission"] is False
          assert result["general_biomedical_benchmark"] is False
          assert len(list(out.glob("dataset-*.json")))==9
          assert (out/"nih-p2-source-variation-cases.jsonl").is_file()
          PY
          tar -czf "$RUNNER_TEMP/nih-source-variations/original-twelve-native-journal.tar.gz" \
            -C "$RUNNER_TEMP/nih-original-workstation" \
            runtime.jsonl coordinator-windows.jsonl workstation world-request.json
      - name: Archive original native source, variant inputs, and independent cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nih-p2-source-variation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nih-source-variations
          if-no-files-found: warn
          retention-days: 30
