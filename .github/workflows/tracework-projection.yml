name: Tracework mathematical projection
on:
  push:
    branches:
      - harness/tracework-baseline-2026-10-25
  workflow_dispatch:
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Projection conformance tests
        run: python -m unittest -v network.tests.test_tracework_projection
      - name: Existing runtime regression tests
        run: python -m unittest -v network.tests.test_handoff_runtime
