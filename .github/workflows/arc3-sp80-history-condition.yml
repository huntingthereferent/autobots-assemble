name: ARC3 SP80 predeclared history condition
on:
  push:
    paths:
      - "work/arc3/native_sp80_history_condition.py"
      - ".github/workflows/arc3-sp80-history-condition.yml"
  pull_request:
    paths:
      - "work/arc3/native_sp80_history_condition.py"
      - ".github/workflows/arc3-sp80-history-condition.yml"
  workflow_dispatch:
jobs:
  native-condition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "arc-agi>=0.9.6,<1" numpy
      - name: Collect native counterexamples against frozen baseline
        run: python -m work.arc3.native_sp80_history_condition --out runtime/data/arc3/sp80-history-condition.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-history-condition
          path: runtime/data/arc3/sp80-history-condition.*
          if-no-files-found: error
          retention-days: 14
