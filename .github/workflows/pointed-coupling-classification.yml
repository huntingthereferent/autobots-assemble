name: Pointed finite-field coupling classification

on:
  push:
    branches: [main]
    paths:
      - 'work/arc_like_maze/pointed_coupling_classification.py'
      - 'work/arc_like_maze/pointed_coupling_independent_audit.py'
      - 'network/tests/test_arc_like_pointed_coupling_classification.py'
      - 'work/arc_like_maze/zero_trace_lift.py'
      - 'work/arc_like_maze/variable_fourth_lift.py'
      - 'work/arc_like_maze/fifth_coordinate_lift.py'
      - '.github/workflows/pointed-coupling-classification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pointed-cohomology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile connected research modules and test
        run: |
          python -m compileall -q work/arc_like_maze/pointed_coupling_classification.py work/arc_like_maze/pointed_coupling_independent_audit.py network/tests/test_arc_like_pointed_coupling_classification.py
      - name: Focused witness-preserving classifier regression
        run: python -m unittest network.tests.test_arc_like_pointed_coupling_classification -v
      - name: Independent 486-configuration full-matrix audit
        run: python -m work.arc_like_maze.pointed_coupling_independent_audit
