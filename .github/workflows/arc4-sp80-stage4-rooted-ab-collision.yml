name: ARC4 rooted A-B source collision
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_rooted_ab_collision.py'
      - '.github/workflows/arc4-sp80-stage4-rooted-ab-collision.yml'
jobs:
  native-f3-rooted-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile exact math plus native comparison
        run: python -m compileall -q work/arc3/native_sp80_stage4_rooted_ab_collision.py
      - name: Execute frozen rooted source-collision continuation pairs
        run: python -m work.arc3.native_sp80_stage4_rooted_ab_collision --out runtime/data/arc4/original-sp80-rooted-ab-collision.json
      - name: Preserve every original SDK return and F3 witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-rooted-ab-collision
          path: runtime/data/arc4/original-sp80-rooted-ab-collision.*
          if-no-files-found: error
          retention-days: 14
