name: ARC3 SP80 original stage0 ACTION4-count heldout
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage0_count_holdout.py'
      - '.github/workflows/arc3-sp80-stage0-count-holdout.yml'
jobs:
  original-native-count-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - run: python -m work.arc3.native_sp80_stage0_count_holdout --out runtime/data/arc3/sp80-stage0-count-holdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage0-count-holdout
          path: runtime/data/arc3/sp80-stage0-count-holdout.*
          if-no-files-found: error
          retention-days: 14
