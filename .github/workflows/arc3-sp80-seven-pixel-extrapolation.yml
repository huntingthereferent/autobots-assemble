name: ARC3 native SP80 unseen frontier extrapolation
on:
  pull_request:
    paths:
      - "work/arc3/native_sp80_seven_pixel_extrapolation.py"
      - ".github/workflows/arc3-sp80-seven-pixel-extrapolation.yml"
  push:
    paths:
      - "work/arc3/native_sp80_seven_pixel_extrapolation.py"
      - ".github/workflows/arc3-sp80-seven-pixel-extrapolation.yml"
jobs:
  native-unseen-frontiers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original public ARC SDK
        run: python -m pip install "arc-agi>=0.9.6,<1" numpy
      - name: Validate frozen extrapolation and negative control (unit only)
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_seven_pixel_extrapolation import (
              WORDS, extrapolated_width_candidates as candidate)
          assert len(WORDS) == len(set(WORDS)) == 6
          assert all(len(w) == 26 for w in WORDS)
          for x in (10, 17):
              p = candidate(x, 1)
              assert p["SEVEN_PIXEL_EXTRAPOLATION"] == p["ALT_previous_observed_width"]
          for x in (24, 31):
              p = candidate(x, 1)
              assert p["ALT_previous_observed_width"] == 2
              assert p["SEVEN_PIXEL_EXTRAPOLATION"] == 1
          q = candidate(25, 1)
          assert q["ALT_previous_observed_width"] == q["SEVEN_PIXEL_EXTRAPOLATION"] == 2
          print("UNIT ONLY: candidate frozen before new native frontier observations")
          PY
      - name: Execute fresh official native SP80 26-action histories
        run: python -m work.arc3.native_sp80_seven_pixel_extrapolation --out runtime/data/arc3/sp80-seven-pixel-extrapolation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-seven-pixel-extrapolation
          path: runtime/data/arc3/sp80-seven-pixel-extrapolation.*
          if-no-files-found: error
          retention-days: 14
