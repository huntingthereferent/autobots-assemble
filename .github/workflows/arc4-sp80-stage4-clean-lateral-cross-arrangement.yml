name: ARC4 original SP80 clean lateral cross-arrangement validation
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_clean_lateral_cross_arrangement.py'
      - '.github/workflows/arc4-sp80-stage4-clean-lateral-cross-arrangement.yml'
jobs:
  genuine-original-stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile actual cross-arrangement trial
        run: python -m compileall -q work/arc3/native_sp80_stage4_clean_lateral_cross_arrangement.py
      - name: Execute 20 original SDK cross-arrangement games
        run: python -m work.arc3.native_sp80_stage4_clean_lateral_cross_arrangement --out runtime/data/arc4/original-sp80-stage4-clean-lateral-cross-arrangement.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-clean-lateral-cross-arrangement
          path: runtime/data/arc4/original-sp80-stage4-clean-lateral-cross-arrangement.*
          if-no-files-found: error
          retention-days: 14
