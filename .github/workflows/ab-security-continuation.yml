name: ab-security-continuation
on:
  push:
    paths:
      - 'security/**'
      - 'network/tests/test_security_continuation.py'
      - '.github/workflows/ab-security-continuation.yml'
  pull_request:
    paths:
      - 'security/**'
      - 'network/tests/test_security_continuation.py'
      - '.github/workflows/ab-security-continuation.yml'
permissions:
  contents: read
jobs:
  evidence-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install established cryptography primitives
        run: python -m pip install 'cryptography>=45,<47'
      - name: Compile implementation
        run: python -m compileall -q security
      - name: Native security tests
        run: python -W error::ResourceWarning -m unittest discover -s network/tests -p 'test_security_continuation.py' -v
