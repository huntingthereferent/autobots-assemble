name: research-neuro-public-snapshot-metadata

on:
  pull_request:
    paths:
      - "research/testing_lanes/neuro_public/**"
      - ".github/workflows/research-neuro-public-snapshot-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ten synthetic positive and negative source checks
        run: python -m unittest discover -s research/testing_lanes/neuro_public -p "test_*.py" -v
      - name: Assert default does not access the network
        run: python research/testing_lanes/neuro_public/snapshot_metadata.py

  public-dataset-metadata-only:
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read one frozen public dataset/snapshot GraphQL metadata entry
        run: python research/testing_lanes/neuro_public/snapshot_metadata.py --live --output neuro-public-snapshot-receipt.json
      - name: Save receipt and all access walls without raw source response bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuro-openneuro-ds000224-1.0.1-metadata-receipt
          path: neuro-public-snapshot-receipt.json
          retention-days: 30
          if-no-files-found: warn
