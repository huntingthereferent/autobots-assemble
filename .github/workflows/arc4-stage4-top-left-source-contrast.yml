name: ARC4 lane B genuine SP80 top-left source contrast
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_top_left_source_contrast.py'
      - '.github/workflows/arc4-stage4-top-left-source-contrast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native-source-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the original native SP80 SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile exact frozen source
        run: python -m compileall -q work/arc3/native_sp80_stage4_top_left_source_contrast.py
      - name: Execute six frozen native words with independent A/B SDK resets
        run: python -m work.arc3.native_sp80_stage4_top_left_source_contrast --out runtime/data/arc4/arc4-top-left-source-contrast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-top-left-source-contrast
          path: runtime/data/arc4/arc4-top-left-source-contrast.*
          retention-days: 90
          if-no-files-found: error
