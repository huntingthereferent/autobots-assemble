name: ARC4 original SDK Level4 middle height versus upstream overflow
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_middle_height_spill.py'
      - 'work/arc3/arc4_middle_height_spill_contract.json'
      - 'work/arc3/arc4_middle_height_spill_gate.py'
      - 'work/arc3/middle_height_spill_workstation.py'
      - '.github/workflows/arc4-middle-height-spill-workstation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-native-level4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original Arcade SDK and numerical frame reader
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile source-native experiment, verifier and workstation
        run: |
          python -m compileall -q \
            work/arc3/native_sp80_stage4_middle_height_spill.py \
            work/arc3/arc4_middle_height_spill_gate.py \
            work/arc3/middle_height_spill_workstation.py
      - name: Check frozen Level4 mathematical source question and official SDK oracle
        run: python -m work.arc3.arc4_middle_height_spill_gate pre
      - name: Execute 24 authentic original SDK Level4 sessions through ProcessWorkstation
        run: |
          python -m work.arc3.middle_height_spill_workstation \
            --execute \
            --data-dir runtime/data/arc4/height-spill/workstation \
            --out runtime/data/arc4/height-spill/original-height-spill.json
      - name: Independently verify native 64x64 frames, middle y displacement, cup and spill source
        run: |
          python -m work.arc3.arc4_middle_height_spill_gate post \
            --result runtime/data/arc4/height-spill/original-height-spill.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-level4-middle-height-source
          path: |
            runtime/data/arc4/height-spill/original-height-spill.*
            runtime/data/arc4/height-spill/workstation/**
          if-no-files-found: warn
          retention-days: 90
