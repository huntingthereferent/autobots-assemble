name: public-data-monitor

concurrency:
  group: public-data-monitor-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "work/projects/public-data-monitor/**"
      - ".github/workflows/public-data-monitor.yml"
  pull_request:
    paths:
      - "work/projects/public-data-monitor/**"
      - ".github/workflows/public-data-monitor.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_usgs.py tests/test_api.py tests/test_platform.py tests/test_hn.py tests/test_github_source.py tests/test_identity.py tests/test_tasks.py tests/test_metrics.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: public_data_monitor_test
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor -d public_data_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@localhost:5432/public_data_monitor_test
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_postgres_integration.py tests/test_history_store.py tests/test_source_runs.py tests/test_identity_store.py tests/test_failure_recovery.py


  live-source-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_live_source.py tests/test_hn_live.py tests/test_github_live.py tests/test_pypi_live.py

  acquisition-resilience:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_acquisition.py


  docker-stack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up -d --build
      - run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: docker compose exec -T worker celery -A app.celery_app.celery_app inspect ping
      - run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8080/ | grep -q "State & Reconciliation Platform"; then exit 0; fi
            sleep 2
          done
          docker compose logs frontend
          exit 1
      - run: curl --fail http://localhost:8080/api/health
      - run: curl --fail http://localhost:8000/metrics
      - run: |
          for i in {1..30}; do
            if curl --fail http://localhost:9090/-/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs prometheus
          exit 1
      - run: |
          for i in {1..30}; do
            if curl --fail "http://localhost:9090/api/v1/targets" | grep -q '"health":"up"'; then exit 0; fi
            sleep 2
          done
          docker compose logs prometheus
          exit 1
      - run: |
          for i in {1..30}; do
            if curl --fail -u admin:admin http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs grafana
          exit 1
      - run: |
          curl --fail -u admin:admin "http://localhost:3000/api/search?query=Platform%20Overview" | grep -q '"uid":"platform-overview"'
      - run: docker compose ps
      - if: always()
        run: docker compose down -v


  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: migration_test
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor -d migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@localhost:5432/migration_test
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Create pre-migration source_runs schema
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as conn:
              conn.execute(text("""
                  CREATE TABLE source_runs (
                      id SERIAL PRIMARY KEY,
                      source VARCHAR(128) NOT NULL,
                      started_at TIMESTAMPTZ NOT NULL,
                      finished_at TIMESTAMPTZ NULL,
                      status VARCHAR(32) NOT NULL,
                      items_seen INTEGER NOT NULL DEFAULT 0,
                      error_type VARCHAR(256) NULL,
                      error_message TEXT NULL
                  )
              """))
          PY
      - run: alembic upgrade head
      - name: Verify upgrade
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          engine = create_engine(os.environ["DATABASE_URL"])
          inspector = inspect(engine)
          columns = {c["name"] for c in inspector.get_columns("source_runs")}
          indexes = {i["name"] for i in inspector.get_indexes("source_runs")}
          assert "task_id" in columns
          assert "ix_source_runs_task_id" in indexes
          assert "identity_decision_records" in inspector.get_table_names()
          PY
      - run: alembic downgrade base
      - name: Verify downgrade
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          engine = create_engine(os.environ["DATABASE_URL"])
          inspector = inspect(engine)
          columns = {c["name"] for c in inspector.get_columns("source_runs")}
          assert "task_id" not in columns
          assert "identity_decision_records" not in inspector.get_table_names()
          PY


  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t public-data-monitor:ci .
      - run: |
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.75.0 image             --scanners vuln             --severity CRITICAL             --ignore-unfixed             --exit-code 1             public-data-monitor:ci

  performance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build db redis api
      - run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1
      - run: |
          docker run --rm             --network public-data-monitor_default             -v "$PWD/k6:/scripts:ro"             grafana/k6:2.3.0 run /scripts/load.js
      - if: always()
        run: docker compose down -v


  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor/infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: docker build -t state-reconciliation-frontend:ci .


  browser-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build db redis api frontend
      - run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8080/; then exit 0; fi
            sleep 2
          done
          docker compose logs api frontend
          exit 1
      - name: Seed live browser evidence
        run: |
          docker compose exec -T api python - <<'PY'
          from app.github_source import fetch_repository
          from app.identity import link_github_repo_to_package
          from app.identity_store import persist_identity_decision
          from app.orchestrator import run_source
          from app.pypi_source import fetch_project

          github_rows = run_source("github_api", fetch_repository)
          package_rows = run_source("pypi_api", fetch_project)
          decision = link_github_repo_to_package(github_rows[0], package_rows[0])
          persist_identity_decision(decision, threshold=100)
          assert decision.matched
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: work/projects/public-data-monitor/frontend
        run: npm install
      - working-directory: work/projects/public-data-monitor/frontend
        run: npx playwright install --with-deps chromium
      - working-directory: work/projects/public-data-monitor/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-ui-evidence
          path: |
            work/projects/public-data-monitor/frontend/test-results/
            work/projects/public-data-monitor/frontend/playwright-report/
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: docker compose down -v
