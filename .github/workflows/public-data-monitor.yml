name: public-data-monitor

on:
  push:
    paths:
      - "work/projects/public-data-monitor/**"
      - ".github/workflows/public-data-monitor.yml"
  pull_request:
    paths:
      - "work/projects/public-data-monitor/**"
      - ".github/workflows/public-data-monitor.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_usgs.py tests/test_api.py tests/test_platform.py tests/test_hn.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: public_data_monitor_test
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor -d public_data_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@localhost:5432/public_data_monitor_test
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_postgres_integration.py tests/test_history_store.py tests/test_source_runs.py


  live-source-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_live_source.py tests/test_hn_live.py

  acquisition-resilience:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_acquisition.py


  docker-stack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up -d --build
      - run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: docker compose exec -T worker celery -A app.celery_app.celery_app inspect ping
      - run: docker compose ps
      - if: always()
        run: docker compose down -v
