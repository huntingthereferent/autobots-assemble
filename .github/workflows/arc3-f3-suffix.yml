name: ARC3 F3 visible-state suffix witness

on:
  push:
    paths:
      - "work/arc3/native_suffix_probe.py"
      - "work/arc3/f3_suffix_permutation_witness.py"
      - ".github/workflows/arc3-f3-suffix.yml"
  pull_request:
    paths:
      - "work/arc3/native_suffix_probe.py"
      - ".github/workflows/arc3-f3-suffix.yml"
  workflow_dispatch:

jobs:
  native-suffix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native ARC runtime
        run: python -m pip install --disable-pip-version-check "arc-agi>=0.9.6,<1" numpy
      - name: Test visible identical prefixes under matching native suffixes
        run: python -m work.arc3.native_suffix_probe --game ls20 --out runtime/data/arc3/f3-native-suffix.json
      - name: Compare native suffix witness to nine original invertible F3 laws
        run: python -m work.arc3.f3_suffix_permutation_witness --native runtime/data/arc3/f3-native-suffix.json --out runtime/data/arc3/f3-native-suffix-math.json
      - name: Preserve native raw frames and source observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-f3-native-suffix-ls20
          path: |
            runtime/data/arc3/f3-native-suffix.*
          if-no-files-found: error
          retention-days: 14
