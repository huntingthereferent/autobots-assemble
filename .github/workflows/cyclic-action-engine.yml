name: Cyclic Action Engine Native Continuation

on:
  push:
    paths:
      - 'work/arc_like_maze/cyclic_action_engine.py'
      - 'work/arc_like_maze/window_two.py'
      - 'network/tests/test_arc_like_cyclic_action_engine.py'
      - '.github/workflows/cyclic-action-engine.yml'
  pull_request:
    paths:
      - 'work/arc_like_maze/cyclic_action_engine.py'
      - 'work/arc_like_maze/window_two.py'
      - 'network/tests/test_arc_like_cyclic_action_engine.py'
      - '.github/workflows/cyclic-action-engine.yml'
  workflow_dispatch:

jobs:
  bounded-continuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify native B-only continuation and witness reentry
        run: python -m unittest network.tests.test_arc_like_cyclic_action_engine -v
      - name: Verify original window mathematics
        run: python -m unittest network.tests.test_arc_like_window_combined -v
