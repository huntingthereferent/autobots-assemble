name: WORLD 33 bounded local recomputed halfplane prefix

on:
  push:
    paths:
      - 'systems/workspace/world_ab_local_plane_prefix.py'
      - 'network/tests/test_world_ab_local_plane_prefix.py'
      - 'systems/workspace/WORLD_AB_LOCAL_PLANE_PREFIX_TRIAL_33_2026-10-20.md'
      - '.github/workflows/world-ab-local-plane-prefix.yml'
  pull_request:
    paths:
      - 'systems/workspace/world_ab_local_plane_prefix.py'
      - 'network/tests/test_world_ab_local_plane_prefix.py'
      - 'systems/workspace/WORLD_AB_LOCAL_PLANE_PREFIX_TRIAL_33_2026-10-20.md'
      - '.github/workflows/world-ab-local-plane-prefix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bounded-prefix-independent-world-corners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original WORLD numerical regressions and independent new local witness
        run: |
          python -m unittest -v network.tests.test_world_ab_oblique_impact network.tests.test_world_ab_local_recontact_impulse network.tests.test_world_ab_rotating_receiver network.tests.test_world_ab_third_contact network.tests.test_world_ab_first_post_third_candidate network.tests.test_world_ab_all_inward_finite_features network.tests.test_world_ab_rotating_edge_face_endpoint network.tests.test_world_ab_finite_segment_square_overlap network.tests.test_world_ab_between_sample_clearance network.tests.test_world_ab_local_finite_onset network.tests.test_world_ab_first_finite_response_qualification network.tests.test_world_ab_post_fourth_local_clearance network.tests.test_world_ab_first_envelope_limit network.tests.test_world_ab_geometry_at_first_envelope_limit network.tests.test_world_ab_local_plane_prefix
      - name: Retain source and independently replayed interval evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          from systems.workspace.world_ab_local_plane_prefix import run
          from network.tests.test_world_ab_local_plane_prefix import verify
          source=run()
          witness=[{"angle":case["angle"],"status":case["status"],
                    "independent_world_corner_interval_witness":verify(case)}
                   for case in source["cases"]]
          assert len(witness)==8 and all(x["independent_world_corner_interval_witness"] for x in witness)
          assert source["original_first_limit_cases"]==3
          assert source["without_original_response"]==5
          assert source["full_new_window_supported_cases"]+source["locally_unresolved_cases"]==3
          assert source["fifth_impulses_selected"]==0
          assert source["physical_measurements"]==0
          folder=Path("world33-native-evidence")
          folder.mkdir(exist_ok=True)
          payload=json.dumps({"source":source,"independent_witness":witness},
                             sort_keys=True,indent=2,allow_nan=False)+"\n"
          (folder/"recomputed_original_plane_prefix.json").write_text(payload)
          (folder/"recomputed_original_plane_prefix.sha256").write_text(
              sha256(payload.encode()).hexdigest()+"  recomputed_original_plane_prefix.json\n")
          print(json.dumps({
              "source_previous_bound_limit_cases":source["original_first_limit_cases"],
              "whole_new_window_nominally_supported":source["full_new_window_supported_cases"],
              "first_unknown_local_interval":source["locally_unresolved_cases"],
              "inactive_source_controls":source["without_original_response"],
              "measured_fifth_contact":0},sort_keys=True))
          for case in source["cases"]:
              if case["supported_prefix_end_time"] is not None:
                  print(json.dumps({
                      "angle":case["angle"],
                      "source_first_limit":case["source_first_limit_time"],
                      "recomputed_prefix_end":case["supported_prefix_end_time"],
                      "attempted_window_end":case["attempted_end_time"],
                      "status":case["status"],
                      "original_verified_leaf_intervals":len(case["certified_subintervals"])
                  },sort_keys=True))
          PY
      - name: Retain original bounded source and independent numerical witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world33-original-local-recomputed-prefix
          path: world33-native-evidence/
          if-no-files-found: warn
          retention-days: 30
