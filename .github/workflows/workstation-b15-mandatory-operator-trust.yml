name: workstation-b15-mandatory-operator-trust
on:
  push:
    paths:
      - 'systems/workspace/b13_offline_owner_delivery.py'
      - 'systems/workspace/b14_operator_pin_ledger.py'
      - 'network/tests/test_b13_offline_owner_delivery.py'
      - 'network/tests/test_b15_mandatory_operator_trust.py'
      - 'systems/workspace/B15_MANDATORY_OPERATOR_TRUST.md'
      - '.github/workflows/workstation-b15-mandatory-operator-trust.yml'
  pull_request:
    paths:
      - 'systems/workspace/b13_offline_owner_delivery.py'
      - 'systems/workspace/b14_operator_pin_ledger.py'
      - 'network/tests/test_b13_offline_owner_delivery.py'
      - 'network/tests/test_b15_mandatory_operator_trust.py'
      - 'systems/workspace/B15_MANDATORY_OPERATOR_TRUST.md'
      - '.github/workflows/workstation-b15-mandatory-operator-trust.yml'
  workflow_dispatch:

jobs:
  mandatory-operator-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native signature verification dependency
        run: python -m pip install 'cryptography>=45,<47'
      - name: Require exactly 14 B15 legacy-entrance trust cases without skips
        run: |
          python - <<'PY'
          import unittest
          from network.tests import test_b15_mandatory_operator_trust
          suite = unittest.defaultTestLoader.loadTestsFromModule(test_b15_mandatory_operator_trust)
          if suite.countTestCases() != 14:
              raise SystemExit(f'expected 14 B15 tests, got {suite.countTestCases()}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('B15 mandatory trust suite failed')
          PY
      - name: Preserve B14 and all B13/B12/B11/B10 regressions
        run: |
          python -m unittest -v \
            network.tests.test_b14_operator_pin_ledger \
            network.tests.test_b13_offline_owner_delivery \
            network.tests.test_b12_b3_native_delivery \
            network.tests.test_b11_native_local_delivery \
            network.tests.test_b9_event_bridge \
            network.tests.test_observed_event_journal \
            network.tests.test_observed_event_journal_native
      - name: Preserve 73 original B9 construction tests
        run: |
          python - <<'PY'
          import importlib, unittest
          names = (
              'network.tests.test_workstation_construction',
              'network.tests.test_workstation_construction_frontier',
              'network.tests.test_workstation_construction_scale',
              'network.tests.test_workstation_construction_route_scope',
          )
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.loadTestsFromModule(importlib.import_module(name))
              for name in names
          )
          if suite.countTestCases() != 73:
              raise SystemExit('original B9 construction count changed')
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('B9 construction regression suite failed')
          PY
