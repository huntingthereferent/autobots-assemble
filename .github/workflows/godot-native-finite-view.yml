name: Godot native finite view

on:
  push:
    paths:
      - 'views/godot_ab/**'
      - 'network/tests/test_godot_native_finite.py'
      - '.github/workflows/godot-native-finite-view.yml'
      - 'work/arc_like_maze/math.py'
  pull_request:
    paths:
      - 'views/godot_ab/**'
      - 'network/tests/test_godot_native_finite.py'
      - '.github/workflows/godot-native-finite-view.yml'
      - 'work/arc_like_maze/math.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-headless-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently replay entire finite World projection
        run: |
          python -m views.godot_ab.export_finite --check
          python -m unittest -v network.tests.test_godot_native_finite
      - name: Pin Godot 4.7.2 official binary and validate upstream checksum
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o godot-linux.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot-linux.zip' | sha256sum --check
          unzip -q godot-linux.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse the actual Godot scene and GDScript
        run: |
          timeout 90 ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path views/godot_ab --editor --quit
      - name: Actually instantiate the real 27-state Godot viewer
        run: |
          timeout 45 ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path views/godot_ab --quit-after 8
      - name: Replay actual Godot keyboard navigation and bounded demo
        run: |
          timeout 45 ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path views/godot_ab --script res://test_viewer.gd
