name: ARC3 original SP80 staggered three-bar native pulses
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_staggered_bar_paths.py'
      - '.github/workflows/arc3-sp80-staggered-bars.yml'
jobs:
  source-native-staggered-bars:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - run: python -m work.arc3.native_sp80_staggered_bar_paths --out runtime/data/arc3/sp80-staggered-bars.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-staggered-bars
          path: runtime/data/arc3/sp80-staggered-bars.*
          if-no-files-found: error
          retention-days: 14
