name: ARC3 authentic SP80 level3 early stream intervention
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_early_stream_intercept.py'
      - '.github/workflows/arc3-sp80-stage3-early-stream-intercept.yml'
jobs:
  native-source-intercept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine original SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Check original native trial syntax
        run: python -m compileall -q work/arc3/native_sp80_stage3_early_stream_intercept.py
      - name: Execute 36 original SDK source interception games
        run: python -m work.arc3.native_sp80_stage3_early_stream_intercept --out runtime/data/arc3/original-sp80-stage3-early-stream-intercept.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-early-stream-intercept
          path: runtime/data/arc3/original-sp80-stage3-early-stream-intercept.*
          if-no-files-found: error
          retention-days: 14
