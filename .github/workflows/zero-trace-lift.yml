name: Zero-trace pointed transformation proof

on:
  push:
    branches: [main]
    paths:
      - 'work/arc_like_maze/zero_trace_lift.py'
      - 'work/arc_like_maze/zero_trace_arithmetic_audit.py'
      - 'network/tests/test_arc_like_zero_trace_lift.py'
      - 'work/arc_like_maze/nonconstant_drift.py'
      - 'work/arc_like_maze/fifth_coordinate_lift.py'
      - '.github/workflows/zero-trace-lift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-field-cohomology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Zero-trace pointed conjugacy regression tests
        run: python -m unittest network.tests.test_arc_like_zero_trace_lift -v
      - name: Independent 81-by-36 matrix and cyclic-order audit
        run: python -m work.arc_like_maze.zero_trace_arithmetic_audit
