name: ARC4 B source order after first failed four-cup pour
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_pour_movement_order.py'
      - '.github/workflows/arc4-pour-movement-order.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native-order-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real original Arcade SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original native matched-history contrast
        run: python -m compileall -q work/arc3/native_sp80_stage4_pour_movement_order.py
      - name: Execute direct vs post-first-pour right-bar rearrangement controls with independent entrances
        run: python -m work.arc3.native_sp80_stage4_pour_movement_order --out runtime/data/arc4/arc4-original-postpour-right-rearrangement.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc4-original-postpour-right-rearrangement
          path: runtime/data/arc4/arc4-original-postpour-right-rearrangement.*
          retention-days: 90
          if-no-files-found: error
