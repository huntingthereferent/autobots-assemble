name: ARC3 original SP80 stage3 two-source single-pour boundary
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_two_source_single_pour.py'
      - '.github/workflows/arc3-sp80-stage3-two-source-single-pour.yml'
jobs:
  authentic-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Verify native trial compiles
        run: python -m compileall -q work/arc3/native_sp80_stage3_two_source_single_pour.py
      - name: Execute forty original SP80 one-pour source trials
        run: python -m work.arc3.native_sp80_stage3_two_source_single_pour --out runtime/data/arc3/original-sp80-stage3-two-source-single-pour.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-two-source-single-pour
          path: runtime/data/arc3/original-sp80-stage3-two-source-single-pour.*
          if-no-files-found: error
          retention-days: 14
