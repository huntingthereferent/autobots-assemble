name: ARC4 original SP80 restore left-side fourth cup native
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_left_cup_trial.py'
      - '.github/workflows/arc4-sp80-stage4-left-cup-trial.yml'
jobs:
  genuine-original-stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original source trial
        run: python -m compileall -q work/arc3/native_sp80_stage4_left_cup_trial.py
      - name: Execute 48 genuine original SP80 level4 left-cup trials
        run: python -m work.arc3.native_sp80_stage4_left_cup_trial --out runtime/data/arc4/original-sp80-stage4-left-cup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage4-left-cup
          path: runtime/data/arc4/original-sp80-stage4-left-cup.*
          if-no-files-found: error
          retention-days: 14
