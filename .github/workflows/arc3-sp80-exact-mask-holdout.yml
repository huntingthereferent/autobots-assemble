name: ARC3 SP80 native exact ACTION4 color-mask holdout
on:
  pull_request:
    paths:
      - "work/arc3/native_sp80_exact_mask_holdout.py"
      - ".github/workflows/arc3-sp80-exact-mask-holdout.yml"
  push:
    paths:
      - "work/arc3/native_sp80_exact_mask_holdout.py"
      - ".github/workflows/arc3-sp80-exact-mask-holdout.yml"
jobs:
  native-exact-mask:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "arc-agi>=0.9.6,<1" numpy
      - name: Verify frozen original-color masks using unit-only cases
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_exact_mask_holdout import (
              WORDS, RESETS, ordinal_exact_prediction)
          assert len(WORDS) == len(set(WORDS)) == 6 and RESETS==2
          assert all(len(w)==18 for w in WORDS)
          for k in range(1,7):
              d=ordinal_exact_prediction(k,4)
              assert len(d)==32
              assert d[(16+4*k,36)] == (9,12)
              assert d[(36+4*k,39)] == (12,9)
          assert ordinal_exact_prediction(7,4)=={}
          assert ordinal_exact_prediction(1,5)=={}
          print("UNIT ONLY: exact source-derived native mask is frozen")
          PY
      - name: Execute official public native SP80 held-out observations
        run: python -m work.arc3.native_sp80_exact_mask_holdout --out runtime/data/arc3/sp80-exact-mask-holdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-exact-mask-holdout
          path: runtime/data/arc3/sp80-exact-mask-holdout.*
          if-no-files-found: error
          retention-days: 14
