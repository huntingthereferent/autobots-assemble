name: REA A/B durable restart and idempotent continuation
on:
  push:
    branches: ['experiment/swallow-rea-ab-20261017']
    paths: ['experiments/rea-swallow/**', '.github/workflows/rea-swallow-restart.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restart-actual-rea:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact pinned upstream REA
        working-directory: experiments/rea-swallow/upstream
        run: |
          test "$(git rev-parse HEAD)" = "f0b9ef34c404c1c65f8167502db972b0bd708403"
          npm ci --no-audit --no-fund
      - name: Recreate verified REA native source continuation
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/observation_source_experiment.py prepare --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/observation_source_experiment.py apply --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/choice_source_experiment.py prepare --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/choice_source_experiment.py apply --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/construct_source_experiment.py prepare --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/construct_source_experiment.py apply --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/advance_source_experiment.py prepare --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/advance_source_experiment.py apply --rea experiments/rea-swallow/upstream
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/checkpoint_source_experiment.py prepare --rea experiments/rea-swallow/upstream
      - name: Verify parent native REA before disk-state addition
        working-directory: experiments/rea-swallow/upstream
        run: |
          set -o pipefail
          npx --no-install vitest run src/domain/javascript/javascriptApplicationVersionMatching.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/experiments/rea-swallow/results/restart-control.log"
      - name: Apply real REA durable checkpoint source edition
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python3 experiments/rea-swallow/checkpoint_source_experiment.py apply --rea experiments/rea-swallow/upstream
          cp experiments/rea-swallow/checkpoint_cli.ts experiments/rea-swallow/upstream/src/domain/javascript/javascriptCheckpointCLI.ab-swallow.ts
          cp experiments/rea-swallow/checkpoint_contract.test.ts experiments/rea-swallow/upstream/src/domain/javascript/javascriptCheckpoint.ab-swallow.test.ts
          git -C experiments/rea-swallow/upstream diff > experiments/rea-swallow/results/restart-source.patch
      - name: Execute restarted processes, failed captures, and native REA tests
        working-directory: experiments/rea-swallow/upstream
        run: |
          set -o pipefail
          REA_AB_RESTART_OUTPUT="$GITHUB_WORKSPACE/experiments/rea-swallow/results/restart-evidence.json" npx --no-install vitest run src/domain/javascript/javascriptCheckpoint.ab-swallow.test.ts src/domain/javascript/javascriptApplicationVersionMatching.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/experiments/rea-swallow/results/restart-experimental.log"
      - name: Full native REA TypeScript check
        working-directory: experiments/rea-swallow/upstream
        run: npx --no-install tsc --noEmit -p tsconfig.json
      - name: Preserve real source and recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-durable-investigation-restart
          path: experiments/rea-swallow/results/restart-*
          if-no-files-found: warn
          retention-days: 14
