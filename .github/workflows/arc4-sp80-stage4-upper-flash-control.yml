name: ARC4 source top-edge discriminator
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage4_upper_flash_control.py'
      - '.github/workflows/arc4-sp80-stage4-upper-flash-control.yml'
jobs:
  genuine-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Check source syntax
        run: python -m compileall -q work/arc3/native_sp80_stage4_upper_flash_control.py
      - name: Execute 18 original SDK SP80 four-cup upper-edge tests
        run: python -m work.arc3.native_sp80_stage4_upper_flash_control --out runtime/data/arc4/original-sp80-stage4-upper-flash-control.json
      - name: Preserve genuine SDK arrays and action ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sp80-stage4-upper-flash-control
          path: runtime/data/arc4/original-sp80-stage4-upper-flash-control.*
          retention-days: 14
          if-no-files-found: error
