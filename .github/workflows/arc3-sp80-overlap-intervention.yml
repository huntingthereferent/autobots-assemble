name: ARC3 original SP80 color8 overlap and ACTION5 vs ACTION6
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_overlap_intervention.py'
      - '.github/workflows/arc3-sp80-overlap-intervention.yml'
jobs:
  original-native-overlap-intervention:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original native SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Verify predeclared source-probe words
        run: |
          python - <<'PY'
          from work.arc3.native_sp80_overlap_intervention import WORDS,RESETS
          assert WORDS==(
              '111','115','116','1115','1116','44111',
              '441115','441116','111445','111446','11154','11164')
          assert len(set(WORDS))==12 and RESETS==2
          print('UNIT ONLY: original overlap and legal native ACTION5/6 probes frozen')
          PY
      - name: Execute genuine original SP80 stage1 overlap interventions
        run: python -m work.arc3.native_sp80_overlap_intervention --out runtime/data/arc3/sp80-overlap-intervention.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-sp80-overlap-intervention
          path: runtime/data/arc3/sp80-overlap-intervention.*
          if-no-files-found: error
          retention-days: 14
