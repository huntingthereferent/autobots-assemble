name: ARC3 original SP80 first spill contact source ledger
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_first_spill_ledger.py'
      - '.github/workflows/arc3-sp80-stage3-first-spill-ledger.yml'
jobs:
  genuine-original-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original ARC SDK
        run: python -m pip install 'arc-agi>=0.9.6,<1' numpy
      - name: Compile original native spill evidence code
        run: python -m compileall -q work/arc3/native_sp80_stage3_first_spill_ledger.py
      - name: Run 30 original SDK source feedback cases
        run: python -m work.arc3.native_sp80_stage3_first_spill_ledger --out runtime/data/arc3/original-sp80-stage3-first-spill-ledger.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-sp80-stage3-first-spill-ledger
          path: runtime/data/arc3/original-sp80-stage3-first-spill-ledger.*
          if-no-files-found: error
          retention-days: 14
