name: ARC3 original SDK matched four-cup success boundary audit
on:
  pull_request:
    paths:
      - 'work/arc3/native_sp80_stage3_matched_outlet_audit.py'
      - '.github/workflows/arc3-matched-outlet-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-array reader (no game SDK)
        run: python -m pip install numpy
      - name: Retrieve pinned original SDK native artifact before expiry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/data/arc3/matched
          curl --fail --show-error --silent --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/huntingthereferent/autobots-assemble/actions/artifacts/12352298969/zip" \
            --output runtime/data/arc3/matched/original-sp80-stage3-right-catcher-edge.zip
          unzip -t runtime/data/arc3/matched/original-sp80-stage3-right-catcher-edge.zip >/dev/null
      - name: Verify original native A/B source frames, clicks, cups and bottom response
        run: |
          python -m work.arc3.native_sp80_stage3_matched_outlet_audit \
            --archive runtime/data/arc3/matched/original-sp80-stage3-right-catcher-edge.zip \
            --out runtime/data/arc3/matched/original-native-matched-boundary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-original-native-success-failure-source-audit
          path: runtime/data/arc3/matched/original-native-matched-boundary.json
          if-no-files-found: warn
          retention-days: 90
