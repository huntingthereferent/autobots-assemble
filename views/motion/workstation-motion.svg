<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">Workstation recorded movement outcomes</title><desc id="desc">Recorded protocol outcomes from views/work_state.json. Animated marks do not signify running workers or new jobs.</desc><style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.signal{stroke-dasharray:7 17;animation:flow 3.5s linear infinite}
.signal.slow{animation-duration:7s}
.blink{animation:fade 3s ease-in-out infinite}
.blink.delay{animation-delay:-1.5s}
.ring{transform-box:fill-box;transform-origin:center;animation:turn 24s linear infinite}
.route{stroke-dasharray:380;stroke-dashoffset:380;animation:draw 7s ease-in-out infinite}
.trace{stroke-dasharray:3 14;animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-144}}
@keyframes fade{50%{opacity:.22}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes draw{0%,8%{stroke-dashoffset:380}45%,100%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.route{stroke-dashoffset:0}}
</style><rect width="1100" height="350" rx="14" fill="#080e19"/><rect x="12" y="12" width="1076" height="326" rx="10" fill="none" stroke="#344967"/><g stroke="#30445e" stroke-opacity=".24"><path d="M40 20V330"/><path d="M84 20V330"/><path d="M128 20V330"/><path d="M172 20V330"/><path d="M216 20V330"/><path d="M260 20V330"/><path d="M304 20V330"/><path d="M348 20V330"/><path d="M392 20V330"/><path d="M436 20V330"/><path d="M480 20V330"/><path d="M524 20V330"/><path d="M568 20V330"/><path d="M612 20V330"/><path d="M656 20V330"/><path d="M700 20V330"/><path d="M744 20V330"/><path d="M788 20V330"/><path d="M832 20V330"/><path d="M876 20V330"/><path d="M920 20V330"/><path d="M964 20V330"/><path d="M1008 20V330"/><path d="M1052 20V330"/><path d="M1096 20V330"/></g><text x="42" y="51" font-size="13" letter-spacing="2.1" fill="#48d6eb">EXISTING WORKSTATION / RECORDED RESULTS</text><text x="42" y="96" font-size="30" font-weight="bold" fill="#f3f8ff">Movement and walls</text><text x="43" y="123" font-size="14" fill="#b6c8df">15 recorded jobs · public aggregate, not worker health</text><text x="47" y="161" fill="#48d6eb" font-size="16">MOVE</text><rect x="191" y="145" width="650" height="20" rx="8" fill="#1a2a3e"/><rect x="191" y="145" width="173.3" height="20" rx="8" fill="#48d6eb" fill-opacity=".23"/><path class="signal slow" d="M195 155H364.3" stroke="#48d6eb" stroke-width="4" fill="none"/><text x="876" y="161" fill="#dce7f1" font-size="20">4</text><text x="47" y="204" fill="#8a83df" font-size="16">WALL</text><rect x="191" y="188" width="650" height="20" rx="8" fill="#1a2a3e"/><rect x="191" y="188" width="476.7" height="20" rx="8" fill="#8a83df" fill-opacity=".23"/><path class="signal slow" d="M195 198H667.7" stroke="#8a83df" stroke-width="4" fill="none"/><text x="876" y="204" fill="#dce7f1" font-size="20">11</text><text x="47" y="247" fill="#7aaafb" font-size="16">UNKNOWN</text><rect x="191" y="231" width="650" height="20" rx="8" fill="#1a2a3e"/><text x="876" y="247" fill="#dce7f1" font-size="20">0</text><text x="47" y="290" fill="#dce7f1" font-size="16">PARTIAL</text><rect x="191" y="274" width="650" height="20" rx="8" fill="#1a2a3e"/><text x="876" y="290" fill="#dce7f1" font-size="20">0</text><text x="47" y="326" fill="#acbfd1" font-size="13">Counts are committed records, not live executions or source-edit witnesses.</text></svg>
