<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="405" viewBox="0 0 1100 405" role="img" aria-labelledby="title desc"><title id="title">Public observations: evidence-backed versus unjoined paths</title><desc id="desc">Snapshot checked 2026-10-17 18:47:12 UTC. Source-owned URL metadata supports the GitHub/PyPI relationship; USGS remains separate.</desc><style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.signal{stroke-dasharray:7 17;animation:flow 3.5s linear infinite}
.signal.slow{animation-duration:7s}
.blink{animation:fade 3s ease-in-out infinite}
.blink.delay{animation-delay:-1.5s}
.ring{transform-box:fill-box;transform-origin:center;animation:turn 24s linear infinite}
.route{stroke-dasharray:380;stroke-dashoffset:380;animation:draw 7s ease-in-out infinite}
.trace{stroke-dasharray:3 14;animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-144}}
@keyframes fade{50%{opacity:.22}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes draw{0%,8%{stroke-dashoffset:380}45%,100%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.route{stroke-dashoffset:0}}
