<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">Finite A/B: two action orders and a verified return</title><desc id="desc">Two paths generated by work.arc_like_maze.math.World. A then B gives (1, 2, 0); B then A gives (1, 1, 0). Animation illustrates declared finite operators, not human reasoning or a running cluster.</desc><style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.signal{stroke-dasharray:7 17;animation:flow 3.5s linear infinite}
.signal.slow{animation-duration:7s}
.blink{animation:fade 3s ease-in-out infinite}
.blink.delay{animation-delay:-1.5s}
.ring{transform-box:fill-box;transform-origin:center;animation:turn 24s linear infinite}
.route{stroke-dasharray:380;stroke-dashoffset:380;animation:draw 7s ease-in-out infinite}
.trace{stroke-dasharray:3 14;animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-144}}
@keyframes fade{50%{opacity:.22}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes draw{0%,8%{stroke-dashoffset:380}45%,100%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.route{stroke-dashoffset:0}}
</style><rect width="1100" height="460" rx="14" fill="#080e19"/><rect x="12" y="12" width="1076" height="436" rx="10" fill="none" stroke="#344967"/><g stroke="#30445e" stroke-opacity=".24"><path d="M40 20V440"/><path d="M84 20V440"/><path d="M128 20V440"/><path d="M172 20V440"/><path d="M216 20V440"/><path d="M260 20V440"/><path d="M304 20V440"/><path d="M348 20V440"/><path d="M392 20V440"/><path d="M436 20V440"/><path d="M480 20V440"/><path d="M524 20V440"/><path d="M568 20V440"/><path d="M612 20V440"/><path d="M656 20V440"/><path d="M700 20V440"/><path d="M744 20V440"/><path d="M788 20V440"/><path d="M832 20V440"/><path d="M876 20V440"/><path d="M920 20V440"/><path d="M964 20V440"/><path d="M1008 20V440"/><path d="M1052 20V440"/><path d="M1096 20V440"/></g><text x="42" y="51" font-size="13" letter-spacing="2.1" fill="#48d6eb">NATIVE FINITE MATHEMATICS / SOURCE-DERIVED</text><text x="42" y="96" font-size="30" font-weight="bold" fill="#f3f8ff">The order changes the state</text><text x="43" y="123" font-size="14" fill="#b6c8df">F3^3 · phi=(0,1,2) · origin (0,0,0)</text><g fill="none" stroke-width="3.4" stroke-linecap="round"><path d="M150 290Q260 205 355 205" stroke="#48d6eb" stroke-opacity=".25" stroke-width="10"/><path class="signal" d="M150 290Q260 205 355 205" stroke="#48d6eb"/><path d="M355 205Q490 205 602 188" stroke="#48d6eb" stroke-opacity=".25" stroke-width="10"/><path class="signal" d="M355 205Q490 205 602 188" stroke="#48d6eb"/><path d="M150 290Q260 362 355 362" stroke="#8a83df" stroke-opacity=".25" stroke-width="10"/><path class="signal" d="M150 290Q260 362 355 362" stroke="#8a83df"/><path d="M355 362Q490 362 602 374" stroke="#8a83df" stroke-opacity=".25" stroke-width="10"/><path class="signal" d="M355 362Q490 362 602 374" stroke="#8a83df"/></g><circle class="blink" cx="150" cy="290" r="10" fill="#dce7f1"/><circle cx="150" cy="290" r="4" fill="#080e19"/><text x="166" y="275" font-size="15" fill="#dce7f1">(0,0,0)</text><circle class="blink" cx="355" cy="205" r="10" fill="#48d6eb"/><circle cx="355" cy="205" r="4" fill="#080e19"/><text x="371" y="190" font-size="15" fill="#48d6eb">(1,0,0)</text><circle class="blink" cx="355" cy="362" r="10" fill="#8a83df"/><circle cx="355" cy="362" r="4" fill="#080e19"/><text x="371" y="347" font-size="15" fill="#8a83df">(0,1,0)</text><circle class="blink" cx="602" cy="188" r="10" fill="#48d6eb"/><circle cx="602" cy="188" r="4" fill="#080e19"/><text x="618" y="173" font-size="15" fill="#48d6eb">(1,2,0)</text><circle class="blink" cx="602" cy="374" r="10" fill="#8a83df"/><circle cx="602" cy="374" r="4" fill="#080e19"/><text x="618" y="359" font-size="15" fill="#8a83df">(1,1,0)</text><text x="250" y="202" font-size="14" fill="#48d6eb">A</text><text x="471" y="178" font-size="14" fill="#48d6eb">B</text><text x="250" y="350" font-size="14" fill="#8a83df">B</text><text x="471" y="346" font-size="14" fill="#8a83df">A</text><path d="M665 188H716V374H665" fill="none" stroke="#627998" stroke-dasharray="3 9"/><text x="741" y="258" font-size="24" font-weight="bold" fill="#dce7f1">AB != BA</text><text x="742" y="292" font-size="17" fill="#48d6eb">(1,2,0)</text><text x="742" y="317" font-size="17" fill="#8a83df">(1,1,0)</text><text x="742" y="350" font-size="13" fill="#b3c5dc">Different endpoints in this finite world</text><path class="trace" d="M72 412H1017" stroke="#7aaafb" fill="none"/><text x="75" y="437" font-size="13" fill="#acc3d8">A^3(origin) = origin; 27 reachable states · not a universal A/B law</text></svg>
