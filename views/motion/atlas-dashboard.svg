<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">James Muneoka — a living atlas of observations</title><desc id="desc">Animated research profile. Ten cataloged domains, 60 candidate sources, 300 public network probes, 15 recorded workstation jobs. Actual finite paths BBAA and ABABB meet at [2, 2, 1]. Catalog domains are not connected scientific evidence. No live traffic values are invented.</desc><defs><radialGradient id="deep"><stop stop-color="#182D46"/><stop offset=".6" stop-color="#0D182C"/><stop offset="1" stop-color="#070D19"/></radialGradient><linearGradient id="left"><stop stop-color="#071523"/><stop offset="1" stop-color="#0B0F20"/></linearGradient><linearGradient id="cyan"><stop stop-color="#42D9EC"/><stop offset="1" stop-color="#9DA2F8"/></linearGradient><radialGradient id="flare"><stop stop-color="#46DCED" stop-opacity=".26"/><stop offset="1" stop-color="#46DCED" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#39536F" stroke-opacity=".19"/></pattern></defs><style>text{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
    .orbit{transform-origin:861px 316px;animation:spin 36s linear infinite}
    .orbit2{transform-origin:861px 316px;animation:spin 55s linear infinite reverse}
    .radar{transform-origin:861px 316px;animation:spin 9s linear infinite}
    .pulse{animation:blink 4s ease-in-out infinite}
    .light{animation:blink 2.7s ease-in-out infinite}
    .beam{stroke-dasharray:5 15;animation:flow 5s linear infinite}
    .trail{stroke-dasharray:130;animation:draw 8s ease-in-out infinite}
    .trace{stroke-dasharray:12 22;animation:flow 3.5s linear infinite}
    .boot{animation:enter 1.4s ease-out both}
    .delayed{animation-delay:.35s}
    .slow{animation-delay:.8s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes blink{50%{opacity:.3}}
    @keyframes flow{to{stroke-dashoffset:-156}}
    @keyframes draw{0%,10%{stroke-dashoffset:130}70%,100%{stroke-dashoffset:0}}
    @keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}}
