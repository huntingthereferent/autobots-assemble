<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Hunting the Referent — witnessed paths through a mathematical world</title><desc id="desc">Finite source-verified paths BBAA and ABABB meet at [2, 2, 1]. Source-recorded research movements and walls follow the original workstation research observer. This is a finite mathematical observation, not a claim about all external sources.</desc><defs><radialGradient id="depth"><stop stop-color="#132A43"/><stop offset=".5" stop-color="#0B172B"/><stop offset="1" stop-color="#050B17"/></radialGradient><linearGradient id="trail"><stop stop-color="#3ECDE9" stop-opacity=".15"/><stop offset=".57" stop-color="#53E0F5"/><stop offset="1" stop-color="#A6EFFF"/></linearGradient><linearGradient id="violet"><stop stop-color="#7351D9" stop-opacity=".15"/><stop offset="1" stop-color="#B4A3FF"/></linearGradient><radialGradient id="glow"><stop stop-color="#5CE4FA" stop-opacity=".30"/><stop offset="1" stop-color="#5CE4FA" stop-opacity="0"/></radialGradient><pattern id="mesh" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#41607D" stroke-opacity=".14" fill="none"/></pattern></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .signal{stroke-dasharray:10 25;animation:flow 5.1s linear infinite}
    .lower{animation-duration:7.3s;animation-delay:-2.2s}
    .endpoint{transform-origin:1010px 351px;animation:pulse 3.4s ease-in-out infinite}
    .horizon{animation:fade 6s ease-in-out infinite}
    .gridline{animation:fade 9s ease-in-out infinite}
    .reveal{animation:enter 1.25s cubic-bezier(.2,.7,.2,1) both}
    .delayed{animation-delay:.5s}
    @keyframes flow{to{stroke-dashoffset:-175}}
    @keyframes pulse{50%{opacity:.5;transform:scale(1.21)}}
    @keyframes fade{50%{opacity:.35}}
    @keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}}</style><rect width="1200" height="740" rx="16" fill="url(#depth)"/><rect width="1200" height="740" rx="16" fill="url(#mesh)"/><rect x="12" y="12" width="1176" height="716" rx="11" fill="none" stroke="#41627D" stroke-opacity=".7"/><path d="M40 58H1160" stroke="#37566D" opacity=".7"/><text x="39" y="39" font-size="13" fill="#70DFF1" font-weight="bold" letter-spacing="1.4" text-anchor="start">SOURCE  /  RELATION  /  CONTINUATION</text><circle class="horizon" cx="1127" cy="35" r="6" fill="#61D8E9"/><g class="reveal"><text x="46" y="155" font-size="73" fill="#F3F8FF" font-weight="bold" letter-spacing="-2" text-anchor="start">HUNTING</text><text x="46" y="233" font-size="71" fill="#DCF1FF" font-weight="bold" letter-spacing="-2" text-anchor="start">THE REFERENT</text><text x="50" y="281" font-size="23" fill="#96D9E9" font-weight="normal" letter-spacing="0" text-anchor="start">Follow the movement.</text><text x="50" y="310" font-size="23" fill="#B9A7F2" font-weight="normal" letter-spacing="0" text-anchor="start">Keep the difference.</text><text x="50" y="351" font-size="14" fill="#B2C5D9" font-weight="normal" letter-spacing="0" text-anchor="start">Language / Mathematics / Witness / Continuity</text></g><circle cx="1010" cy="351" r="150" fill="url(#glow)"/><circle cx="1010" cy="351" r="73" fill="none" stroke="#46677F" stroke-dasharray="4 12"/><circle cx="1010" cy="351" r="43" fill="none" stroke="#5BC7EA" stroke-opacity=".43"/><circle class="endpoint" cx="1010" cy="351" r="16" fill="#5DD8EC" fill-opacity=".28" stroke="#59DCED"/><circle cx="1010" cy="351" r="5" fill="#D3FDFF"/><text x="1010" y="294" font-size="12" fill="#8BDFEE" font-weight="bold" letter-spacing="0.4" text-anchor="middle">SAME VERIFIED STATE</text><text x="1010" y="414" font-size="24" fill="#F3F9FF" font-weight="bold" letter-spacing="0" text-anchor="middle">(2,2,1)</text><text x="710" y="180" font-size="12" fill="#ABBCD0" font-weight="normal" letter-spacing="0.4" text-anchor="middle">THE PATHS WERE NOT CHOSEN TO MEET</text><path d="M555 366C670 195 800 205 888 290S966 340 1010 351" fill="none" stroke="#62E4F5" stroke-width="13" stroke-opacity=".09"/><path class="signal " d="M555 366C670 195 800 205 888 290S966 340 1010 351" fill="none" stroke="#62E4F5" stroke-width="3.4"/><text x="690" y="235" font-size="22" fill="#62E4F5" font-weight="bold" letter-spacing="1" text-anchor="start">BBAA</text><text x="675" y="255" font-size="11" fill="#899FB7" font-weight="normal" letter-spacing="0" text-anchor="start">verified from native A/B steps</text><path d="M555 366C675 520 793 514 891 408S973 362 1010 351" fill="none" stroke="#A899FA" stroke-width="13" stroke-opacity=".09"/><path class="signal lower" d="M555 366C675 520 793 514 891 408S973 362 1010 351" fill="none" stroke="#A899FA" stroke-width="3.4"/><text x="690" y="494" font-size="22" fill="#A899FA" font-weight="bold" letter-spacing="1" text-anchor="start">ABABB</text><text x="675" y="516" font-size="11" fill="#899FB7" font-weight="normal" letter-spacing="0" text-anchor="start">verified from native A/B steps</text><circle cx="555" cy="366" r="7" fill="#DCF0FC"/><text x="548" y="396" font-size="11" fill="#C9DAE6" font-weight="normal" letter-spacing="0" text-anchor="middle">ORIGIN (0,0,0)</text><path d="M45 559H1155" stroke="#40607A"/><g class="reveal delayed"><text x="48" y="589" font-size="13" fill="#80C7E7" font-weight="bold" letter-spacing="1.2" text-anchor="start">ORIGINAL RESEARCH  /  SOURCE-OWNED</text><text x="49" y="621" font-size="16" fill="#D3E4EE" font-weight="normal" letter-spacing="0" text-anchor="start">Moves, walls, corrections and unfinished relations remain inspectable.</text><text x="49" y="647" font-size="12" fill="#8DA8C4" font-weight="normal" letter-spacing="0" text-anchor="start">The workstation indexes the full available repository source, without inventing past events.</text></g><path d="M45 671H1155" stroke="#29475E"/><text x="49" y="706" font-size="13" fill="#74D9EA" font-weight="bold" letter-spacing="0.2" text-anchor="start">14 STRUCTURED RECORDS</text><text x="419" y="706" font-size="13" fill="#A2CFF1" font-weight="bold" letter-spacing="0.2" text-anchor="start">2 EXPLICIT MOVES</text><text x="734" y="706" font-size="13" fill="#C2B7FA" font-weight="bold" letter-spacing="0.2" text-anchor="start">4 RECORDED WALLS</text><text x="1144" y="706" font-size="11" fill="#789AB4" font-weight="normal" letter-spacing="0" text-anchor="end">SOURCE SUBSET</text></svg>
