<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1010" viewBox="0 0 1050 1010" role="img" aria-labelledby="title desc">
<title id="title">James Muneoka — visual provenance concept</title>
<desc id="desc">Illustrative GitHub research visual showing independent lanes, a source witness, subsequent movement, scoped evidence, and preserved open boundaries. Not live data.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c25"/><stop offset="1" stop-color="#0d1117"/></linearGradient><linearGradient id="accent"><stop stop-color="#6bd8cf"/><stop offset="1" stop-color="#8cb1ef"/></linearGradient></defs>
<rect width="1050" height="1010" fill="#0d1117"/>
<rect x="20" y="20" width="1010" height="968" rx="16" fill="url(#bg)" stroke="#364451" stroke-width="2"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="54" y="62" font-size="14" fill="#78dccd" letter-spacing="3">RESEARCH · OBSERVATION · CONTINUITY</text>
<text x="54" y="125" font-size="49" fill="#e6edf3" font-weight="700">James Muneoka<tspan fill="#78d3d1">.</tspan></text>
<text x="54" y="159" font-size="16" fill="#b2c1cd">Investigating relationships through movement, correction, and change.</text>
<text x="54" y="181" font-size="16" fill="#b2c1cd">Observations, finite mathematical models, witnesses, and open questions.</text>
<rect x="839" y="56" width="157" height="133" rx="16" fill="#172a33" stroke="#3c6770"/>
<text x="916" y="119" font-size="31" text-anchor="middle" fill="#7cddd9" font-weight="700" font-family="Consolas,monospace">A↔B</text>
<text x="916" y="146" font-size="12" text-anchor="middle" fill="#9db4c4" font-family="monospace">LANGUAGE</text>
<text x="916" y="163" font-size="12" text-anchor="middle" fill="#9db4c4" font-family="monospace">REFERENT</text>
<g font-size="13" font-family="Consolas,monospace">
<rect x="54" y="210" width="216" height="35" rx="16" fill="#122a2d" stroke="#346b6b"/><text x="69" y="232" fill="#b4e9df">◇ Language Referent</text>
<rect x="282" y="210" width="196" height="35" rx="16" fill="#231e37" stroke="#625382"/><text x="298" y="232" fill="#d4c5ff">↗ Finite constructions</text>
<rect x="490" y="210" width="213" height="35" rx="16" fill="#30251a" stroke="#715a39"/><text x="505" y="232" fill="#e9d3a0">⎇ Witnessed relations</text>
<rect x="715" y="210" width="168" height="35" rx="16" fill="#1d2833" stroke="#485b6c"/><text x="730" y="232" fill="#bfd1df">◌ Open boundaries</text>
</g>
<line x1="54" x2="996" y1="278" y2="278" stroke="#33414c"/>
<text x="54" y="318" font-size="26" font-weight="700" fill="#edf3f8">Visible movement</text>
