<rect x="75" y="379" width="135" height="66" rx="9" fill="#193436" stroke="#377d75"/><text x="142" y="406" font-size="16" fill="#a3e5da" font-weight="bold">LANE A</text><text x="142" y="427" font-size="12" fill="#a7c8c4">observation</text>
<rect x="75" y="483" width="135" height="66" rx="9" fill="#28213b" stroke="#77639b"/><text x="142" y="509" font-size="16" fill="#d5c1ff" font-weight="bold">LANE B</text><text x="142" y="530" font-size="12" fill="#c1b0de">observation</text>
<rect x="311" y="379" width="156" height="66" rx="9" fill="#152d35" stroke="#3b7884"/><text x="389" y="406" font-size="14" fill="#b0dde1">independent</text><text x="389" y="427" font-size="12" fill="#9cb6bf">branch evidence</text>
<rect x="311" y="483" width="156" height="66" rx="9" fill="#251f38" stroke="#65558c"/><text x="389" y="510" font-size="14" fill="#d5c6ff">independent</text><text x="389" y="531" font-size="12" fill="#b7a7cf">branch evidence</text>
<rect x="605" y="421" width="151" height="82" rx="10" fill="#302a1e" stroke="#a3894d"/><text x="680" y="451" font-size="16" fill="#f5d48e" font-weight="bold">WITNESS</text><text x="680" y="470" font-size="12" fill="#d2c2a2">source check</text><text x="680" y="486" font-size="12" fill="#d2c2a2">and relation</text>
<rect x="810" y="418" width="167" height="89" rx="10" fill="#1d3039" stroke="#427c91"/><text x="893" y="449" font-size="15" fill="#a1e2ea" font-weight="bold">CONTINUE</text><text x="893" y="472" font-size="11" fill="#d2dae0">supported path</text><text x="893" y="488" font-size="11" fill="#eacb88">or unresolved wall</text>
</g>
<text x="75" y="563" font-size="13" font-family="monospace" fill="#90a8b7">Two histories stay separate. Similar labels alone do not prove a join.</text>
<g font-size="14" fill="#aebbc6">
<text x="54" y="620"><tspan fill="#ecf5fa" font-weight="700">Origin stays visible</tspan><tspan dx="15">Where and how each observation arose.</tspan></text>
<text x="54" y="648"><tspan fill="#ecf5fa" font-weight="700">Corrections survive</tspan><tspan dx="15">Older records aren't silently rewritten.</tspan></text>
<text x="54" y="676"><tspan fill="#ecf5fa" font-weight="700">Unknown stays unknown</tspan><tspan dx="15">A candidate doesn't become proof through design.</tspan></text>
</g>
<line x1="54" x2="996" y1="704" y2="704" stroke="#33414c"/>
<text x="54" y="744" font-size="26" font-weight="700" fill="#edf3f8">Evidence trace</text>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<rect x="54" y="766" width="454" height="70" rx="9" fill="#161e28" stroke="#3b4e60"/>
<text x="72" y="793" font-size="16" font-weight="650" fill="#ecf3f8">B2–B7 · Workstation continuation</text>
<text x="72" y="817" font-size="13" fill="#a6b8c8">Source history · Native returns · Recheck boundaries</text>
<rect x="391" y="776" width="102" height="24" rx="7" fill="#173b36"/><text x="442" y="792" font-size="12" text-anchor="middle" fill="#78dfce">SCOPED</text>
<rect x="527" y="766" width="469" height="70" rx="9" fill="#161e28" stroke="#3b4e60"/>
<text x="545" y="793" font-size="16" font-weight="650" fill="#ecf3f8">B9–B18 · Native observation</text>
<text x="545" y="817" font-size="13" fill="#a6b8c8">Route candidates · Signed delivery · Local coordination</text>
<rect x="885" y="776" width="96" height="24" rx="7" fill="#2e2840"/><text x="933" y="792" font-size="12" text-anchor="middle" fill="#cfb6ff">SCOPED</text>
<rect x="54" y="849" width="942" height="65" rx="9" fill="#241f20" stroke="#6d5a49"/>
<text x="72" y="875" font-size="16" font-weight="650" fill="#f1e0d3">Cross-host autonomous cluster</text>
<text x="72" y="899" font-size="13" fill="#c5b3a4">No automatic inference of independent owner authority or multi-host operation.</text>
<rect x="864" y="861" width="118" height="24" rx="7" fill="#3b2e18"/><text x="923" y="877" font-size="12" text-anchor="middle" fill="#f1cd83">UNVERIFIED</text>
</g>
<text x="54" y="946" font-family="Consolas,monospace" font-size="14" fill="#94aab8">SOURCE → OBSERVATION → RELATION → WITNESS → NEXT ADMISSIBLE STEP</text>
<text x="54" y="969" font-family="Consolas,monospace" font-size="12" fill="#e6c889">Concept only · NOT live testimony, measured deployment, or current-status verification.</text>
</g></svg>