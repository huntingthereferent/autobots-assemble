[project]
name = "applied-ml-modeling"
version = "0.1.0"
description = "Evidence-first applied machine learning modeling workflow"
requires-python = ">=3.11"
dependencies = [
  "scikit-learn>=1.7,<2",
  "pandas>=2.2,<3",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["ml_evidence"]
