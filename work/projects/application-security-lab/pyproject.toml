[project]
name = "application-security-lab"
version = "0.1.0"
description = "Owned local application-security remediation witness"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["appsec_lab"]
