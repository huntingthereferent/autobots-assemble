name: public-data-monitor

on:
  push:
    paths:
      - "work/projects/public-data-monitor/**"
  pull_request:
    paths:
      - "work/projects/public-data-monitor/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/projects/public-data-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q
