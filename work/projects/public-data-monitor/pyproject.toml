[project]
name = "public-data-monitor"
version = "0.1.0"
description = "Evidence-first public data monitoring application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "jinja2>=3.1,<4",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
