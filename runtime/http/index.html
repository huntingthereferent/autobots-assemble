<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="visual-template" content="continuity_social_hub_v1">
  <title>Continuity</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="hub-shell">
    <aside class="left-nav">
      <div class="brand">Continuity</div>
      <nav>
        <button class="nav-item active">Home</button>
        <button class="nav-item">Following</button>
        <button class="nav-item">Threads</button>
        <button class="nav-item">Activity</button>
        <button class="nav-item">Calendar</button>
        <button class="nav-item">School</button>
        <button class="nav-item">Work</button>
      </nav>
      <button id="ohayo" class="profile-button">ohayo</button>
    </aside>

    <section class="feed-column">
      <header class="feed-header">
        <div>
          <p class="eyebrow">Home</p>
          <h1>Continuity</h1>
        </div>
        <button class="ghost">New</button>
      </header>

      <section class="composer panel">
        <div class="avatar">C</div>
        <div class="composer-body">
          <textarea id="composer-text" placeholder="What is happening?"></textarea>
          <div class="composer-actions">
            <span>Post to the hub</span>
            <button class="primary">Post</button>
          </div>
        </div>
      </section>

      <section class="feed-tabs">
        <button class="tab active">For you</button>
        <button class="tab">Following</button>
        <button class="tab">Current</button>
      </section>

      <section id="handoffs" class="feed"></section>

      <section class="feed-secondary">
        <div class="section-head">
          <div>
            <p class="eyebrow">Current attention</p>
            <h2>In front now</h2>
          </div>
          <span id="activation-note"></span>
        </div>
        <div id="attention-tasks" class="feed"></div>
      </section>
    </section>

    <aside class="right-rail">
      <section class="rail-card">
        <p class="eyebrow">Activity</p>
        <div id="attention-reminders" class="stack"></div>
      </section>

      <section class="rail-card">
        <p class="eyebrow">Time</p>
        <div id="attention-calendar" class="stack"></div>
      </section>

      <section class="rail-card">
        <p class="eyebrow">Sources</p>
        <div class="source-list">
          <span>School</span>
          <span>Calendar</span>
          <span>Personal</span>
          <span>Factory</span>
          <span>Research</span>
          <span>Jobs</span>
        </div>
      </section>

      <details class="rail-card manage">
        <summary>Manage local layers</summary>
        <div class="manage-grid">
          <form id="note-form" class="form">
            <textarea name="body" required placeholder="Add note"></textarea>
            <input name="referent" placeholder="Referent">
            <button class="secondary">Save note</button>
          </form>

          <form id="plan-form" class="form">
            <input name="title" required placeholder="Plan">
            <input name="referent" required placeholder="Referent">
            <textarea name="steps" placeholder="Steps"></textarea>
            <button class="secondary">Save plan</button>
          </form>

          <form id="calendar-form" class="form">
            <input name="title" required placeholder="Calendar relation">
            <input name="referent" required placeholder="Referent">
            <input name="starts_at" type="datetime-local">
            <button class="secondary">Add time</button>
          </form>

          <form id="reminder-form" class="form">
            <input name="text" required placeholder="Reminder">
            <input name="referent" required placeholder="Referent">
            <input name="local_time" type="time">
            <button class="secondary">Add reminder</button>
          </form>

          <form id="task-form" class="form">
            <input name="title" required placeholder="Task">
            <input name="referent" required placeholder="Referent">
            <input name="assignee" required value="james" placeholder="Assignee">
            <button class="secondary">Create task</button>
          </form>
        </div>
      </details>
    </aside>

    <section hidden>
      <div id="stats"></div>
      <div id="notes"></div>
      <div id="plans"></div>
      <div id="calendar-events"></div>
      <div id="reminders"></div>
      <div id="tasks"></div>
    </section>

    <p id="error" class="error" hidden></p>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
